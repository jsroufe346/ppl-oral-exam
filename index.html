<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PPL Oral">
<meta name="format-detection" content="telephone=no">
<title>PPL Oral Exam Study Guide — C172S G1000 / KBEC</title>
<style>
:root{
  --bg:#0b1220; --panel:#131c2e; --panel2:#1a2540; --line:#243249;
  --txt:#e7edf7; --dim:#93a3bd; --accent:#4da3ff; --accent2:#7ee0c0;
  --red:#ff6b6b; --amber:#ffc048; --green:#4ade80; --purple:#b48cff;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
a{color:var(--accent)}
header{
  position:sticky; top:0; z-index:50; background:rgba(11,18,32,.96);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 10px calc(14px + env(safe-area-inset-left,0px));
}
.htop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
.sub{font-size:11px;color:var(--dim);font-weight:500}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px;display:flex}
.bar i{display:block;height:100%;transition:width .3s}
.bar .g{background:var(--green)} .bar .a{background:var(--amber)} .bar .r{background:var(--red)}
.stats{display:flex;gap:12px;font-size:11px;color:var(--dim);margin-top:5px;flex-wrap:wrap}
.stats b{color:var(--txt)}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:4px;vertical-align:middle}

.controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
input[type=search]{
  flex:1 1 200px;min-width:0;background:var(--panel);border:1px solid var(--line);
  color:var(--txt);padding:9px 12px;border-radius:var(--radius);font-size:16px;
  -webkit-appearance:none;appearance:none;
}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px}
button,.btn{
  background:var(--panel);border:1px solid var(--line);color:var(--txt);
  padding:8px 12px;border-radius:var(--radius);font-size:13px;cursor:pointer;
  font-family:inherit;white-space:nowrap;touch-action:manipulation;-webkit-appearance:none;appearance:none;
}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#06203f;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:6px 11px;border-radius:99px;font-size:12px;cursor:pointer;font-family:inherit;
  touch-action:manipulation;-webkit-appearance:none;appearance:none;
}
.chip.on{background:var(--accent);color:#06203f;border-color:var(--accent);font-weight:700}
.chip.prio{border-color:var(--red);color:#ffb3b3}
.chip.prio.on{background:var(--red);color:#2a0000;border-color:var(--red)}

main{padding:14px calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));max-width:900px;margin:0 auto}
.areahead{
  margin:22px 0 10px;padding-bottom:7px;border-bottom:2px solid var(--line);
  font-size:13px;letter-spacing:.9px;text-transform:uppercase;color:var(--accent2);font-weight:700;
}
.areahead:first-child{margin-top:4px}

.card{
  background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:var(--radius);margin:9px 0;overflow:hidden;
}
.card.k-3{border-left-color:var(--green)}
.card.k-2{border-left-color:var(--amber)}
.card.k-1{border-left-color:var(--red)}
.card.prio{background:linear-gradient(90deg,rgba(255,107,107,.07),var(--panel) 160px)}
.q{padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.q:hover{background:var(--panel2)}
.qt{flex:1;font-weight:600;font-size:14.5px}
.acs{
  font:600 10px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--dim);background:var(--panel2);border:1px solid var(--line);
  padding:2px 6px;border-radius:5px;white-space:nowrap;margin-top:1px;
}
.acs.prio{background:rgba(255,107,107,.18);color:#ffb3b3;border-color:rgba(255,107,107,.45)}
.a{display:none;padding:0 14px 13px;border-top:1px solid var(--line);font-size:14px}
.card.open .a{display:block}
.a ul{margin:9px 0;padding-left:20px} .a li{margin:4px 0}
.a p{margin:9px 0}
.a code,.reg{
  font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--panel2);padding:1px 5px;border-radius:4px;color:var(--accent2);
}
.memo{
  background:rgba(180,140,255,.1);border-left:3px solid var(--purple);
  padding:8px 11px;border-radius:6px;margin:10px 0;font-size:13.5px;
}
.memo b{color:var(--purple)}
.dpe{
  background:rgba(255,192,72,.09);border-left:3px solid var(--amber);
  padding:8px 11px;border-radius:6px;margin:10px 0;font-size:13.5px;
}
.dpe b{color:var(--amber)}
.warn{
  background:rgba(255,107,107,.1);border-left:3px solid var(--red);
  padding:8px 11px;border-radius:6px;margin:10px 0;font-size:13.5px;
}
.warn b{color:var(--red)}
.tail{
  background:rgba(77,163,255,.08);border-left:3px solid var(--accent);
  padding:8px 11px;border-radius:6px;margin:10px 0;font-size:13.5px;
}
.tail b{color:var(--accent)}
.refs{
  margin-top:12px;padding-top:9px;border-top:1px dashed var(--line);
  font-size:11.5px;color:var(--dim);line-height:1.5;
}
.refs b{color:var(--accent2);font-weight:700;letter-spacing:.4px}
.refs .reg{font-size:11px;background:var(--panel2);color:var(--accent2)}
.rate{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.rate button{flex:1;min-width:92px;font-size:12.5px;padding:9px 6px}
.rate .r1.on{background:var(--red);border-color:var(--red);color:#2a0000;font-weight:700}
.rate .r2.on{background:var(--amber);border-color:var(--amber);color:#2a1c00;font-weight:700}
.rate .r3.on{background:var(--green);border-color:var(--green);color:#042a12;font-weight:700}

/* flashcard mode */
#flash{display:none;padding:14px calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));max-width:760px;margin:0 auto}
body.flashmode #browse{display:none}
body.flashmode #flash{display:block}
.fcard{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:20px;min-height:46vh;display:flex;flex-direction:column;
}
.fq{font-size:19px;font-weight:700;line-height:1.4;margin:14px 0}
.fa{display:none;border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:14.5px}
.fcard.rev .fa{display:block}
.fcard.rev .tapme{display:none}
.tapme{color:var(--dim);font-size:13px;text-align:center;margin-top:auto;padding:16px 0}
.fnav{display:flex;gap:8px;margin-top:12px;align-items:center}
.fnav button{flex:1}
.counter{font-size:12px;color:var(--dim);text-align:center;margin-top:8px}

.empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:14px}
.note{font-size:11.5px;color:var(--dim);margin-top:26px;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
/* ---- phones: bigger touch targets, leaner sticky header ---- */
@media (max-width:560px){
  header{padding-bottom:8px}
  h1{font-size:15px}
  header .sub{display:none}
  .stats{gap:9px;font-size:10.5px;margin-top:4px}
  .controls{margin-top:8px;gap:7px}
  input[type=search]{flex:1 1 110px}
  .chips{padding:8px 0 2px}
  button,.btn{padding:11px 10px;font-size:13px}
  .chip{padding:9px 14px;font-size:12.5px}
  .rate button{min-width:0;padding:13px 6px;font-size:13px}
  .q{padding:13px 13px}
  .fq{font-size:18px}
  .fcard{min-height:54vh;padding:16px}
  .fnav button{padding:14px 8px}
}
/* ---- flashcard swipe hint ---- */
.swipehint{display:none;text-align:center;font-size:11px;color:var(--dim);margin-top:10px}
@media (pointer:coarse){.swipehint{display:block}}

@media print{
  header,.rate,.chips,.controls,#flash{display:none!important}
  body{background:#fff;color:#000} .card,.a{display:block!important}
  .card{break-inside:avoid;border:1px solid #ccc}
}
</style>
</head>
<body>

<header>
  <div class="htop">
    <div style="flex:1;min-width:150px">
      <h1>PPL Oral Exam Study Guide</h1>
      <div class="sub">ASEL &middot; Cessna 172S G1000 &middot; KBEC &middot; built on the Airplane ACS</div>
    </div>
    <button id="modeBtn">Flashcards</button>
    <button id="resetBtn" title="Clear all confidence ratings">Reset</button>
  </div>
  <div class="bar">
    <i class="g" id="bg" style="width:0"></i><i class="a" id="ba" style="width:0"></i><i class="r" id="br" style="width:0"></i>
  </div>
  <div class="stats">
    <span><span class="dot" style="background:var(--green)"></span>Solid <b id="n3">0</b></span>
    <span><span class="dot" style="background:var(--amber)"></span>Shaky <b id="n2">0</b></span>
    <span><span class="dot" style="background:var(--red)"></span>Review <b id="n1">0</b></span>
    <span>Unrated <b id="n0">0</b></span>
    <span>Showing <b id="nShown">0</b></span>
  </div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search questions, answers, FAR cites, ACS codes…" autocomplete="off">
    <button id="weakBtn" title="Show only Shaky + Review + Unrated">Weak only</button>
    <button id="expandBtn">Expand all</button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="browse"></main>

<section id="flash">
  <div class="fcard" id="fcard">
    <div style="display:flex;gap:8px;align-items:center">
      <span class="acs" id="facs"></span><span class="sub" id="farea"></span>
    </div>
    <div class="fq" id="fq"></div>
    <div class="tapme">tap to reveal answer</div>
    <div class="fa" id="fa"></div>
    <div class="rate" id="frate">
      <button class="r1" data-r="1">Review</button>
      <button class="r2" data-r="2">Shaky</button>
      <button class="r3" data-r="3">Solid</button>
    </div>
  </div>
  <div class="fnav">
    <button id="prevBtn">&larr; Prev</button>
    <button id="shufBtn">Shuffle</button>
    <button id="nextBtn">Next &rarr;</button>
  </div>
  <div class="counter" id="fcount"></div>
  <div class="swipehint">swipe left / right to change cards</div>
</section>

<script>
/* ============================================================
   DATA
   ============================================================ */
const AREAS = {
  I:   "I. Preflight Preparation",
  II:  "II. Preflight Procedures",
  III: "III. Airport and Seaplane Base Operations",
  IV:  "IV. Takeoffs, Landings, and Go-Arounds",
  V:   "V. Performance Maneuvers and Ground Reference Maneuvers",
  VI:  "VI. Navigation",
  VII: "VII. Slow Flight and Stalls",
  VIII:"VIII. Basic Instrument Maneuvers",
  IX:  "IX. Emergency Operations",
  XI:  "XI. Night Operations",
  XII: "XII. Postflight Procedures"
};

const DATA = [];

/* ---------- AREA I — PREFLIGHT PREPARATION ---------- */
DATA.push(

/* I.A Pilot Qualifications */
{id:"IA1", area:"I", acs:"PA.I.A.K1", src:"<span class='reg'>14 CFR 61.3(a)</span> <span class='reg'>61.3(c)</span> <span class='reg'>61.23</span> &middot; PHAK ch. 1", tags:"certificate documents medical photo id",
 q:"What documents must you personally have on board to act as PIC?",
 a:`<ul>
  <li><b>Pilot certificate</b> — no expiration</li>
  <li><b>Photo ID</b> — government-issued (driver's license, passport, military ID)</li>
  <li><b>Medical certificate</b> or BasicMed qualification (course completion + CMEC)</li>
 </ul>
 <div class="memo"><b>Memory aid:</b> "<b>PIC</b> = <b>P</b>hoto ID, <b>I</b>D card (certificate), <b>C</b>ertificate of medical."</div>
 <p><span class="reg">14 CFR 61.3(a), 61.3(c)</span> — must be in your <i>physical possession or readily accessible in the aircraft</i>.</p>
 <div class="dpe"><b>DPE follow-up:</b> "Can you show them to me right now?" Bring all three to the checkride — a missing photo ID is a legitimate reason the exam can't start.</div>`},

{id:"IA2", area:"I", acs:"PA.I.A.K2", src:"<span class='reg'>14 CFR 61.113</span> &middot; PHAK ch. 1", tags:"privileges limitations 61.113 compensation hire pro rata",
 q:"What are the privileges and limitations of a Private Pilot certificate?",
 a:`<p><b>Privileges:</b> carry passengers and baggage, fly for pleasure or personal business.</p>
 <p><b>Core limitation</b> <span class="reg">61.113(a)</span>: may not act as PIC of an aircraft carrying passengers or property <b>for compensation or hire</b>, nor may you act as PIC <b>for compensation or hire</b>.</p>
 <p><b>Exceptions you should know:</b></p>
 <ul>
  <li><b>(c) Pro rata share</b> — you may share the <i>pro rata</i> cost of fuel, oil, airport expenditures, and rental fees. You pay at least your equal share.</li>
  <li><b>(b) Incidental to business</b> — flight is incidental to the business/employment and you carry no passengers or property for compensation or hire.</li>
  <li><b>(d) Charitable airlift</b> — with restrictions and sponsor notification.</li>
  <li><b>(e) Search and rescue</b> under a qualified organization.</li>
  <li><b>(f) Aircraft salesman</b> — 200+ hours, demonstrating aircraft to a buyer.</li>
  <li><b>(g) Towing gliders/ultralights</b> if you meet <span class="reg">61.69</span>.</li>
  <li><b>(h) Flight instruction</b> — you may receive instruction and act as PIC.</li>
 </ul>
 <div class="warn"><b>Common trap:</b> "pro rata" means you divide by <i>total occupants including yourself</i> — 4 people on board, you pay at least 1/4. You can never make a profit, and there must be a <b>common purpose</b> for the flight.</div>`},

{id:"IA3", area:"I", acs:"PA.I.A.K3", src:"<span class='reg'>14 CFR 61.23</span> <span class='reg'>61.53</span> <span class='reg'>Part 67</span> <span class='reg'>Part 68 (BasicMed)</span> &middot; AIM 8-1-1", tags:"medical class duration 61.23 basicmed",
 q:"What medical certificate do you need, and how long is it valid?",
 a:`<p>Private pilot privileges require at least a <b>third-class medical</b> <span class="reg">61.23(a)(3)</span>.</p>
 <p><b>Third-class duration</b> <span class="reg">61.23(d)</span> — valid through the <b>last day of the month</b> of issue:</p>
 <ul>
  <li>Under age 40 at exam: <b>60 calendar months</b> (5 years)</li>
  <li>Age 40 or older at exam: <b>24 calendar months</b> (2 years)</li>
 </ul>
 <p><b>BasicMed</b> <span class="reg">61.113(i), 68.3</span> alternative — requires: held a valid medical after 7/14/2006, comprehensive medical exam with a state-licensed physician every <b>48 months</b>, online medical education course every <b>24 calendar months</b>, and operating limits: ≤6 occupants, ≤6,000 lb MTOW, below 18,000 ft MSL, ≤250 KIAS, not for compensation or hire.</p>
 <div class="dpe"><b>DPE follow-up:</b> "What if you develop a medical condition after your exam?" → <span class="reg">61.53</span>: you may not act as PIC if you know of any medical condition that makes you unable to meet the requirements — this applies even with a current medical in your pocket.</div>`},

{id:"IA4", area:"I", acs:"PA.I.A.K3", src:"<span class='reg'>14 CFR 61.56</span> <span class='reg'>61.57(a)-(b)</span> <span class='reg'>91.209</span> <span class='reg'>1.1 (night)</span>", tags:"currency flight review 61.56 90 day passenger night",
 q:"What makes you current to carry passengers today?",
 a:`<p><b>1. Flight review</b> <span class="reg">61.56</span> — within the preceding <b>24 calendar months</b>: 1 hour ground + 1 hour flight with an authorized instructor, with a logbook endorsement. (A new certificate/rating practical test resets it.)</p>
 <p><b>2. Passenger currency</b> <span class="reg">61.57(a)</span> — within the preceding <b>90 days</b>: <b>3 takeoffs and 3 landings</b> as sole manipulator in the same <b>category, class, and type</b> (if type rated).</p>
 <p><b>3. Night passenger currency</b> <span class="reg">61.57(b)</span> — 3 takeoffs and 3 landings <b>to a full stop</b> within 90 days, performed during the period from <b>1 hour after sunset to 1 hour before sunrise</b>.</p>
 <div class="memo"><b>Three different "night" definitions — know them cold:</b><br>
  • <b>Position lights:</b> sunset to sunrise <span class="reg">91.209</span><br>
  • <b>Night currency / landings:</b> 1 hr after sunset to 1 hr before sunrise <span class="reg">61.57(b)</span><br>
  • <b>Logging night flight time:</b> end of evening civil twilight to beginning of morning civil twilight <span class="reg">1.1</span></div>
 <p>Also required if you fly a <b>tailwheel</b> airplane: landings must be to a full stop <span class="reg">61.57(a)(2)</span>.</p>`},

{id:"IA5", area:"I", acs:"PA.I.A.K1", src:"<span class='reg'>14 CFR 61.51</span> <span class='reg'>61.59</span>", tags:"logbook 61.51 logging endorsements address change 61.60",
 q:"What flight time are you required to log, and how long must you keep records?",
 a:`<p><span class="reg">61.51(a)</span> — you must document and record only:</p>
 <ul>
  <li>Training and aeronautical experience used to <b>meet requirements</b> for a certificate, rating, or flight review</li>
  <li>Aeronautical experience required for <b>recency of experience</b> (61.57)</li>
 </ul>
 <p>Everything else is optional (though insurers and employers care). Records must be kept until the purpose is served — keep the endorsements for a certificate indefinitely.</p>
 <p><b>Change of address</b> <span class="reg">61.60</span> — notify the FAA Airman Certification Branch within <b>30 days</b>; after 30 days you may not exercise certificate privileges.</p>`},

{id:"IA6", area:"I", acs:"PA.I.A.R1", src:"<span class='reg'>14 CFR 91.17</span> <span class='reg'>91.19</span> <span class='reg'>61.15</span> &middot; AIM 8-1-1", tags:"alcohol drugs 91.17 8 hours 0.04 IMSAFE",
 q:"What are the regulations regarding alcohol and drugs?",
 a:`<p><span class="reg">91.17</span> — no person may act as a crewmember:</p>
 <ul>
  <li>Within <b>8 hours</b> after consuming any alcoholic beverage ("8 hours bottle to throttle")</li>
  <li>While under the influence of alcohol</li>
  <li>With a blood alcohol concentration of <b>0.04</b> or greater</li>
  <li>While using any drug that affects faculties in a way contrary to safety</li>
 </ul>
 <p><span class="reg">61.15</span> — a <b>motor vehicle</b> alcohol/drug conviction must be reported in writing to the FAA Civil Aviation Security Division within <b>60 days</b>. A refusal to submit to testing counts.</p>
 <div class="warn"><b>Reality check:</b> 8 hours is a legal floor, not a safety standard. Alcohol's effects on judgment and night vision persist well past 8 hours, and a hangover degrades performance with a BAC of 0.00.</div>`},

{id:"IA7", area:"I", acs:"PA.I.A.K1", src:"<span class='reg'>49 CFR 830.2</span> <span class='reg'>830.5</span> <span class='reg'>830.10</span> <span class='reg'>830.15</span>", tags:"NTSB 830 accident incident reporting",
 q:"When must you notify the NTSB, and when is a written report required?",
 a:`<p><b>NTSB Part 830</b>. Notify the NTSB <b>immediately</b> for an <b>accident</b> or any of these listed incidents:</p>
 <ul>
  <li>Flight control system malfunction or failure</li>
  <li>Crewmember unable to perform duties due to illness/injury</li>
  <li>In-flight fire</li>
  <li>Aircraft collision in flight</li>
  <li>Damage to property (other than the aircraft) over <b>$25,000</b></li>
  <li>Turbine engine failure from internal component damage</li>
  <li>Release of all or part of a propeller blade</li>
  <li>Complete loss of information from more than 50% of the EFIS displays</li>
  <li>Aircraft is <b>overdue</b> and believed to be in an accident</li>
 </ul>
 <p><b>Accident</b> = substantial damage, or death or serious injury, between the time anyone boards with intent of flight and all have disembarked.</p>
 <p><b>Written report:</b> within <b>10 days</b> for an accident; for a listed incident only when requested. <b>Wreckage</b> may not be disturbed except to protect life, protect from further damage, or protect the public.</p>
 <div class="memo"><b>Not substantial damage:</b> engine damage limited to one engine, bent fairings/cowling, dented skin, ground damage to rotor/propeller blades, damage to landing gear, wheels, tires, flaps, brakes.</div>`},

/* I.B Airworthiness Requirements */
{id:"IB1", area:"I", acs:"PA.I.B.K1", src:"<span class='reg'>14 CFR 91.9</span> <span class='reg'>91.203</span> <span class='reg'>47.31</span> &middot; PHAK ch. 9", tags:"ARROW required documents aircraft 91.9 91.203",
 q:"What documents must be on board the aircraft?",
 a:`<div class="memo"><b>ARROW</b><br>
 <b>A</b>irworthiness certificate <span class="reg">91.203(a)(1)</span> — displayed where legible to passengers/crew, no expiration<br>
 <b>R</b>egistration certificate <span class="reg">91.203(a)(2)</span> — expires every 7 years (renewable)<br>
 <b>R</b>adio station license — <i>international flights only</i> (FCC)<br>
 <b>O</b>perating limitations <span class="reg">91.9</span> — POH/AFM, placards, markings<br>
 <b>W</b>eight and balance data — current, aircraft-specific</div>
 <div class="dpe"><b>DPE follow-up:</b> "Is the POH on the shelf good enough?" No — you need the <b>AFM for that specific serial number</b>, including the current equipment list and the most recent weight and balance. A generic POH is not an operating limitation document.</div>`},

{id:"IB2", area:"I", acs:"PA.I.B.K2", src:"<span class='reg'>14 CFR 91.409</span> <span class='reg'>91.411</span> <span class='reg'>91.413</span> <span class='reg'>91.207(d)</span> <span class='reg'>91.171</span> <span class='reg'>43.11</span>", tags:"inspections annual 100 hour AV1ATE transponder altimeter ELT VOR",
 q:"What inspections must be current for your airplane to be airworthy?",
 a:`<div class="memo"><b>A-V-1-A-T-E</b><br>
 <b>A</b>nnual — every <b>12 calendar months</b> <span class="reg">91.409(a)</span>, signed by an IA<br>
 <b>V</b>OR check — every <b>30 days</b>, <i>IFR only</i> <span class="reg">91.171</span><br>
 <b>1</b>00-hour — required if carrying persons for hire or giving flight instruction for hire in a provided aircraft <span class="reg">91.409(b)</span><br>
 <b>A</b>ltimeter &amp; static system — <b>24 calendar months</b>, <i>IFR only</i> <span class="reg">91.411</span><br>
 <b>T</b>ransponder — <b>24 calendar months</b> <span class="reg">91.413</span><br>
 <b>E</b>LT — <b>12 calendar months</b> <span class="reg">91.207</span></div>
 <p><b>ELT battery</b> must be replaced (or recharged) after <b>1 cumulative hour</b> of use, or when <b>50% of useful life</b> has expired <span class="reg">91.207(c)</span>.</p>
 <p>The <b>100-hour</b> limit may be exceeded by up to <b>10 hours</b> only to reach a place where the inspection can be done — and that excess time is <i>subtracted</i> from the next 100-hour interval.</p>
 <div class="dpe"><b>DPE follow-up:</b> "Your rental 172 is used for instruction — does it need a 100-hour?" Yes, if the flight school provides the aircraft <i>and</i> the instruction. If you bring your own airplane to an instructor, no 100-hour is required.</div>`},

{id:"IB3", area:"I", acs:"PA.I.B.K2", src:"<span class='reg'>14 CFR 91.205(b)-(c)</span> <span class='reg'>91.215</span> <span class='reg'>91.225</span>", tags:"91.205 required equipment day VFR night ATOMATOFLAMES FLAPS",
 q:"What equipment is required for day VFR? For night VFR?",
 a:`<div class="memo"><b>Day VFR — A TOMATO FLAMES</b> <span class="reg">91.205(b)</span><br>
 <b>A</b>irspeed indicator &middot; <b>T</b>achometer &middot; <b>O</b>il pressure gauge &middot; <b>M</b>anifold pressure (each altitude engine) &middot; <b>A</b>ltimeter &middot; <b>T</b>emperature gauge (each liquid-cooled engine) &middot; <b>O</b>il temperature gauge (each air-cooled engine) &middot; <b>F</b>uel gauge &middot; <b>L</b>anding gear position indicator &middot; <b>A</b>nticollision lights &middot; <b>M</b>agnetic compass &middot; <b>E</b>LT &middot; <b>S</b>eatbelts/shoulder harnesses</div>
 <div class="memo"><b>Night adds — FLAPS</b> <span class="reg">91.205(c)</span><br>
 <b>F</b>uses (spare set, 3 of each kind) &middot; <b>L</b>anding light (if for hire) &middot; <b>A</b>nticollision lights &middot; <b>P</b>osition lights &middot; <b>S</b>ource of power (adequate electrical)</div>
 <p>Plus <span class="reg">91.215</span> transponder with Mode C and <span class="reg">91.225</span> ADS-B Out where required.</p>`},

{id:"IB4", area:"I", acs:"PA.I.B.K3", src:"<span class='reg'>14 CFR 91.213(d)</span> <span class='reg'>91.405</span> <span class='reg'>43.9</span>", tags:"inoperative equipment 91.213 MEL placard deactivate",
 q:"You find an inoperative instrument during preflight. Walk me through whether you can fly.",
 a:`<p>With no MEL, use <span class="reg">91.213(d)</span>. The item must <b>not</b> be:</p>
 <ol>
  <li>Part of the VFR-day type certification instruments/equipment in the <b>Kinds of Operations Equipment List (KOEL)</b></li>
  <li>Required by <span class="reg">91.205</span> for the operation being conducted</li>
  <li>Required by an <b>Airworthiness Directive</b></li>
  <li>Required by any other rule for the specific operation (e.g., 91.215 transponder)</li>
 </ol>
 <p>If it clears all four, then it must be <b>removed or deactivated</b> and <b>placarded "INOPERATIVE"</b>. Removal/deactivation by a mechanic; a pilot may placard if deactivation is simply not using it. Finally, the <b>PIC determines the aircraft is still safe</b> to fly <span class="reg">91.7</span>.</p>
 <div class="memo"><b>Order of check:</b> KOEL → 91.205 → AD → other rule → deactivate → placard → PIC determination.</div>
 <p>If it fails the test, you need a <b>Special Flight Permit (ferry permit)</b> <span class="reg">21.197</span> from the FSDO.</p>`},

{id:"IB5", area:"I", acs:"PA.I.B.K3", src:"<span class='reg'>14 CFR 43.3(g)</span> <span class='reg'>43.7</span> <span class='reg'>43.9</span> <span class='reg'>Part 43 App. A(c)</span>", tags:"preventive maintenance part 43 appendix A owner",
 q:"What maintenance can you, as a private pilot, perform yourself?",
 a:`<p><b>Preventive maintenance</b> only, and only if you are the <b>owner or operator</b> and the aircraft is <b>not</b> operated under Part 121/129/135 <span class="reg">43.3(g)</span>. The full list is <span class="reg">Part 43 Appendix A(c)</span> — 32 items including:</p>
 <ul>
  <li>Servicing landing gear wheel bearings, replacing defective safety wire/cotter keys</li>
  <li>Replenishing hydraulic fluid, changing oil, lubrication</li>
  <li>Replacing side windows, seats, safety belts</li>
  <li>Replacing bulbs, reflectors, landing light wiring</li>
  <li>Replacing spark plugs, batteries, prefabricated fuel lines</li>
  <li>Applying preservative/decorative coating, simple fabric patches</li>
 </ul>
 <p>You must make a <b>maintenance record entry</b> <span class="reg">43.9</span>: description of work, date, aircraft total time in service, your name, signature, and certificate number.</p>`},

{id:"IB6", area:"I", acs:"PA.I.B.K1", src:"<span class='reg'>14 CFR 91.7</span> <span class='reg'>91.403</span> <span class='reg'>91.417</span> <span class='reg'>39.7</span> &middot; AC 39-7D", tags:"airworthiness definition 91.7 91.403 AD responsibility",
 q:"What does 'airworthy' mean, and who is responsible?",
 a:`<p><b>Airworthy</b> = (1) the aircraft <b>conforms to its type certificate</b> and approved alterations (STCs, 337s), and (2) it is in a condition for <b>safe operation</b>.</p>
 <ul>
  <li><span class="reg">91.7(a)</span> — no person may operate an aircraft unless it is in an airworthy condition.</li>
  <li><span class="reg">91.7(b)</span> — the <b>PIC</b> is responsible for determining airworthiness and must discontinue the flight when unairworthy conditions occur.</li>
  <li><span class="reg">91.403(a)</span> — the <b>owner/operator</b> is primarily responsible for maintaining the aircraft in airworthy condition, including AD compliance.</li>
 </ul>
 <div class="dpe"><b>DPE follow-up:</b> "Where do you find the AD compliance records?" In the aircraft, engine, and propeller maintenance logbooks — usually as an AD compliance list. Know the difference between <b>one-time</b> and <b>recurring</b> ADs.</div>`},

{id:"IB7", area:"I", acs:"PA.I.B.K2", src:"<span class='reg'>14 CFR 21.197</span> <span class='reg'>21.199</span> <span class='reg'>91.213(d)(3)</span>", tags:"special flight permit ferry 21.197",
 q:"What is a Special Flight Permit and when would you need one?",
 a:`<p><span class="reg">21.197</span> — issued for an aircraft that <b>does not currently meet airworthiness requirements but is capable of safe flight</b>. Obtained from the <b>FSDO</b> (often through a mechanic/DAR). Used for:</p>
 <ul>
  <li>Flying to a base where repairs, alterations, or maintenance will be performed, or to storage</li>
  <li>Delivering or exporting an aircraft</li>
  <li>Production flight testing</li>
  <li>Evacuating an aircraft from an area of impending danger</li>
  <li>Customer demonstration flights</li>
  <li>Operating at weight exceeding max certificated takeoff weight for extended-range flight over water</li>
 </ul>
 <p>The permit specifies operating limitations — typically no passengers, day VFR, specific route.</p>`}
);
