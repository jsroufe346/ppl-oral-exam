/* ★ PRIORITY — PA.I.C.K3h */
{id:"ICK3h", area:"I", acs:"PA.I.C.K3h", src:"<b>ACS PA.I.C.K3h</b> &middot; AIM 7-1-26 Thunderstorms &middot; AIM 7-1-27 Thunderstorm Flying &middot; AIM 7-1-24 Microbursts &middot; AWH FAA-H-8083-28 &middot; PHAK ch. 12", prio:true, tags:"thunderstorm microburst wind shear squall line cumulus mature dissipating",
 q:"★ MISSED CODE — Thunderstorms and microbursts: what causes them, what are the stages, and what are the hazards?",
 a:`<div class="warn"><b>You missed this on the knowledge test, so the DPE must quiz you on it.</b> Expect several minutes here. ACS text: <i>"Meteorology applicable to the departure, en route, alternate, and destination under VFR in VMC, including expected climate and hazardous conditions such as: h. Thunderstorms and microbursts."</i></div>
 <p><b>Three ingredients required</b> for a thunderstorm:</p>
 <ol><li><b>Moisture</b> — sufficient water vapor</li>
 <li><b>Unstable lapse rate</b> — air that keeps rising once lifted</li>
 <li><b>Lifting action</b> — a trigger: frontal lift, convergence, orographic lift, or surface heating</li></ol>
 <div class="memo"><b>Memory aid:</b> "<b>MUL</b>" — <b>M</b>oisture, <b>U</b>nstable air, <b>L</b>ifting action. Remove any one and you get no thunderstorm.</div>
 <p><b>Three stages</b> (Aviation Weather Handbook FAA-H-8083-28; PHAK ch. 12):</p>
 <ul>
  <li><b>Cumulus</b> — dominated by <b>updrafts</b>; the building stage. <i>No precipitation reaching the ground yet.</i> Updrafts can exceed 3,000 fpm.</li>
  <li><b>Mature</b> — <b>precipitation begins at the surface</b>; this is the signal the cell has matured. <b>Updrafts AND downdrafts coexist</b> — this is the <b>most violent and hazardous</b> stage. Expect severe turbulence, lightning, hail, and wind shear.</li>
  <li><b>Dissipating</b> — dominated by <b>downdrafts</b>; the anvil spreads out as the cell rains itself out. Still dangerous — this is when microbursts are common.</li>
 </ul>
 <p><b>Types:</b></p>
 <ul>
  <li><b>Air mass (single-cell)</b> — local heating, generally isolated, short-lived (~20–30 min per cell)</li>
  <li><b>Squall line</b> — a non-frontal band of active thunderstorms, often forming <b>50–300 NM ahead of a fast-moving cold front</b>. Often contains the most severe weather, and may be too long to circumnavigate and too high to overfly.</li>
  <li><b>Supercell / steady-state</b> — a single persistent rotating updraft (mesocyclone); produces the most violent weather and tornadoes</li>
 </ul>
 <p><b>Hazards:</b> severe or extreme <b>turbulence</b>, <b>hail</b> (can be thrown miles outside the cloud into clear air from the anvil), <b>lightning</b>, <b>icing</b>, <b>microbursts/wind shear</b>, <b>tornadoes</b>, <b>heavy rain</b> and reduced visibility, <b>engine water ingestion</b>, and <b>altimeter errors</b> from rapid pressure changes.</p>
 <p><b>MICROBURST</b> — a concentrated downdraft, typically less than <b>2.5 NM</b> across, with downdrafts up to <b>6,000 fpm</b> and horizontal wind shear up to <b>45 knots</b> (a 90-knot shear across the burst). Lifespan is usually <b>5–15 minutes</b>, with peak intensity about 5–10 minutes after touchdown on the surface.</p>
 <div class="warn"><b>The killer scenario:</b> on approach you fly into the microburst and first encounter a <b>headwind</b> — airspeed increases, you balloon above glidepath, and the natural reaction is to <b>reduce power and pitch down</b>. Seconds later you pass through the downdraft core and out the back side into a <b>tailwind</b> — airspeed drops suddenly, you sink rapidly, and you are now low, slow, and at reduced power with insufficient energy and altitude to recover.<br><br>
 <b>Recovery:</b> maximum power, pitch for best climb, do not chase the airspeed — and if you see the signs <b>before</b> you're in it, go around early or don't start the approach.</div>
 <p><b>Clues a microburst is possible:</b> virga (rain evaporating before reaching the ground), a ring of blowing dust on the surface, a convective cell nearby, large temperature/dewpoint spread with high-based cumulus, LLWAS alerts, or other aircraft reporting airspeed excursions.</p>
 <div class="memo"><b>Avoidance numbers to have memorized:</b><br>
  • Circumnavigate any thunderstorm identified as severe or giving an intense radar echo by at least <b>20 NM</b> (AIM 7-1-27)<br>
  • Clear the top of a known severe storm by at least <b>1,000 ft for every 10 knots</b> of wind speed at the top<br>
  • Never fly <b>under</b> a thunderstorm, even if you can see through to the other side<br>
  • Never attempt to fly <b>through</b> a squall line<br>
  • Do not land or take off in the face of an approaching thunderstorm</div>
 <div class="dpe"><b>DPE follow-ups to be ready for:</b> "How would you find out about thunderstorms before you depart?" → Convective SIGMET (issued hourly at H+55, valid 2 hours, for severe/embedded TS, a line of TS, TS ≥ VIP 4 with area coverage ≥40%, tornadoes, hail ≥¾", surface winds ≥50 kt); Center Weather Advisories; TAF with TS/VCTS; radar mosaic; Convective Outlook (AC); and PIREPs.<br><br>
 "Can you use ADS-B/FIS-B NEXRAD in the cockpit to pick your way through?" → <b>No.</b> Datalink NEXRAD is <b>strategic, not tactical</b>. The mosaic age can be up to 15–20 minutes old even though the displayed timestamp is newer, and a cell can move several miles and develop dramatically in that time. Use it to stay far away, never to thread between cells.</div>`},

{id:"IC1", area:"I", acs:"PA.I.C.K1", src:"<span class='reg'>14 CFR 91.103</span> &middot; AIM 7-1-2 &middot; AIM 7-1-5 Preflight Briefing &middot; PHAK ch. 13 &middot; AWH FAA-H-8083-28", tags:"weather sources briefing standard abbreviated outlook 1800wxbrief",
 q:"What are your sources of weather, and what types of briefings can you request?",
 a:`<p><b>Sources:</b> Flight Service (1-800-WX-BRIEF), <b>aviationweather.gov</b>, Leidos <b>1800wxbrief.com</b>, EFB apps (ForeFlight/Garmin Pilot), <b>ASOS/AWOS/ATIS</b>, HIWAS (discontinued), <b>FIS-B via ADS-B In</b>, and <b>PIREPs</b>.</p>
 <p><b>Three briefing types</b> (AIM 7-1-5):</p>
 <ul>
  <li><b>Standard</b> — complete picture; request when you haven't received a previous briefing. Order: adverse conditions, VFR flight not recommended, synopsis, current conditions, en route forecast, destination forecast, winds aloft, NOTAMs, ATC delays.</li>
  <li><b>Abbreviated</b> — to update a previous briefing or get specific items.</li>
  <li><b>Outlook</b> — when your departure is <b>6 or more hours</b> away; forecast data only.</li>
 </ul>
 <div class="dpe"><b>DPE follow-up:</b> "Is a self-briefing on ForeFlight legal?" Yes — but to get the <b>legal record</b> of having obtained weather under 91.103, and to be credited for it, log the briefing through an approved source (Leidos self-briefing tool or an EFB that files/records it). A screenshot of a radar image is not a weather briefing.</div>`},

{id:"IC2", area:"I", acs:"PA.I.C.K2", src:"AWH FAA-H-8083-28 (Aviation Weather Handbook) &middot; PHAK ch. 13", tags:"METAR TAF decode",
 q:"Decode this: KBEC 231853Z 18012G20KT 7SM BKN035 OVC070 28/19 A2992 RMK AO2",
 a:`<ul>
  <li><b>KBEC</b> — Beech Factory Airport</li>
  <li><b>231853Z</b> — 23rd day of the month, 1853 <b>Zulu</b></li>
  <li><b>18012G20KT</b> — wind from 180° true at 12 knots, gusting 20</li>
  <li><b>7SM</b> — 7 statute miles visibility</li>
  <li><b>BKN035 OVC070</b> — broken at 3,500 AGL, overcast at 7,000 AGL</li>
  <li><b>28/19</b> — temperature 28°C, dewpoint 19°C</li>
  <li><b>A2992</b> — altimeter 29.92 inHg</li>
  <li><b>RMK AO2</b> — automated station <b>with</b> a precipitation discriminator (AO1 = without)</li>
 </ul>
 <p><b>Sky cover:</b> SKC/CLR (clear), FEW (1/8–2/8), SCT (3/8–4/8), BKN (5/8–7/8), OVC (8/8). <b>Ceiling</b> = lowest <b>broken or overcast</b> layer, or vertical visibility.</p>
 <p><b>METAR</b> is an observation (issued hourly, ~55 past). <b>TAF</b> is a forecast for a <b>5 SM radius</b> of the airport, issued 4×/day, normally valid <b>24 hours</b>.</p>
 <div class="memo"><b>Temp/dewpoint spread:</b> within <b>2°C</b> and converging → expect fog, mist, or low stratus. Here 28/19 is a 9° spread — good VFR, but that spread plus heating is exactly what builds afternoon cumulus.</div>`},

{id:"IC3", area:"I", acs:"PA.I.C.K2", src:"AWH FAA-H-8083-28 &middot; PHAK ch. 13", tags:"AIRMET SIGMET convective sierra tango zulu pirep",
 q:"What's the difference between an AIRMET, a SIGMET, and a Convective SIGMET?",
 a:`<p><b>AIRMET (WA)</b> — for <i>all</i> aircraft, valid <b>6 hours</b>, issued every 6 hours with amendments:</p>
 <ul>
  <li><b>Sierra</b> — IFR conditions (ceiling &lt;1,000 ft and/or vis &lt;3 SM over 50% of area) and mountain obscuration</li>
  <li><b>Tango</b> — moderate turbulence, sustained surface winds ≥30 kt, low-level wind shear</li>
  <li><b>Zulu</b> — moderate icing and freezing levels</li>
 </ul>
 <div class="memo"><b>Sierra = Sight (IFR) &middot; Tango = Turbulence &middot; Zulu = Zero degrees (ice)</b></div>
 <p><b>SIGMET (WS)</b> — significant to <i>all</i> aircraft, valid <b>4 hours</b> (6 for hurricanes): severe icing, severe/extreme turbulence, dust/sandstorms or volcanic ash reducing vis below 3 SM.</p>
 <p><b>Convective SIGMET (WST)</b> — issued <b>hourly at H+55</b>, valid <b>2 hours</b>, always implies severe or greater turbulence, severe icing, and low-level wind shear. Issued for: tornadoes, lines of thunderstorms, embedded thunderstorms, thunderstorms ≥ VIP level 4 affecting ≥40% of an area, hail ≥ ¾ inch, or surface winds ≥ 50 knots.</p>`},

{id:"IC4", area:"I", acs:"PA.I.C.K3", src:"AWH FAA-H-8083-28 &middot; PHAK ch. 12", tags:"stability lapse rate inversion",
 q:"What is atmospheric stability, and what weather does stable vs. unstable air produce?",
 a:`<p><b>Standard atmosphere:</b> 15°C, 29.92 inHg at sea level. <b>Average lapse rate</b> 2°C per 1,000 ft. <b>Dry adiabatic</b> 3°C/1,000 ft; <b>moist adiabatic</b> ~1.5°C/1,000 ft.</p>
 <p>Compare the <b>actual (environmental) lapse rate</b> to the adiabatic rate: a <b>steep</b> actual lapse rate = <b>unstable</b>; a <b>shallow</b> rate or an <b>inversion</b> = <b>stable</b>.</p>
 <table style="width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px">
 <tr><td style="padding:5px;border-bottom:1px solid var(--line)"><b>Stable air</b></td><td style="padding:5px;border-bottom:1px solid var(--line)"><b>Unstable air</b></td></tr>
 <tr><td style="padding:5px">Stratiform clouds</td><td style="padding:5px">Cumuliform clouds</td></tr>
 <tr><td style="padding:5px">Steady precipitation</td><td style="padding:5px">Showery precipitation</td></tr>
 <tr><td style="padding:5px">Smooth air</td><td style="padding:5px">Turbulence</td></tr>
 <tr><td style="padding:5px">Poor visibility (haze/smoke trapped)</td><td style="padding:5px">Good visibility</td></tr>
 <tr><td style="padding:5px">Fog likely</td><td style="padding:5px">Thunderstorms possible</td></tr>
 </table>
 <p>A <b>temperature inversion</b> (temp increases with altitude) is extremely stable — common on clear, calm nights with surface cooling. Traps pollutants and moisture → poor visibility, and can produce <b>wind shear</b> at the top of the inversion.</p>`},

{id:"IC5", area:"I", acs:"PA.I.C.K3", src:"AWH FAA-H-8083-28 &middot; PHAK ch. 12", tags:"fronts cold warm stationary occluded",
 q:"What weather is associated with a cold front vs. a warm front?",
 a:`<p>A <b>front</b> is the boundary between two air masses. Expect a change in <b>temperature, dewpoint, wind direction, and pressure</b> at every frontal passage.</p>
 <p><b>Cold front</b> — cold air undercuts warm air, moves fast (20–35 kt), steep slope:</p>
 <ul><li>Cumuliform clouds, showery precipitation, thunderstorms</li><li>Turbulence, gusty shifting winds, rapid clearing behind</li><li>Narrow band of weather, passes quickly</li><li>Pressure drops then <b>rises sharply</b> after passage; wind shifts clockwise (veers)</li></ul>
 <p><b>Warm front</b> — warm air overrides cold air, moves slowly (10–25 kt), shallow slope:</p>
 <ul><li>Stratiform clouds in sequence: cirrus → cirrostratus → altostratus → nimbostratus</li><li>Steady precipitation, poor visibility, fog, low ceilings</li><li>Widespread weather well ahead of the front, lasts a long time</li><li>Freezing rain / icing risk ahead of the front</li></ul>
 <p><b>Stationary</b> — neither mass displaces the other; a mix of both, can persist for days. <b>Occluded</b> — a fast cold front overtakes a warm front; <b>cold occlusion</b> (most common in the U.S.) and <b>warm occlusion</b>, with the worst weather near the apex.</p>`},

{id:"IC6", area:"I", acs:"PA.I.C.K3j", src:"AWH FAA-H-8083-28 (Aviation Weather Handbook) &middot; PHAK ch. 12 - Weather Theory &middot; <b>ACS PA.I.C.K3</b>", tags:"fog radiation advection upslope steam precipitation induced",
 q:"Name the types of fog and how each forms.",
 a:`<ul>
  <li><b>Radiation fog</b> — clear, calm night; ground cools by radiation and cools the air to its dewpoint. Forms in low-lying areas, burns off with heating. Requires light wind and high humidity.</li>
  <li><b>Advection fog</b> — warm, moist air moves horizontally over a cooler surface. Needs wind (up to ~15 kt deepens it). Common on coastlines; can persist all day.</li>
  <li><b>Upslope fog</b> — moist, stable air forced up a sloping terrain, cooling adiabatically. Requires wind. Common on the eastern slopes of the Rockies — relevant to Kansas easterly flow.</li>
  <li><b>Steam fog</b> — cold, dry air moves over warm water; water evaporates and condenses. Associated with low-level turbulence and icing.</li>
  <li><b>Precipitation-induced (frontal) fog</b> — warm rain falls through cool air and saturates it. Associated with warm fronts; can be very persistent.</li>
  <li><b>Ice fog</b> — temperatures well below freezing; water vapor sublimates directly to ice crystals.</li>
 </ul>
 <div class="memo"><b>Common denominator:</b> fog forms when the <b>temperature/dewpoint spread closes to about 2°C or less</b>. Watch the spread on every METAR.</div>`},

{id:"IC7", area:"I", acs:"PA.I.C.K3i", src:"<span class='reg'>14 CFR 91.527</span> <span class='reg'>91.9</span> &middot; AWH FAA-H-8083-28 &middot; PHAK ch. 12", tags:"icing structural rime clear mixed induction carburetor",
 q:"What conditions are required for structural icing, and what types exist?",
 a:`<p><b>Two conditions required:</b> (1) <b>visible moisture</b>, and (2) aircraft surface temperature at or below <b>0°C</b>.</p>
 <ul>
  <li><b>Rime ice</b> — small supercooled droplets freeze instantly; rough, milky, opaque; forms at colder temps (-15 to -20°C). Disrupts airflow, adds little weight.</li>
  <li><b>Clear ice</b> — large supercooled droplets flow back before freezing; hard, glossy, transparent; forms near 0 to -10°C, often in freezing rain or cumuliform cloud. <b>Most dangerous</b> — heavy, hard to shed, hard to see.</li>
  <li><b>Mixed</b> — combination of both.</li>
  <li><b>Frost</b> — sublimation on a cold surface in clear air. <b>Must be removed before flight</b> <span class="reg">91.527</span>. Frost doesn't change the airfoil shape much, but it <b>disrupts the smooth laminar flow</b>, which can increase stall speed and reduce lift by up to 30% and increase drag by 40%.</li>
 </ul>
 <p><b>Effects:</b> increased weight and drag, decreased lift and thrust, increased stall speed, altered CG, blocked pitot/static, restricted controls, and loss of visibility.</p>
 <p><b>Action:</b> the C172S has no known-ice approval. Exit the icing conditions — change altitude (climb to colder air or descend to above-freezing air, terrain permitting), reverse course, and land. Carry extra speed on approach and consider <b>no flaps</b> if iced, since the tailplane may stall.</p>`},

{id:"IC8", area:"I", acs:"PA.I.C.R1", src:"<span class='reg'>14 CFR 91.103</span> <span class='reg'>91.3</span> &middot; RMH FAA-H-8083-2A &middot; PHAK ch. 2 &middot; <b>ACS PA.I.C.R1</b>", tags:"go no-go VFR into IMC 178 seconds personal minimums",
 q:"How do you make the go/no-go decision, and what's your plan if you encounter deteriorating weather?",
 a:`<p>Compare the actual and forecast conditions against: the <b>regulations</b> (91.155 minimums), the <b>aircraft</b>, and your <b>personal minimums</b> — which should be more restrictive than the regs and written down before you leave the house.</p>
 <p><b>If weather deteriorates en route — act early:</b></p>
 <ol><li><b>Turn around</b> — a 180° turn back into known good weather is almost always the right answer</li>
  <li>Land at the nearest suitable airport and wait</li>
  <li>Divert to known VFR conditions</li>
  <li>If inadvertent IMC: <b>declare an emergency</b>, climb to a safe altitude, contact ATC on 121.5 or the nearest frequency, use the autopilot or basic instrument scan, make smooth shallow turns, and accept help</li></ol>
 <div class="warn"><b>The 178-second study:</b> non-instrument-rated pilots who entered IMC lost control in an average of 178 seconds. This is the single most lethal accident category for private pilots. Your mitigation is to <b>never get there</b> — set a hard personal minimum and turn around while you still have VMC behind you.</div>`},

/* I.D Cross-Country Flight Planning */
{id:"ID1", area:"I", acs:"PA.I.D.K1", src:"<span class='reg'>14 CFR 91.103</span> &middot; PHAK ch. 16", tags:"91.103 preflight action NWKRAFT",
 q:"What does 91.103 require you to do before a flight?",
 a:`<p><span class="reg">91.103</span>: "Each pilot in command shall, before beginning a flight, become familiar with <b>all available information</b> concerning that flight."</p>
 <p>For a flight <b>not in the vicinity of an airport</b>, and for <b>any</b> IFR flight, that specifically includes weather reports and forecasts, fuel requirements, alternatives available if the planned flight cannot be completed, and any known traffic delays. For <b>any</b> flight: runway lengths at airports of intended use, and takeoff and landing distance data.</p>
 <div class="memo"><b>NWKRAFT</b><br>
 <b>N</b>OTAMs &middot; <b>W</b>eather &middot; <b>K</b>nown ATC delays &middot; <b>R</b>unway lengths &middot; <b>A</b>lternates &middot; <b>F</b>uel requirements &middot; <b>T</b>akeoff and landing distance data</div>
 <div class="dpe"><b>DPE follow-up:</b> "Show me where you got your runway lengths and your takeoff distance for today." Have the Chart Supplement entry and your actual performance calculation ready, worked for <i>today's</i> conditions at KBEC.</div>`},

{id:"ID2", area:"I", acs:"PA.I.D.K2", src:"<span class='reg'>14 CFR 91.151</span> &middot; PHAK ch. 16", tags:"fuel requirements 91.151 30 45 minutes reserve",
 q:"What are the VFR fuel requirements?",
 a:`<p><span class="reg">91.151(a)</span> — no person may begin a flight in an airplane under VFR unless there is enough fuel to fly to the first point of intended landing <b>and</b>, assuming normal cruising speed:</p>
 <ul><li><b>Day:</b> to fly after that for at least <b>30 minutes</b></li>
 <li><b>Night:</b> to fly after that for at least <b>45 minutes</b></li></ul>
 <div class="warn"><b>This is a legal minimum, not a plan.</b> Fuel exhaustion and starvation remain leading causes of GA accidents. Set a personal reserve of 1 hour, and treat it as a hard landing trigger, not a number to dip into.</div>
 <p><b>C172S:</b> 56 gallons total, <b>53 gallons usable</b>. At roughly 8.5–9.5 GPH in cruise, full tanks give you about 5 hours of endurance before reserves — but <b>that exceeds your max gross weight with four adults</b>. Fuel and payload always trade.</p>`},

{id:"ID3", area:"I", acs:"PA.I.D.K2", src:"PHAK ch. 16 - Navigation &middot; PHAK ch. 8", tags:"true course magnetic variation deviation compass TC TH MH CH",
 q:"Walk me from true course to compass heading.",
 a:`<div class="memo"><b>True Virgins Make Dull Company</b><br>
 <b>T</b>rue course → ±<b>W</b>ind correction angle = <b>T</b>rue heading<br>
 <b>T</b>rue heading → ±<b>V</b>ariation = <b>M</b>agnetic heading<br>
 <b>M</b>agnetic heading → ±<b>D</b>eviation = <b>C</b>ompass heading<br><br>
 <b>East is least (subtract), West is best (add)</b> — for variation.</div>
 <p><b>Variation</b> = the angular difference between true north and magnetic north; read it off the <b>isogonic line</b> on the sectional. <b>Deviation</b> = error caused by magnetic fields within the aircraft itself; read it off the <b>compass correction card</b> in the cockpit.</p>
 <p>Kansas sits near an isogonic line of roughly 3–4° East variation — <b>verify the current value on your sectional</b>, since variation drifts over time.</p>`},

{id:"ID4", area:"I", acs:"PA.I.D.K4", src:"<span class='reg'>14 CFR 91.153</span> <span class='reg'>91.103</span> &middot; AIM 5-1-5 Flight Plan - VFR Flights", tags:"flight plan file open close VFR search rescue",
 q:"Are you required to file a VFR flight plan? Why would you?",
 a:`<p><b>Not required</b> for VFR flight in the U.S. (it <i>is</i> required for IFR, and for crossing an ADIZ). But you should, because it triggers <b>search and rescue</b>.</p>
 <ul>
  <li><b>File</b> with Flight Service or an EFB before departure</li>
  <li><b>Open/activate</b> it with Flight Service after you're airborne — <b>filing does not open it</b></li>
  <li><b>Close</b> it with Flight Service on landing</li>
 </ul>
 <p>If you don't close it, search and rescue procedures begin <b>30 minutes</b> after your ETA. Closing with the tower does <b>not</b> close your flight plan.</p>
 <div class="memo"><b>Not the same as flight following.</b> VFR flight following is radar traffic advisories from ATC on a workload-permitting basis, and does <b>not</b> provide search and rescue. A flight plan provides SAR but no traffic advisories. Use both.</div>`},

/* I.E National Airspace System */
{id:"IE1", area:"I", acs:"PA.I.E.K1", src:"<span class='reg'>14 CFR 91.126</span> <span class='reg'>91.127</span> <span class='reg'>91.129</span> <span class='reg'>91.130</span> <span class='reg'>91.131</span> <span class='reg'>Part 71</span> &middot; AIM ch. 3 &middot; PHAK ch. 15", tags:"airspace classes ABCDE G dimensions equipment",
 q:"Describe each class of airspace: dimensions, entry requirements, and equipment.",
 a:`<ul>
 <li><b>Class A</b> — 18,000 ft MSL to FL600. IFR only; instrument rating and clearance required. (You will never be in it as a VFR private pilot.)</li>
 <li><b>Class B</b> — surface to typically 10,000 ft MSL around the busiest airports; upside-down wedding cake. Requires an <b>explicit ATC clearance</b> ("cleared into the Class Bravo"), two-way radio, Mode C transponder, and ADS-B Out. Private pilot certificate required, or a student with a specific endorsement.</li>
 <li><b>Class C</b> — surface to 4,000 ft AGL; inner core 5 NM radius, outer shelf 10 NM radius from 1,200 ft AGL. Requires <b>two-way radio communication established</b> (they say your callsign), Mode C transponder, and ADS-B Out.</li>
 <li><b>Class D</b> — surface to typically 2,500 ft AGL, ~4 NM radius, around towered airports. Requires <b>two-way radio communication established</b>. No transponder required by the class itself.</li>
 <li><b>Class E</b> — controlled airspace that isn't A/B/C/D. Begins at the surface (dashed magenta), 700 AGL (shaded magenta), 1,200 AGL (shaded blue), or a charted floor. Extends up to but not including 18,000 MSL. No equipment or communication required for VFR.</li>
 <li><b>Class G</b> — uncontrolled; surface up to the overlying Class E floor. No ATC service, no communication requirement.</li>
 </ul>
 <div class="memo"><b>The key distinction:</b> Class B requires a <b>clearance</b>. Class C and D require <b>established two-way communication</b> — if they respond with your <b>callsign</b>, you may enter; if they say "aircraft calling, stand by," you may <b>not</b>.</div>`},

{id:"IE2", area:"I", acs:"PA.I.E.K1", src:"<span class='reg'>14 CFR 91.155</span> &middot; PHAK ch. 15", tags:"VFR weather minimums 91.155 3 152 1 clear of clouds",
 q:"What are the VFR weather minimums for each class of airspace?",
 a:`<p><span class="reg">91.155</span>:</p>
 <ul>
 <li><b>Class B</b> — 3 SM visibility, <b>clear of clouds</b></li>
 <li><b>Class C, D, E (below 10,000 MSL)</b> — 3 SM, <b>500 below / 1,000 above / 2,000 horizontal</b></li>
 <li><b>Class E at or above 10,000 MSL</b> — 5 SM, <b>1,000 below / 1,000 above / 1 SM horizontal</b></li>
 <li><b>Class G, ≤1,200 AGL, day</b> — 1 SM, clear of clouds</li>
 <li><b>Class G, ≤1,200 AGL, night</b> — 3 SM, 500/1,000/2,000</li>
 <li><b>Class G, &gt;1,200 AGL but &lt;10,000 MSL, day</b> — 1 SM, 500/1,000/2,000</li>
 <li><b>Class G, &gt;1,200 AGL but &lt;10,000 MSL, night</b> — 3 SM, 500/1,000/2,000</li>
 <li><b>Class G, &gt;1,200 AGL and ≥10,000 MSL</b> — 5 SM, 1,000/1,000/1 SM</li>
 </ul>
 <div class="memo"><b>"3 Cessnas, 152" </b> — the standard case is <b>3</b> SM, <b>C</b>lear... think <b>5-1-1-1</b> above 10,000 and <b>3-152</b> (3 SM, 1,000 above, 500 below, 2,000 horizontal) everywhere normal.</div>
 <p><b>Special VFR</b> <span class="reg">91.157</span> — in Class B/C/D/E surface areas only, by ATC clearance, requires <b>1 SM visibility and clear of clouds</b>. At night you need an <b>instrument rating and an IFR-equipped aircraft</b>. Not available where the chart says "NO SVFR."</p>`},

{id:"IE3", area:"I", acs:"PA.I.E.K1", src:"<span class='reg'>14 CFR 91.126</span> <span class='reg'>91.129</span> &middot; Chart Supplement - Central US &middot; Wichita Sectional &middot; PHAK ch. 15", tags:"KBEC Beech Factory Wichita class D class C ICT airspace local",
 q:"Describe the airspace at and around your home field, KBEC.",
 a:`<p><b>KBEC — Beech Factory Airport, Wichita, Kansas.</b> Towered field in <b>Class D</b> surface airspace when the tower is open, sitting underneath/adjacent to the <b>Wichita (KICT) Class C</b> shelf, in one of the busiest GA manufacturing-flight-test areas in the country.</p>
 <p><b>What you must be able to do on the ramp with a sectional in hand:</b></p>
 <ul>
  <li>Read the <b>Class D ceiling</b> from the dashed-blue segmented box (e.g., "[25]" = up to and including 2,500 ft MSL)</li>
  <li>Identify where the <b>Class C shelf floor</b> begins overhead and what happens to the airspace when the KBEC tower <b>closes</b> (Class D typically reverts to Class E or G — check the Chart Supplement)</li>
  <li>State the tower, ground, ATIS, and <b>ICT approach</b> frequencies from memory or from the chart</li>
  <li>Point out nearby <b>KICT, KAAO (Jabara), K3AU, KIAB (McConnell AFB)</b> and their airspace — McConnell's Class D and any associated restricted/alert areas matter for your practice area</li>
  <li>Explain the transponder rule that applies here: Mode C and ADS-B Out are required <b>within and above the Class C</b> up to 10,000 ft MSL. (The 30 NM "Mode C veil" is a <b>Class B</b> rule and does not apply at Wichita.)</li>
 </ul>
 <div class="warn"><b>Do this before the ride:</b> pull the current Wichita sectional and the Chart Supplement entry for KBEC and write down the exact Class D ceiling, tower hours, pattern altitude, runway lengths, and what the airspace reverts to after hours. These numbers change — and the DPE flies out of here, so vague answers will be obvious.</div>`},

{id:"IE4", area:"I", acs:"PA.I.E.K2", src:"<span class='reg'>14 CFR 91.133</span> <span class='reg'>91.137</span> <span class='reg'>91.141</span> <span class='reg'>Part 73</span> &middot; AIM 3-4 &middot; PHAK ch. 15", tags:"special use airspace prohibited restricted warning MOA alert TFR",
 q:"What are the types of special use airspace?",
 a:`<ul>
  <li><b>Prohibited (P-)</b> — flight is prohibited, period. National security (e.g., P-56 over the White House).</li>
  <li><b>Restricted (R-)</b> — invisible hazards to aircraft (artillery, gunnery, missiles). Entry requires <b>permission from the controlling agency</b> when active. Check NOTAMs and the chart's times of use.</li>
  <li><b>Warning (W-)</b> — same hazards as restricted, but beginning <b>3 NM outward from the coast</b> over international waters. Not prohibited, but hazardous.</li>
  <li><b>MOA</b> — Military Operations Area; separates military training from IFR traffic. <b>VFR aircraft may legally enter</b>, but should exercise extreme caution and contact the controlling agency for status. Expect high-speed aircraft and aerobatics.</li>
  <li><b>Alert Area (A-)</b> — high volume of pilot training or unusual aerial activity. Entry permitted; both parties are responsible for collision avoidance.</li>
  <li><b>Controlled Firing Area (CFA)</b> — not charted, because activity is suspended when a spotter detects an aircraft.</li>
  <li><b>National Security Area (NSA)</b> — pilots requested to voluntarily avoid; may be temporarily made prohibited by NOTAM.</li>
 </ul>
 <p><b>Other airspace:</b> TFRs <span class="reg">91.137–91.145</span>, Military Training Routes (IR/VR — four digits = at or below 1,500 AGL, three digits = above 1,500 AGL), Parachute Jump Areas, and Wildlife/Noise sensitive areas (requested 2,000 ft AGL).</p>`},

{id:"IE5", area:"I", acs:"PA.I.E.K1", src:"<span class='reg'>14 CFR 91.215</span> <span class='reg'>91.225</span> <span class='reg'>91.227</span>", tags:"transponder 91.215 mode C veil ADS-B 91.225 rule airspace",
 q:"Where are a Mode C transponder and ADS-B Out required?",
 a:`<p><b>Mode C transponder</b> <span class="reg">91.215</span>:</p>
 <ul><li>In all <b>Class A, B, and C</b> airspace</li>
 <li>Within <b>30 NM of a Class B primary airport</b>, surface to 10,000 MSL (the <b>Mode C veil</b>)</li>
 <li><b>Above</b> the ceiling of Class B or C airspace, up to 10,000 MSL</li>
 <li>At and above <b>10,000 ft MSL</b> (excluding airspace at and below 2,500 AGL)</li></ul>
 <p><b>ADS-B Out</b> <span class="reg">91.225</span> — required in essentially the same airspace ("rule airspace"), plus Class E at and above 10,000 MSL (excluding at/below 2,500 AGL). 1090ES required at/above 18,000; 978 UAT permitted below.</p>
 <div class="memo"><b>Shortcut:</b> "If you need Mode C, you need ADS-B Out." The one difference worth noting is that Mode C has a veil around Class B; ADS-B follows the same rule airspace.</div>
 <p><b>VFR squawk</b> is <b>1200</b>. Emergency <b>7700</b>, lost comm <b>7600</b>, hijack <b>7500</b>.</p>`},

{id:"IE6", area:"I", acs:"PA.I.E.K1", src:"<span class='reg'>14 CFR 91.159</span> <span class='reg'>91.179</span>", tags:"VFR cruising altitudes 91.159 hemispheric 3000 AGL",
 q:"What are the VFR cruising altitude rules?",
 a:`<p><span class="reg">91.159</span> — applies when in <b>level cruising flight more than 3,000 ft AGL</b>, below 18,000 MSL:</p>
 <ul><li><b>Magnetic course 0°–179°</b> → <b>odd</b> thousand + 500 (3,500 / 5,500 / 7,500)</li>
 <li><b>Magnetic course 180°–359°</b> → <b>even</b> thousand + 500 (4,500 / 6,500 / 8,500)</li></ul>
 <div class="memo"><b>"East is odd, West is even — plus 500."</b> Note it's based on <b>magnetic course</b>, not heading, and only applies <b>above 3,000 AGL</b>.</div>`},

{id:"IE7", area:"I", acs:"PA.I.E.K1", src:"<span class='reg'>14 CFR 91.117</span>", tags:"speed limits 91.117 250 200 knots",
 q:"What are the aircraft speed limits?",
 a:`<p><span class="reg">91.117</span>:</p>
 <ul>
  <li>Below <b>10,000 ft MSL</b>: max <b>250 KIAS</b></li>
  <li>At or below <b>2,500 ft AGL</b> within <b>4 NM of the primary airport</b> of Class C or D airspace: max <b>200 KIAS</b></li>
  <li>In the airspace <b>underlying</b> Class B, or in a <b>VFR corridor</b> through Class B: max <b>200 KIAS</b></li>
 </ul>
 <p>If the aircraft's minimum safe speed is higher than these limits, you may fly at that minimum safe speed.</p>
 <div class="dpe"><b>DPE follow-up:</b> "Does this matter in a 172?" Not practically — you can't exceed 250 kt. But know it, and know that the 200-knot limit under a Class B shelf is a frequent exam question.</div>`}
);

/* ---------- AREA I — PERFORMANCE, SYSTEMS, HUMAN FACTORS ---------- */
DATA.push(

/* ★ PRIORITY — PA.I.F.K2f */
{id:"IFK2f", area:"I", acs:"PA.I.F.K2f", src:"<b>ACS PA.I.F.K2f</b> &middot; <span class='reg'>14 CFR 91.9(a)</span> <span class='reg'>91.103(b)</span> &middot; WBH FAA-H-8083-1B &middot; PHAK ch. 10 - Weight and Balance &middot; C172S POH sec. 6", prio:true, tags:"weight balance CG datum arm moment forward aft stall speed stability",
 q:"★ MISSED CODE — Weight and balance as a factor affecting performance: define the terms and explain the effects.",
 a:`<div class="warn"><b>Missed knowledge-test code — the DPE is required to cover it.</b> ACS text: <i>"PA.I.F.K2 Factors affecting performance, including: f. Weight and balance."</i> Expect to actually <b>compute</b> a weight and balance for the airplane, likely with a scenario that puts you out of limits.</div>
 <p><b>Definitions you must own:</b></p>
 <ul>
  <li><b>Datum</b> — an imaginary vertical reference plane from which all horizontal distances are measured. Set by the manufacturer; on the C172S it is the <b>front face of the firewall</b>.</li>
  <li><b>Arm</b> — the horizontal distance from the datum to the center of gravity of an item. Aft of datum = positive.</li>
  <li><b>Moment</b> — weight × arm. A measure of the rotating force about the datum.</li>
  <li><b>Center of gravity (CG)</b> — the point at which the airplane would balance if suspended; total moment ÷ total weight.</li>
  <li><b>CG limits</b> — the forward and aft extremes within which the airplane must be operated; from the POH, and they <b>move with weight</b>.</li>
  <li><b>Basic empty weight</b> — airframe, engine, unusable fuel, <b>full operating fluids</b>, and full engine oil.</li>
  <li><b>Useful load</b> — max ramp weight minus basic empty weight. Includes usable fuel, occupants, baggage.</li>
  <li><b>Payload</b> — weight of occupants, cargo, and baggage (no fuel).</li>
  <li><b>Max gross / max takeoff weight</b> — C172S: <b>2,550 lb</b> in the <b>Normal</b> category; <b>2,200 lb</b> in the <b>Utility</b> category. <i>Verify against your AFM.</i></li>
 </ul>
 <p><b>Effects of being OVERWEIGHT:</b></p>
 <ul><li>Higher takeoff speed and <b>longer takeoff roll</b></li>
 <li><b>Reduced rate and angle of climb</b>, lower service ceiling</li>
 <li>Shorter range and reduced cruise speed</li>
 <li><b>Higher stall speed</b> and higher landing speed, <b>longer landing roll</b></li>
 <li>Reduced maneuverability and <b>increased structural stress</b> — the certificated load limits no longer apply</li></ul>
 <div class="memo"><b>Memory aid for overweight effects — everything gets worse, and all the speeds go up:</b> higher takeoff speed, higher stall speed, higher landing speed, longer distances, less climb.</div>
 <p><b>Effects of CG position — this is the part people miss:</b></p>
 <table style="width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px">
 <tr><td style="padding:5px;border-bottom:1px solid var(--line)"><b>Forward CG</b></td><td style="padding:5px;border-bottom:1px solid var(--line)"><b>Aft CG</b></td></tr>
 <tr><td style="padding:5px">More <b>stable</b></td><td style="padding:5px">Less stable / unstable</td></tr>
 <tr><td style="padding:5px"><b>Higher</b> stall speed</td><td style="padding:5px"><b>Lower</b> stall speed</td></tr>
 <tr><td style="padding:5px"><b>Slower</b> cruise speed</td><td style="padding:5px"><b>Faster</b> cruise speed</td></tr>
 <tr><td style="padding:5px">Higher takeoff/landing speed</td><td style="padding:5px">Lower takeoff/landing speed</td></tr>
 <tr><td style="padding:5px">Poorer climb performance</td><td style="padding:5px">Better climb performance</td></tr>
 <tr><td style="padding:5px">Harder to flare / may not rotate</td><td style="padding:5px">Easy to over-rotate</td></tr>
 <tr><td style="padding:5px">Recovers from stalls readily</td><td style="padding:5px"><b>May be impossible to recover from a spin</b></td></tr>
 </table>
 <p><b>Why:</b> a forward CG means the tail must produce more <b>downward</b> force to balance the nose-heavy moment. That download is effectively added weight the wing must carry → higher effective wing loading → higher stall speed, more induced drag, slower cruise. An aft CG reduces the required tail download — better performance, but you give away <b>longitudinal stability</b> and <b>stall/spin recoverability</b>, which is why the aft limit is the one that kills people.</p>
 <div class="memo"><b>Weight shift formula:</b><br>
 <code>Weight to shift / Total weight = ΔCG / Distance between arms</code><br>
 Rearranged: <code>ΔCG = (Weight shifted × Distance moved) ÷ Total weight</code></div>
 <div class="dpe"><b>Be ready to actually do this:</b> the DPE will hand you a scenario ("you, me, two passengers in back, 50 lb of bags, full fuel"). Work it in the airplane's loading graph or by the moment table from the <b>actual AFM for your tail number</b>. If it comes out over gross or out of CG, say so plainly and then <b>fix it</b> — offload fuel, move a passenger forward, or reduce baggage — and recompute. Knowing you're out of limits and flying anyway is an automatic disapproval; catching it and correcting it is exactly what they want to see.</div>
 <div class="tail"><b>Also know:</b> the C172S <b>baggage areas</b> have separate limits (typically Area 1 = 120 lb, Area 2 = 50 lb, with a combined maximum — <b>check your AFM</b>), and the <b>Utility category</b> at 2,200 lb with a restricted aft CG is what permits spins and higher-G maneuvers. You cannot do utility-category maneuvers at normal-category loading.</div>`},

{id:"IF1", area:"I", acs:"PA.I.F.K1", src:"<span class='reg'>14 CFR 91.103(b)</span> &middot; PHAK ch. 11 - Aircraft Performance &middot; C172S POH sec. 5", tags:"performance charts takeoff landing distance interpolation",
 q:"How do you use the performance charts, and what assumptions do they make?",
 a:`<p>Enter with <b>pressure altitude</b>, <b>temperature</b>, <b>weight</b>, and <b>wind</b>, then apply the notes and conditions for runway surface, slope, and flap setting. <b>Interpolate</b> between the values given — don't round in the optimistic direction.</p>
 <div class="warn"><b>Critical assumption:</b> the charts were produced with a <b>new airplane, a new engine, and a professional test pilot</b> flying the exact technique in the POH. Your airplane is older, your technique isn't a test pilot's, and the chart has <b>no built-in safety margin</b>. Add a conservative factor — a common personal minimum is a <b>50% margin</b> on takeoff and landing distance.</div>
 <p><b>Pressure altitude</b> = set 29.92 in the altimeter and read it; or <code>(29.92 − altimeter setting) × 1,000 + field elevation</code>.</p>
 <p><b>Density altitude</b> = pressure altitude corrected for nonstandard temperature. It is <b>not</b> a height you fly at — it is the altitude the airplane <i>thinks</i> it's at in terms of performance.</p>`},

{id:"IF2", area:"I", acs:"PA.I.F.K2a", src:"PHAK ch. 11 &middot; AWH FAA-H-8083-28 &middot; C172S POH sec. 5", tags:"density altitude high hot humid performance",
 q:"What is density altitude and what increases it?",
 a:`<p><b>Density altitude</b> = pressure altitude corrected for nonstandard temperature. High density altitude = thin air = <b>bad performance</b>.</p>
 <p><b>Three things raise density altitude:</b></p>
 <ol><li><b>High altitude</b> (low pressure)</li>
 <li><b>High temperature</b></li>
 <li><b>High humidity</b> — water vapor is less dense than dry air, and it displaces it</li></ol>
 <div class="memo"><b>"High, Hot, and Humid"</b> — the three H's. All three mean less dense air.</div>
 <p><b>Effects:</b> reduced engine power (less oxygen for combustion), reduced propeller efficiency (less air mass to accelerate), and reduced lift from the wing (less dense air over the airfoil). The result: <b>longer takeoff roll, reduced rate of climb, higher true airspeed for the same indicated airspeed, and longer landing roll</b>.</p>
 <div class="dpe"><b>Kansas summer scenario:</b> KBEC field elevation ~1,400 ft, 38°C, altimeter 29.80. Density altitude will be well over 4,000 ft. Be ready to compute it with your E6B and then look up the resulting takeoff distance — the DPE loves this one because it's a real hazard here in July.</div>`},

{id:"IF3", area:"I", acs:"PA.I.F.K3", src:"PHAK ch. 5 - Aerodynamics of Flight &middot; AFH ch. 5 &middot; C172S POH sec. 2", tags:"load factor maneuvering speed Va limit load G",
 q:"What is load factor, and why does maneuvering speed change with weight?",
 a:`<p><b>Load factor</b> = total lift ÷ aircraft weight, expressed in Gs. In a level 60° bank, load factor is <b>2 G</b> and <b>stall speed increases by about 41%</b> (√2).</p>
 <p><b>Stall speed in a turn</b> = <code>Vs × √(load factor)</code>.</p>
 <p><b>Limit load factors</b> — C172S: Normal category <b>+3.8 / −1.52 G</b>; Utility category <b>+4.4 / −1.76 G</b>. (Flaps down: +3.0 G.) <i>Verify in your AFM.</i></p>
 <p><b>Maneuvering speed (V<sub>A</sub>)</b> — the maximum speed at which <b>full, abrupt control deflection of a single control</b> can be made without exceeding the limit load factor. Below V<sub>A</sub>, the wing <b>stalls before it breaks</b>.</p>
 <div class="warn"><b>V<sub>A</sub> decreases as weight decreases.</b> This is counterintuitive and a classic exam question. A lighter airplane is accelerated more easily by the same gust or control input, so it reaches its limit load factor at a <b>lower</b> airspeed. <b>Lighter = slower V<sub>A</sub>.</b> That's why V<sub>A</sub> is published for max gross weight and you must reduce it when light.</div>
 <p>The relationship: <code>V<sub>A new</sub> = V<sub>A</sub> × √(new weight ÷ max weight)</code>.</p>`},

{id:"IF4", area:"I", acs:"PA.I.F.K1", src:"<span class='reg'>14 CFR 1.2 (V-speed abbreviations)</span> &middot; C172S POH sec. 1 &amp; 2 &middot; PHAK ch. 11", tags:"V speeds C172S Vso Vs1 Vx Vy Vfe Vno Vne Va Vg",
 q:"List the V-speeds for the C172S and what each one means.",
 a:`<p><b>Typical C172S values — confirm against your AFM and the airspeed indicator markings in your airplane:</b></p>
 <ul>
  <li><b>V<sub>SO</sub></b> ~40 KCAS — stall, landing configuration (bottom of the <b>white arc</b>)</li>
  <li><b>V<sub>S1</sub></b> ~48 KCAS — stall, clean (bottom of the <b>green arc</b>)</li>
  <li><b>V<sub>R</sub></b> ~55 KIAS — rotation</li>
  <li><b>V<sub>X</sub></b> 62 KIAS — best <b>angle</b> of climb: most altitude per unit of <b>distance</b>. Use to clear an obstacle.</li>
  <li><b>V<sub>Y</sub></b> 74 KIAS — best <b>rate</b> of climb: most altitude per unit of <b>time</b>.</li>
  <li><b>V<sub>G</sub></b> 68 KIAS — best <b>glide</b> (max L/D), at max gross weight</li>
  <li><b>V<sub>FE</sub></b> 110 KIAS (10° flaps) / 85 KIAS (10°–30°) — max flap extended (top of the <b>white arc</b>)</li>
  <li><b>V<sub>A</sub></b> 105 KIAS at 2,550 lb — maneuvering speed (decreases with weight; <b>not marked</b> on the ASI)</li>
  <li><b>V<sub>NO</sub></b> 129 KIAS — max structural cruising; top of the <b>green arc</b>. Only operate above this in smooth air.</li>
  <li><b>V<sub>NE</sub></b> 163 KIAS — never exceed; the <b>red line</b></li>
 </ul>
 <div class="memo"><b>Arc meanings:</b> <b>White</b> = flap operating range &middot; <b>Green</b> = normal operating range &middot; <b>Yellow</b> = caution, smooth air only &middot; <b>Red line</b> = never exceed.</div>
 <div class="memo"><b>V<sub>X</sub> vs V<sub>Y</sub>:</b> "<b>X</b> marks the spot" — V<sub>X</sub> gets you over the obstacle at that spot. As altitude increases, V<sub>X</sub> <b>increases</b> and V<sub>Y</sub> <b>decreases</b>; where they meet is the <b>absolute ceiling</b>.</div>`},

/* ★ PRIORITY — PA.I.G.K1c */
{id:"IGK1c", area:"I", acs:"PA.I.G.K1c", src:"<b>ACS PA.I.G.K1c</b> &middot; PHAK ch. 7 - Aircraft Systems &middot; C172S POH sec. 7 &middot; Lycoming IO-360-L2A Operator's Manual", prio:true, tags:"powerplant propeller engine lycoming IO-360 fuel injection ignition oil fixed pitch",
 q:"★ MISSED CODE — Describe the powerplant and propeller on your C172S in detail.",
 a:`<div class="warn"><b>Missed knowledge-test code — guaranteed to be covered.</b> ACS text: <i>"PA.I.G.K1 Airplane systems, including: c. Powerplant and propeller."</i> Expect the DPE to make you trace the system end to end, and to ask what happens when pieces of it fail.</div>
 <p><b>Engine — Lycoming IO-360-L2A:</b></p>
 <ul>
  <li><b>180 horsepower</b> at 2,700 RPM</li>
  <li><b>Four cylinder, horizontally opposed</b> ("flat four")</li>
  <li><b>Air cooled</b> — cooling fins and baffling direct ram air over the cylinders</li>
  <li><b>Direct drive</b> — the prop bolts to the crankshaft; no reduction gearing, so prop RPM = engine RPM</li>
  <li><b>Fuel injected</b> — the "I" in IO-360 (the "O" is opposed). <b>No carburetor, therefore no carburetor ice and no carb heat control.</b></li>
  <li>Normally aspirated — no turbocharger or supercharger</li>
  <li>Compression ratio 8.5:1, 361 cubic inch displacement</li>
 </ul>
 <div class="dpe"><b>Near-certain DPE question:</b> "Where's your carb heat?" There isn't one — it's fuel injected. Instead you have <b>alternate air</b>, which opens automatically (spring-loaded door) if the induction air filter becomes blocked by ice or debris, allowing unfiltered warm air from inside the cowling to reach the engine. Know that induction icing is still possible, just not <i>carburetor</i> icing.</div>
 <p><b>Four-stroke cycle:</b> <b>Intake → Compression → Power → Exhaust</b> ("Suck, Squeeze, Bang, Blow"). Two crankshaft revolutions per cycle.</p>
 <p><b>Fuel injection system:</b> engine-driven fuel pump → fuel/air control unit (throttle and mixture) → flow divider ("spider") on top of the engine → individual injector nozzles at each cylinder intake port. An <b>electric auxiliary fuel pump</b> is used for starting, and is the backup if the engine-driven pump fails.</p>
 <ul>
  <li><b>Advantages</b> of fuel injection: no carb ice, better fuel distribution, more precise mixture control, improved fuel efficiency, easier cold starting.</li>
  <li><b>Disadvantages:</b> <b>vapor lock</b> and difficult <b>hot starts</b>, susceptibility to contamination, more expensive.</li>
 </ul>
 <p><b>Ignition system:</b></p>
 <ul>
  <li><b>Two engine-driven magnets</b> — magnetos — each firing <b>one spark plug per cylinder</b> (two plugs per cylinder, eight total)</li>
  <li>Magnetos are <b>entirely independent of the aircraft electrical system</b> — the engine keeps running with a total electrical failure</li>
  <li><b>Why two?</b> (1) <b>Redundancy</b>, and (2) <b>more complete and even combustion</b> — two flame fronts burn the charge faster and more efficiently, giving about a <b>5% power increase</b></li>
  <li><b>Mag check:</b> at run-up RPM, switching to a single mag should produce a small <b>RPM drop</b> (typically max 150 RPM drop, max 50 RPM <b>differential</b> between mags — <i>verify your AFM</i>). <b>No drop</b> at all may mean a <b>grounding wire (P-lead) is broken</b> — the mag is hot and the prop is live even with the switch off. <b>Excessive drop</b> suggests fouled plugs, a bad mag, or improper mixture.</li>
 </ul>
 <div class="warn"><b>Always treat the propeller as live.</b> A broken P-lead means the magneto will fire even with the ignition switch OFF and the key out.</div>
 <p><b>Mixture control:</b> at altitude the air is less dense, so the same fuel flow makes the mixture too <b>rich</b> → rough running, fouled plugs, power loss. Lean per the POH. <b>Too lean</b> → high cylinder head temperatures, detonation, and engine damage.</p>
 <ul>
  <li><b>Detonation</b> — the fuel/air charge <b>explodes</b> instead of burning smoothly. Causes: low-grade fuel, overheating, too-lean mixture, high power at low airspeed. Indications: high CHT, loss of power, rough running. Fix: enrich the mixture, reduce power, increase airspeed for cooling, open cowl flaps if equipped.</li>
  <li><b>Pre-ignition</b> — the charge ignites <b>early</b> from a hot spot (glowing carbon deposit, cracked plug insulator). Often leads to detonation, and vice versa.</li>
 </ul>
 <p><b>Oil system</b> — wet sump, 8 quarts capacity, <b>minimum 5 quarts for flight</b> (typically fly with 6–7 to reduce blow-by). <i>Verify your AFM.</i> Oil's jobs: <b>lubricates, cools, cleans, seals, and protects against corrosion</b> — plus it cushions and absorbs heat. Monitor <b>oil pressure</b> (must be in the green within 30 seconds of start, 60 in cold weather) and <b>oil temperature</b>.</p>
 <div class="memo"><b>Oil does five things:</b> <b>L</b>ubricate, <b>C</b>ool, <b>C</b>lean, <b>S</b>eal, <b>P</b>rotect (anti-corrosion).</div>
 <p><b>PROPELLER — fixed-pitch, two-blade, all-metal, McCauley 76" diameter.</b></p>
 <ul>
  <li>A propeller is a <b>rotating airfoil</b>; it generates <b>thrust</b> the same way a wing generates lift. The blade's angle of attack is set by the fixed blade angle and the relative wind, which is the resultant of rotational velocity and forward velocity.</li>
  <li><b>Twist (blade angle changes from hub to tip)</b> — the tip travels much faster than the root, so the blade angle is <b>reduced toward the tip</b> to keep the angle of attack and thrust roughly uniform along the blade.</li>
  <li><b>Pitch</b> — the distance the prop would advance in one revolution through a solid medium. A <b>climb prop</b> has low pitch (better takeoff/climb, lower cruise speed); a <b>cruise prop</b> has high pitch (better cruise, worse climb). A fixed-pitch prop is a compromise and is efficient at only one combination of airspeed and RPM.</li>
  <li>Since it's fixed pitch and direct drive, <b>RPM is your only power control</b> (along with mixture) — there is no propeller control or manifold pressure gauge.</li>
 </ul>
 <p><b>Four left-turning tendencies</b> — be ready, this always follows the prop question:</p>
 <ol>
  <li><b>Torque</b> — Newton's third law; the prop turns clockwise (from the cockpit), the airplane tends to roll left. Greatest at high power, low airspeed.</li>
  <li><b>P-factor (asymmetric thrust)</b> — at a high angle of attack, the <b>descending (right) blade</b> has a greater angle of attack and takes a bigger bite, producing more thrust on the right side → yaws left. Greatest at high AOA and high power.</li>
  <li><b>Spiraling slipstream</b> — the corkscrewing airflow from the prop strikes the <b>left side of the vertical stabilizer</b> → yaws left. Greatest at high power, low airspeed.</li>
  <li><b>Gyroscopic precession</b> — a force applied to a spinning disc is felt 90° ahead in the direction of rotation. Raising the tail (tailwheel) applies a forward force at the top, felt at the right side → yaws left. Minimal in a tricycle-gear 172 except during abrupt pitch changes.</li>
 </ol>
 <div class="memo"><b>Memory aid:</b> "<b>T-P-S-G</b>" — <b>T</b>orque, <b>P</b>-factor, <b>S</b>piraling slipstream, <b>G</b>yroscopic precession. All four are worst when you are <b>slow, high power, and high angle of attack</b> — i.e., takeoff, climb, and go-around. That's why you need right rudder.</div>`},

{id:"IG1", area:"I", acs:"PA.I.G.K1e", src:"PHAK ch. 7 &middot; C172S POH sec. 7", tags:"fuel system tanks selector usable 53 gallons 100LL sumps",
 q:"Describe the fuel system of the C172S.",
 a:`<ul>
  <li><b>Two integral wing tanks</b>, 28 gallons each = <b>56 gallons total, 53 gallons usable</b>. <i>Verify your AFM.</i></li>
  <li><b>Fuel selector:</b> BOTH, LEFT, RIGHT, OFF. Normal operation is <b>BOTH</b>.</li>
  <li><b>Fuel flows by gravity</b> from the high-wing tanks to the fuel/air control unit, assisted by the <b>engine-driven fuel pump</b>. An <b>electric auxiliary fuel pump</b> is used for starting and as backup.</li>
  <li><b>Fuel:</b> <b>100LL, blue</b>. (100 octane is green; Jet A is clear/straw and <b>will destroy this engine</b>.)</li>
  <li><b>Vents:</b> a vented left fuel cap and a vent line — blocked vents cause fuel starvation as a vacuum forms in the tank.</li>
  <li><b>Sumps/drains:</b> drain all quick-drain points (both wing tanks, the fuel strainer/gascolator, and the lines) before every flight.</li>
 </ul>
 <p><b>What you're checking in a fuel sample:</b> correct <b>color</b> (blue), correct <b>smell</b>, and no <b>water</b> (clear beads/bubbles that sink) or <b>sediment</b>. Water is denser and collects at the low point — that's why you drain before, not after, fueling and after the airplane has sat.</p>
 <div class="dpe"><b>DPE follow-up:</b> "Why select BOTH instead of a single tank?" In a high-wing gravity-feed airplane, BOTH keeps both tanks feeding and avoids inadvertently running one tank dry. Also know that <b>unusable fuel</b> (3 gal) is included in the basic empty weight and cannot be counted on.</div>`},

{id:"IG2", area:"I", acs:"PA.I.G.K1f", src:"PHAK ch. 7 &middot; C172S POH sec. 7 &middot; <span class='reg'>14 CFR 91.205</span>", tags:"electrical system alternator battery master 28 volt bus standby",
 q:"Describe the electrical system, and what you do if the alternator fails.",
 a:`<ul>
  <li><b>28-volt direct current</b> system powered by a <b>belt-driven 60-amp alternator</b> and a <b>24-volt battery</b>. <i>Verify your AFM.</i></li>
  <li><b>Split master switch</b> — the <b>BAT</b> half and the <b>ALT</b> half. They can be operated independently; the ALT side can be turned off while leaving battery power on.</li>
  <li>Power is distributed through <b>bus bars</b> with circuit breakers; the G1000 installation includes an <b>essential bus</b> and a <b>standby battery</b> dedicated to keeping the PFD alive.</li>
  <li><b>Alternator advantages over a generator:</b> produces useful current at <b>lower RPM</b> (including at idle on the ground), lighter, and more consistent voltage output.</li>
  <li><b>What's electric:</b> flaps, fuel pump, lights, avionics, starter, turn coordinator, pitot heat, and on a G1000 airplane <b>virtually all of your flight instruments</b>.</li>
  <li><b>What's NOT electric:</b> the <b>magnetos</b> — the engine keeps running — plus the mechanical standby airspeed indicator and altimeter.</li>
 </ul>
 <p><b>Alternator failure indications:</b> a <b>low-voltage annunciation</b> on the PFD, a discharging ammeter, and avionics or displays beginning to drop out.</p>
 <p><b>Response:</b> reduce electrical load to the minimum required, attempt to reset the alternator (ALT half off, then on, per the checklist), and if it doesn't come back, <b>land as soon as practical</b> — you are now on battery only. Know roughly <b>how long your battery will last</b> with the load you're carrying (typically well under 30 minutes with a normal load), and shed everything non-essential.</p>
 <div class="warn"><b>G1000-specific:</b> with a total alternator failure, the <b>standby battery</b> keeps the PFD running for a limited time (roughly 30 minutes — <i>verify your AFM</i>). Your mechanical <b>standby airspeed indicator, altimeter, and magnetic compass</b> are what you fly on when it's gone. Know where they are and practice using them.</div>`},

{id:"IG3", area:"I", acs:"PA.I.G.K1h", src:"PHAK ch. 8 - Flight Instruments &middot; <span class='reg'>14 CFR 91.411</span> &middot; C172S POH sec. 7", tags:"pitot static system blockage alternate static G1000 AHRS ADC",
 q:"Describe the pitot-static system and what happens when each part blocks.",
 a:`<p>The <b>pitot tube</b> senses <b>ram (dynamic + static) air pressure</b> and feeds only the <b>airspeed indicator</b>. The <b>static ports</b> sense ambient pressure and feed the <b>airspeed indicator, altimeter, and vertical speed indicator</b>.</p>
 <p><b>Blocked pitot, drain open:</b> airspeed drops to <b>zero</b>.</p>
 <p><b>Blocked pitot AND drain hole (ice):</b> the airspeed indicator acts like an <b>altimeter</b> — it <b>increases in a climb and decreases in a descent</b>, because trapped pressure is compared against falling/rising static pressure. This is the dangerous one.</p>
 <p><b>Blocked static ports:</b></p>
 <ul>
  <li><b>Altimeter</b> freezes at the altitude where it blocked</li>
  <li><b>VSI</b> reads zero</li>
  <li><b>Airspeed</b> is inaccurate — reads <b>low</b> in a climb and <b>high</b> in a descent</li>
 </ul>
 <p><b>Remedy:</b> use the <b>alternate static source</b>. It draws from inside the cabin, where pressure is slightly <b>lower</b> than outside, so the altimeter reads slightly <b>high</b>, the airspeed reads slightly <b>high</b>, and the VSI momentarily shows a climb. In an unpressurized airplane without an alternate source, you can <b>break the glass</b> of the VSI as a last resort — and remember the VSI will then read <b>backwards</b>.</p>
 <div class="memo"><b>G1000 note:</b> there is <b>no vacuum system</b> on this airplane. Attitude and heading come from the <b>AHRS (GRS 77)</b> — solid-state accelerometers and rate sensors, aided by the magnetometer (GMU 44). Air data comes from the <b>ADC (GDC 74A)</b>, which is fed by the pitot-static system. So a static blockage still corrupts altitude, airspeed, and VSI on the PFD, and an <b>AHRS failure gives you a red X over the attitude and heading</b> — that's when you go to the standby instruments.</div>`},

{id:"IG4", area:"I", acs:"PA.I.G.K1g", src:"PHAK ch. 8 &middot; Garmin G1000 Cockpit Reference Guide &middot; C172S POH sec. 7 &amp; suppl. &middot; <span class='reg'>14 CFR 91.205</span>", tags:"G1000 avionics PFD MFD reversionary AHRS GIA red X",
 q:"Describe the G1000 system and what happens in a display failure.",
 a:`<p><b>Line replaceable units:</b></p>
 <ul>
  <li><b>GDU 1040</b> displays — PFD (left) and MFD (right)</li>
  <li><b>GIA 63/63W</b> Integrated Avionics Units (two) — the "brains": GPS, VHF nav/comm, and the processing link between everything</li>
  <li><b>GRS 77 AHRS</b> — attitude and heading reference</li>
  <li><b>GMU 44</b> magnetometer — in the wing, feeds heading to the AHRS</li>
  <li><b>GDC 74A</b> Air Data Computer — altitude, airspeed, vertical speed, OAT</li>
  <li><b>GEA 71</b> Engine/Airframe Unit — engine and fuel indications on the MFD</li>
  <li><b>GTX 33</b> transponder, <b>GMA 1347</b> audio panel/intercom/marker beacon</li>
 </ul>
 <p><b>Display failure → REVERSIONARY MODE.</b> If either display fails, press the <b>red DISPLAY BACKUP button</b> on the audio panel. The surviving display shows PFD information, engine indications, and a moving map all on one screen. On some installations it reverts automatically.</p>
 <p><b>Red X</b> over an instrument means that LRU has failed or lost data. A red X over attitude/heading = AHRS failure → fly the <b>standby attitude indicator, standby airspeed indicator, standby altimeter, and magnetic compass</b>.</p>
 <div class="dpe"><b>DPE follow-up:</b> "Both GIAs fail — what do you lose?" You lose GPS navigation and both comms from those units. Know where your <b>handheld backup radio</b> is (if carried) and your <b>lost comm</b> procedure. Also be ready to demonstrate, on the ground, how you'd load a direct-to, check the fuel totalizer, bring up the nearest airport page, and find winds aloft on the MFD.</div>`},

{id:"IG5", area:"I", acs:"PA.I.G.K1b", src:"PHAK ch. 6 - Flight Controls &middot; AFH ch. 3 &middot; C172S POH sec. 7", tags:"flaps flight controls primary secondary trim",
 q:"What are the primary and secondary flight controls, and what do the flaps do?",
 a:`<p><b>Primary:</b> <b>ailerons</b> (roll about the longitudinal axis), <b>elevator</b> (pitch about the lateral axis), <b>rudder</b> (yaw about the vertical axis). Cable-and-pulley operated.</p>
 <p><b>Secondary:</b> <b>flaps</b> and <b>elevator trim</b> (a trim tab on the elevator, operated by a wheel in the cockpit).</p>
 <p><b>Flaps — C172S has single-slotted flaps, electrically operated, at 0°, 10°, 20°, and 30°.</b></p>
 <ul>
  <li><b>All flap settings increase lift and increase drag.</b></li>
  <li>The <b>first increments (to 10°)</b> produce a large increase in lift with relatively little drag — useful for <b>shortening the takeoff roll</b> (soft/short field) .</li>
  <li>The <b>later increments (20°–30°)</b> produce much more <b>drag</b> than lift — used to <b>steepen the approach angle without increasing airspeed</b>.</li>
  <li>Flaps <b>lower the stall speed</b> and allow a <b>lower nose attitude</b> on approach, improving forward visibility.</li>
 </ul>
 <div class="warn"><b>Adverse yaw</b> — the down-going aileron creates more lift <i>and more induced drag</i>, yawing the airplane away from the turn. Correct with <b>coordinated rudder</b> in the direction of the turn. This is the aerodynamic reason behind "step on the ball."</div>`},

/* I.H Human Factors */
{id:"IH1", area:"I", acs:"PA.I.H.K1", src:"<span class='reg'>14 CFR 91.211</span> &middot; AIM 8-1-2 Effects of Altitude &middot; PHAK ch. 17 - Aeromedical Factors", tags:"hypoxia types hypoxic hypemic stagnant histotoxic oxygen 91.211",
 q:"What are the types of hypoxia, and what are the oxygen requirements?",
 a:`<ul>
  <li><b>Hypoxic hypoxia</b> — not enough oxygen available / reduced partial pressure. The altitude kind.</li>
  <li><b>Hypemic hypoxia</b> — blood can't carry the oxygen. Causes: <b>carbon monoxide</b>, anemia, blood loss, donating blood.</li>
  <li><b>Stagnant hypoxia</b> — blood isn't circulating. Causes: excessive G forces, cold, a constricting posture, heart problems.</li>
  <li><b>Histotoxic hypoxia</b> — the cells can't <b>use</b> the oxygen. Causes: <b>alcohol</b> and drugs. (One ounce of alcohol equals roughly 2,000 ft of physiological altitude.)</li>
 </ul>
 <div class="memo"><b>"Hypoxic / Hypemic / Stagnant / Histotoxic"</b> = <b>not enough / can't carry / can't circulate / can't use</b>.</div>
 <p><b>Symptoms:</b> euphoria, impaired judgment (the dangerous one — you don't know it's happening), headache, dizziness, tingling, visual impairment, <b>cyanosis</b> (blue fingernails and lips), and eventually unconsciousness.</p>
 <p><b>Oxygen requirements</b> <span class="reg">91.211</span>, cabin pressure altitude:</p>
 <ul><li><b>12,500–14,000 ft MSL</b> — required crew must use oxygen after <b>30 minutes</b></li>
 <li><b>Above 14,000 ft MSL</b> — required crew must use oxygen <b>the entire time</b></li>
 <li><b>Above 15,000 ft MSL</b> — <b>each occupant</b> must be <b>provided</b> oxygen</li></ul>
 <div class="memo"><b>"30 at 12.5, all the time at 14, everybody at 15."</b></div>
 <p><b>Night vision degrades starting around 5,000 ft</b> — consider supplemental oxygen at night above that even though it isn't required.</p>`},

{id:"IH2", area:"I", acs:"PA.I.H.K1", src:"AIM 8-1-4 Carbon Monoxide Poisoning in Flight &middot; PHAK ch. 17", tags:"carbon monoxide CO poisoning heater exhaust symptoms",
 q:"How does carbon monoxide poisoning happen in this airplane, and what do you do?",
 a:`<p>Cabin heat is produced by routing fresh air over a <b>shroud (heat muff) around the exhaust manifold</b>. A <b>crack in the exhaust system</b> allows carbon monoxide to enter the cabin through the heater.</p>
 <p><b>CO is colorless, odorless, and tasteless</b>, and binds to hemoglobin roughly <b>200–250 times more readily</b> than oxygen — causing <b>hypemic hypoxia</b>.</p>
 <p><b>Symptoms:</b> headache, drowsiness, dizziness, nausea, blurred vision, loss of muscle power, and a feeling of sluggishness. Smokers are more susceptible.</p>
 <p><b>Actions:</b></p>
 <ol><li><b>Turn the cabin heat OFF</b> immediately</li>
 <li><b>Open fresh air vents / a window</b> and ventilate</li>
 <li>Use supplemental oxygen if available</li>
 <li><b>Land as soon as practical</b> and seek medical attention — it takes hours to fully clear</li></ol>
 <div class="dpe"><b>DPE follow-up:</b> "How would you detect it?" A <b>CO detector</b> — a chemical spot card or, better, an electronic detector. Carry one. Also look for exhaust staining during preflight.</div>`},

{id:"IH3", area:"I", acs:"PA.I.H.K1", src:"AIM 8-1-5 Illusions in Flight (para. 2) &middot; PHAK ch. 17", tags:"spatial disorientation vestibular illusions leans coriolis graveyard somatogravic",
 q:"What is spatial disorientation, and name the vestibular illusions.",
 a:`<p><b>Spatial disorientation</b> = the inability to determine your position, attitude, and motion relative to the earth. Caused by a conflict between the <b>visual, vestibular (inner ear), and postural (seat-of-the-pants)</b> systems. Occurs when visual references are lost.</p>
 <p><b>Vestibular illusions:</b></p>
 <ul>
  <li><b>The Leans</b> — most common. A slow roll into a bank goes undetected; an abrupt correction back to level feels like a bank the other way, so you lean to compensate.</li>
  <li><b>Coriolis illusion</b> — moving your head during a prolonged constant-rate turn abruptly sets other canals in motion, creating an overwhelming sensation of rotating on a completely different axis. Extremely disorienting.</li>
  <li><b>Graveyard spiral</b> — in a prolonged coordinated turn the sensation of turning ceases; on rolling level you feel like you're turning the other way, so you re-enter the turn, notice the altitude loss, and pull back — <b>tightening the spiral</b>.</li>
  <li><b>Somatogravic illusion</b> — rapid acceleration feels like a <b>nose-up pitch</b>, prompting a dangerous nose-down correction (deadly on a night takeoff). Rapid deceleration feels nose-down.</li>
  <li><b>Inversion illusion</b> — an abrupt change from climb to straight-and-level feels like <b>tumbling backwards</b>.</li>
  <li><b>Elevator illusion</b> — an abrupt updraft feels like a climb, prompting a nose-down input.</li>
 </ul>
 <div class="warn"><b>The only cure:</b> <b>trust the instruments</b>, not your body. Fly the instruments, avoid abrupt head movements, and if disoriented at night or in reduced visibility, level the wings by reference to the attitude indicator and get help.</div>`},

{id:"IH4", area:"I", acs:"PA.I.H.K1", src:"AIM 8-1-5 Illusions in Flight (para. 3) &middot; PHAK ch. 17", tags:"visual illusions runway width slope black hole featureless autokinesis false horizon",
 q:"Name the visual illusions that lead to landing errors.",
 a:`<ul>
  <li><b>Runway width</b> — a <b>narrower-than-usual</b> runway makes you feel <b>higher</b> than you are → you fly a <b>lower</b> approach and risk landing short. A <b>wider</b> runway makes you feel low → you flare high and may drop in.</li>
  <li><b>Runway and terrain slope</b> — an <b>upsloping</b> runway or upsloping terrain makes you feel high → you fly a <b>lower</b> approach. A <b>downsloping</b> runway makes you feel low → you fly higher.</li>
  <li><b>Featureless terrain (black hole) approach</b> — an approach over water, dark terrain, or snow with no lights between you and the runway creates the illusion of being <b>too high</b> → dangerously <b>low</b> approach. Classic night-accident setup.</li>
  <li><b>Atmospheric illusions</b> — rain on the windscreen makes the runway appear <b>lower</b>, and haze makes it appear <b>farther away</b> → both lead to a lower, flatter approach.</li>
  <li><b>False horizon</b> — sloping cloud decks, a dark night with scattered ground lights, or stars confused with ground lights cause you to align the airplane with a false horizon.</li>
  <li><b>Autokinesis</b> — staring at a single stationary light in the dark for several seconds makes it appear to <b>move</b>, prompting you to chase it.</li>
 </ul>
 <div class="memo"><b>The mitigation for all of them:</b> use the <b>VASI/PAPI</b>, cross-check your <b>altimeter and glidepath</b>, fly a <b>stabilized approach</b> with a known power setting and airspeed, and <b>overfly unfamiliar airports</b> before landing when possible.</div>`},

{id:"IH5", area:"I", acs:"PA.I.H.R1", src:"<span class='reg'>14 CFR 91.3</span> <span class='reg'>91.103</span> &middot; RMH FAA-H-8083-2A &middot; PHAK ch. 2 - Aeronautical Decision-Making", tags:"IMSAFE PAVE 5P DECIDE ADM risk management",
 q:"What risk management tools do you use, and how?",
 a:`<div class="memo"><b>IMSAFE</b> — personal checklist for the <i>pilot</i>:<br>
 <b>I</b>llness &middot; <b>M</b>edication &middot; <b>S</b>tress &middot; <b>A</b>lcohol &middot; <b>F</b>atigue &middot; <b>E</b>motion (or Eating)</div>
 <div class="memo"><b>PAVE</b> — identify hazards across four areas:<br>
 <b>P</b>ilot &middot; <b>A</b>ircraft &middot; <b>e</b>n<b>V</b>ironment &middot; <b>E</b>xternal pressures</div>
 <div class="memo"><b>5 P's</b> — recheck at key decision points (preflight, pre-takeoff, cruise, pre-descent, pre-landing):<br>
 <b>P</b>lan &middot; <b>P</b>lane &middot; <b>P</b>ilot &middot; <b>P</b>assengers &middot; <b>P</b>rogramming</div>
 <div class="memo"><b>DECIDE</b> — the decision-making loop:<br>
 <b>D</b>etect &middot; <b>E</b>stimate &middot; <b>C</b>hoose &middot; <b>I</b>dentify &middot; <b>D</b>o &middot; <b>E</b>valuate</div>
 <p><b>3P model:</b> <b>P</b>erceive the hazard → <b>P</b>rocess the risk (likelihood × severity) → <b>P</b>erform the mitigation. Use a <b>risk matrix</b> to classify likelihood (probable/occasional/remote/improbable) against severity (catastrophic/critical/marginal/negligible).</p>
 <div class="dpe"><b>Apply it, don't recite it.</b> The DPE wants to hear you use these on a real scenario: "Given today — I'm legal and rested, the airplane is airworthy with the squawk I mentioned, the environment has a 20-knot gusty crosswind at my limit, and the external pressure is that you're waiting on me. That combination pushes this into unacceptable risk, so here's what I'd change…"</div>`},

{id:"IH6", area:"I", acs:"PA.I.H.R1", src:"PHAK ch. 2 &middot; RMH FAA-H-8083-2A", tags:"hazardous attitudes antidotes macho impulsivity invulnerability resignation anti-authority",
 q:"Name the five hazardous attitudes and their antidotes.",
 a:`<table style="width:100%;border-collapse:collapse;font-size:13.5px">
 <tr><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Anti-authority</b><br><i>"Don't tell me what to do."</i></td><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Follow the rules. They are usually right.</b></td></tr>
 <tr><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Impulsivity</b><br><i>"Do something — quickly!"</i></td><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Not so fast. Think first.</b></td></tr>
 <tr><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Invulnerability</b><br><i>"It won't happen to me."</i></td><td style="padding:6px;border-bottom:1px solid var(--line)"><b>It could happen to me.</b></td></tr>
 <tr><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Macho</b><br><i>"I can do it."</i></td><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Taking chances is foolish.</b></td></tr>
 <tr><td style="padding:6px"><b>Resignation</b><br><i>"What's the use?"</i></td><td style="padding:6px"><b>I'm not helpless. I can make a difference.</b></td></tr>
 </table>
 <p>Related traps: <b>get-there-itis</b> (plan continuation bias), <b>peer pressure</b>, <b>loss of situational awareness</b>, <b>operating without adequate fuel reserves</b>, <b>neglect of flight planning</b>, <b>descent below minimums</b>, <b>flying outside the envelope</b>, and <b>inadequate preflight</b>.</p>`},

{id:"IH7", area:"I", acs:"PA.I.H.K1", src:"AIM 8-1-2 Effects of Altitude (para. 4, Decompression Sickness After Scuba Diving) &middot; PHAK ch. 17", tags:"hyperventilation scuba diving dehydration fatigue night vision",
 q:"Explain hyperventilation, and the scuba diving wait times.",
 a:`<p><b>Hyperventilation</b> — breathing too rapidly expels too much <b>carbon dioxide</b>, disturbing blood chemistry. Usually triggered by <b>stress, anxiety, or fear</b>.</p>
 <p><b>Symptoms overlap with hypoxia</b>: dizziness, tingling, lightheadedness, visual impairment, muscle spasms — but hyperventilation does <b>not</b> produce cyanosis.</p>
 <p><b>Treatment:</b> slow your breathing rate, talk aloud, or breathe into a bag to restore CO₂. <b>If in doubt at altitude, assume hypoxia and use oxygen first</b> — treating for the more dangerous condition.</p>
 <p><b>Scuba diving</b> (AIM 8-1-2) — nitrogen absorbed during a dive can cause decompression sickness at altitude:</p>
 <ul><li>Dive <b>not</b> requiring a controlled ascent: wait <b>12 hours</b> before flying up to 8,000 ft MSL</li>
 <li>Dive <b>requiring</b> a controlled ascent: wait <b>24 hours</b> before flying up to 8,000 ft MSL</li>
 <li>Flight <b>above 8,000 ft MSL</b>: wait <b>24 hours</b> after <b>any</b> dive</li></ul>
 <div class="memo"><b>"12 / 24 / 24"</b> — and when in doubt, 24 hours covers everything.</div>
 <p><b>Night vision:</b> rods are off-center and responsible for night vision; use <b>off-center viewing</b> (look 5–10° to the side). Adaptation takes <b>30 minutes</b> and is destroyed in seconds by bright light. Use red or dim white light, and avoid smoking and alcohol, which degrade night vision.</p>`}
);
