/* ★ PRIORITY — PA.II.A.R3 */
{id:"IIAR3", area:"II", acs:"PA.II.A.R3", src:"<b>ACS PA.II.A.R3</b> &middot; <span class='reg'>14 CFR 91.103</span> <span class='reg'>91.3</span> &middot; RMH FAA-H-8083-2A &middot; PHAK ch. 2", prio:true, tags:"environment risk weather airports airspace terrain obstacles PAVE preflight assessment",
 q:"★ MISSED CODE — Identify, assess, and mitigate the risks associated with the ENVIRONMENT.",
 a:`<div class="warn"><b>Missed knowledge-test code.</b> ACS text: <i>"PA.II.A.R3 Environment (e.g., weather, airports, airspace, terrain, obstacles)."</i> This is a <b>Risk Management</b> code, not a knowledge code — so the DPE is not looking for a definition. They want to hear you <b>identify a hazard, assess the risk, and state a specific mitigation</b>, applied to today's actual flight.</div>
 <p><b>Use the structure: Hazard → Risk → Mitigation.</b> Walk the five environmental categories in the ACS text, out loud:</p>
 <p><b>1. WEATHER</b></p>
 <ul>
  <li><i>Hazards:</i> ceilings and visibility, crosswind and gusts, thunderstorms, turbulence, icing, density altitude, low-level wind shear, deteriorating conditions en route.</li>
  <li><i>Mitigations:</i> a complete standard briefing plus in-flight updates; <b>written personal minimums</b> more restrictive than 91.155; a defined <b>turn-back point</b> and alternate; delaying or cancelling; adding fuel for a diversion; avoiding convective activity by 20 NM.</li>
 </ul>
 <p><b>2. AIRPORTS</b></p>
 <ul>
  <li><i>Hazards:</i> runway length and surface condition, slope, displaced thresholds, non-towered traffic, unfamiliar fields, construction, wildlife, runway incursion hot spots, no fuel available, tower closed.</li>
  <li><i>Mitigations:</i> read the <b>Chart Supplement</b> and <b>NOTAMs</b> for every airport of intended use; compute <b>actual</b> takeoff and landing distance with margin; brief the taxi route <b>before</b> you move; overfly unfamiliar fields; have a second airport in mind.</li>
 </ul>
 <p><b>3. AIRSPACE</b></p>
 <ul>
  <li><i>Hazards:</i> busy Class C at Wichita, inadvertent Class D entry without two-way comms, TFRs, MOAs and restricted areas, Mode C/ADS-B requirements, airspace reverting when the KBEC tower closes.</li>
  <li><i>Mitigations:</i> current charts and an EFB with TFR overlay; check NOTAMs on the day of flight; request <b>flight following</b>; brief frequency changes and airspace boundaries on your nav log; know the Class D ceiling and tower hours before you launch.</li>
 </ul>
 <p><b>4. TERRAIN</b></p>
 <ul>
  <li><i>Hazards:</i> rising terrain, the <b>maximum elevation figure (MEF)</b> in each quadrangle, reduced glide options, mountain wave and downdrafts, night flight over dark terrain.</li>
  <li><i>Mitigations:</i> plan an altitude with adequate terrain clearance; use the <b>terrain page and TAWS-B on the MFD</b>; select a route with landable terrain; higher altitude at night for more gliding options.</li>
 </ul>
 <p><b>5. OBSTACLES</b></p>
 <ul>
  <li><i>Hazards:</i> towers and antenna farms (common across Kansas, some over 1,000 ft AGL), wires, cranes, unlit obstructions at night, obstacles in the departure path.</li>
  <li><i>Mitigations:</i> check obstruction heights on the sectional and in the Chart Supplement; check NOTAMs for unlit towers and temporary cranes; use a <b>short-field/obstacle-clearance takeoff and V<sub>X</sub></b> when the departure path is obstructed; avoid low-level maneuvering.</li>
 </ul>
 <div class="dpe"><b>How to score well on this code:</b> don't list — <b>decide</b>. Say it like this: <i>"The hazard today is a 15-knot gusting-to-22 direct crosswind on runway 1. The risk is loss of directional control on landing, which is moderately likely and could be serious. My mitigation is that the demonstrated crosswind component for this airplane is 15 knots and my personal minimum is 12, so I'd use the other runway, go to a field with a better-aligned runway, or wait."</i> That structure — specific hazard, honest assessment, concrete decision — is what the ACS is testing.</div>
 <div class="memo"><b>Don't forget the other four R-codes in this same task,</b> since they're right next to the one you missed: <b>R1 Pilot</b> (IMSAFE), <b>R2 Aircraft</b> (airworthiness, squawks, fuel, equipment), <b>R4 External pressures</b> (get-there-itis, the DPE waiting, passengers' schedule), and <b>R5 Aviation security concerns</b> (suspicious activity, aircraft security, TSA/"If You See Something, Say Something," securing the airplane).</div>`},

{id:"II1", area:"II", acs:"PA.II.A.S1", src:"<span class='reg'>14 CFR 91.7(b)</span> <span class='reg'>91.103</span> &middot; AFH ch. 2 - Ground Operations &middot; C172S POH sec. 4", tags:"preflight inspection checklist why walkaround",
 q:"Why do we preflight, and what are you actually looking for?",
 a:`<p><span class="reg">91.7(b)</span> makes the <b>PIC</b> responsible for determining the aircraft is in condition for safe flight. The preflight is how you discharge that duty.</p>
 <p><b>Before you touch the airplane:</b> check the <b>aircraft and engine logbooks</b> for inspection currency and AD compliance, the <b>ARROW</b> documents, and any open <b>squawks</b> or deferred items.</p>
 <p><b>Walkaround — you're looking for:</b> fluid levels (fuel quantity <b>visually verified</b>, oil), fluid leaks and stains, structural damage (dents, cracks, wrinkled skin, popped rivets), control surface freedom and security (including hinges, bolts, and <b>stops</b>), tire condition and inflation, brake wear and leaks, static ports and pitot tube clear (<b>remove the cover</b>), fuel vents clear, antennas secure, prop nicks and spinner security, exhaust security and staining, and all <b>frost, snow, or ice removed</b>.</p>
 <div class="warn"><b>Use the checklist, every time, in the airplane.</b> The ACS expects the checklist to be used, not recited from memory. If you find a discrepancy during the checkride preflight, <b>say so out loud</b> and evaluate it against 91.213 — finding something and handling it properly is a pass, not a problem.</div>`},

{id:"II2", area:"II", acs:"PA.II.B.K1", src:"<span class='reg'>14 CFR 91.107(a)(2)</span> <span class='reg'>91.105</span> <span class='reg'>91.519</span>", tags:"flight deck management passenger briefing SAFETY seatbelt 91.107",
 q:"Give me your passenger briefing.",
 a:`<div class="memo"><b>SAFETY</b><br>
 <b>S</b>eatbelts and shoulder harnesses — how to fasten, unfasten, adjust; when required<br>
 <b>A</b>ir vents, <b>A</b>ll environmental controls, and <b>A</b>ction in an emergency (your role, my role)<br>
 <b>F</b>ire extinguisher — location and operation<br>
 <b>E</b>xits and <b>E</b>mergency evacuation plan<br>
 <b>T</b>raffic and <b>T</b>alking — sterile cockpit, help me look for traffic, don't talk during critical phases<br>
 <b>Y</b>our questions — invite them, and tell them they can speak up any time something concerns them</div>
 <p><b>Seatbelt regulations</b> <span class="reg">91.107</span>: the PIC must <b>brief</b> on how to fasten/unfasten, and must <b>notify</b> passengers to fasten belts and shoulder harnesses before <b>taxi, takeoff, and landing</b>. Each person must occupy a seat with the belt fastened during those phases.</p>
 <p>Also cover: <b>sterile cockpit</b> below 10,000 ft / during taxi, takeoff, approach, and landing; <b>do not touch</b> the controls, switches, or door handle; how to use the headset and intercom; what motion sickness feels like and where the bags are; and the "<b>I have the controls / you have the controls</b>" exchange if a passenger is in the front seat.</p>`},

{id:"II3", area:"II", acs:"PA.II.C.K1", src:"C172S POH sec. 3 &amp; 4 &middot; AFH ch. 2 &middot; PHAK ch. 7", tags:"engine start hot start flooded fire during start",
 q:"How do you start a fuel-injected engine, and what if it catches fire during start?",
 a:`<p><b>Normal start:</b> mixture rich, throttle cracked, aux fuel pump ON to prime until fuel flow is indicated, aux pump OFF, mixture idle cutoff, then crank — advancing the mixture to rich as the engine fires. <b>Follow the checklist for your airplane.</b></p>
 <p><b>Hot start</b> (a known fuel-injection issue — fuel vaporizes in the lines): use a <b>minimum or no prime</b>, or purge with the aux pump and mixture lean, then crank with the mixture at idle cutoff and advance as it fires.</p>
 <p><b>Before cranking:</b> ensure the <b>area is clear</b> — call "CLEAR PROP!", check the prop arc, mixture, brakes set, beacon on.</p>
 <p><b>Engine fire during start</b> — per the AFM, generally:</p>
 <ol><li><b>Keep cranking</b> — try to start the engine and draw the fire into the cylinders</li>
 <li>If it starts: run at high RPM briefly, then shut down and inspect</li>
 <li>If it won't start: <b>mixture IDLE CUTOFF</b>, <b>fuel selector OFF</b>, <b>throttle full open</b>, continue cranking, <b>master OFF</b>, <b>evacuate</b>, and fight the fire with an extinguisher</li></ol>
 <div class="warn"><b>Verify the exact sequence in your AFM's Emergency Procedures section</b> and be able to recite it. This is a memory item the DPE will ask for.</div>`},

{id:"II4", area:"II", acs:"PA.II.D.K2", src:"AFH ch. 2 - Ground Operations &middot; PHAK ch. 14 - Airport Operations", tags:"taxi wind correction controls quartering headwind tailwind",
 q:"How do you position the flight controls while taxiing in wind?",
 a:`<div class="memo"><b>The two rules:</b><br>
 <b>Headwind (wind ahead of the wing):</b> <b>CLIMB INTO IT</b> — turn the yoke <b>into</b> the wind, aileron up on the windward side, elevator neutral.<br>
 <b>Tailwind (wind behind the wing):</b> <b>DIVE AWAY FROM IT</b> — turn the yoke <b>away</b> from the wind and push the elevator <b>down</b> (yoke forward).</div>
 <p><b>Why:</b> with a quartering <b>headwind</b>, raising the upwind aileron keeps the wind from getting under the upwind wing and lifting it. With a quartering <b>tailwind</b>, the wind can get under the upwind wing <i>and</i> under the elevator — so you lower the upwind aileron and push the elevator down to pin the tail.</p>
 <p>Also: taxi at a speed where you can stop in the available distance (a brisk walk), <b>check the brakes immediately</b> after you start rolling, and verify the flight instruments during taxi turns — on a G1000 check that the <b>HSI is turning the correct direction</b> and the <b>turn rate indicator</b> responds.</p>`},

{id:"II5", area:"II", acs:"PA.II.D.R1", src:"AC 91-73B &middot; AIM 4-3-1 &middot; AFH ch. 2 &middot; PHAK ch. 14", tags:"runway incursion avoidance hot spot taxi diagram hold short",
 q:"How do you avoid a runway incursion?",
 a:`<p>A <b>runway incursion</b> is any unauthorized aircraft, vehicle, or person on a runway surface.</p>
 <ul>
  <li><b>Plan the taxi route before you move</b>, using an airport diagram, and write down your taxi clearance</li>
  <li><b>Read back all hold short instructions</b> — required by AIM, and the readback includes the runway</li>
  <li>Know the markings: <b>solid yellow lines on your side</b> of the hold-short marking means stop; dashed lines mean you may cross when exiting. <b>Red and white signs</b> are mandatory instruction signs (runway holding position); <b>black with white numbers</b> tells you the runway you're on; <b>yellow with black</b> is a direction/location sign.</li>
  <li><b>Sterile cockpit</b> while taxiing — no checklists or programming while moving on an unfamiliar surface; stop the airplane if you need to do something</li>
  <li><b>Check the final approach course</b> before crossing or entering any runway</li>
  <li><b>Lights:</b> turn on all exterior lights when crossing a runway; use the landing light when entering one</li>
  <li>Be especially alert at <b>hot spots</b> marked on the airport diagram</li>
  <li>If you are <b>unsure of your position</b>, <b>stop and ask</b> — ATC would far rather give you progressive taxi instructions</li>
 </ul>
 <div class="dpe"><b>DPE follow-up:</b> "You're cleared to taxi and you get disoriented at an intersection." Correct answer: stop, hold your position, and request <b>progressive taxi</b>. Guessing is how incursions happen.</div>`},

{id:"II6", area:"II", acs:"PA.II.F.K1", src:"<span class='reg'>14 CFR 91.7(a)</span> &middot; C172S POH sec. 4 &middot; AFH ch. 2", tags:"run-up before takeoff check magneto why reason departure briefing",
 q:"Why do we do a run-up, and what are you verifying?",
 a:`<p>The run-up verifies the engine and systems will perform at <b>high power before you commit to flight</b> — the last chance to find a problem on the ground.</p>
 <ul>
  <li><b>Magneto check</b> — small, roughly even RPM drops; no drop may mean a broken P-lead</li>
  <li><b>Engine instruments</b> — oil temp and pressure in the green, fuel flow, CHT/EGT</li>
  <li><b>Alternator/ammeter</b> and low-voltage annunciation out</li>
  <li><b>Flight controls</b> — free and correct</li>
  <li><b>Flight instruments</b> — set and cross-checked; altimeter set to the current setting and reading field elevation within <b>75 feet</b></li>
  <li><b>Trim</b> set for takeoff, <b>flaps</b> set, <b>fuel selector</b> on BOTH, <b>mixture</b> rich</li>
  <li><b>Doors and windows</b> latched, <b>seatbelts</b> fastened, <b>seats</b> locked</li>
 </ul>
 <p><b>Position the airplane</b> for run-up: into the wind if practical, on a firm surface, and not blasting the aircraft behind you.</p>
 <div class="memo"><b>Takeoff/departure briefing</b> — say it out loud on the checkride, every time:<br>
 "Runway 19, winds are X, this is a normal takeoff. Airspeed alive by the 1,000-ft markers, rotate at 55, climb at 74. <b>Abort</b> for any engine roughness, abnormal instrument indication, or anything that doesn't feel right before rotation. <b>Engine failure on the runway</b>: throttle idle, brake, stop straight ahead. <b>Engine failure below 700 AGL</b>: lower the nose, land straight ahead within about 30° either side, no turn back. <b>Above 700 AGL</b>: consider a turn back to the field or the best available option."</div>`},

/* AREA III */
{id:"III1", area:"III", acs:"PA.III.A.K1", src:"AIM 4-3-13 Traffic Control Light Signals &middot; <span class='reg'>14 CFR 91.125</span>", tags:"radio communications phraseology lost comm light gun signals",
 q:"What are the ATC light gun signals?",
 a:`<table style="width:100%;border-collapse:collapse;font-size:13.5px">
 <tr><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Signal</b></td><td style="padding:6px;border-bottom:1px solid var(--line)"><b>On the ground</b></td><td style="padding:6px;border-bottom:1px solid var(--line)"><b>In flight</b></td></tr>
 <tr><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Steady green</b></td><td style="padding:6px;border-bottom:1px solid var(--line)">Cleared for takeoff</td><td style="padding:6px;border-bottom:1px solid var(--line)">Cleared to land</td></tr>
 <tr><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Flashing green</b></td><td style="padding:6px;border-bottom:1px solid var(--line)">Cleared to taxi</td><td style="padding:6px;border-bottom:1px solid var(--line)">Return for landing (followed by steady green at the proper time)</td></tr>
 <tr><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Steady red</b></td><td style="padding:6px;border-bottom:1px solid var(--line)">Stop</td><td style="padding:6px;border-bottom:1px solid var(--line)">Give way to other aircraft and continue circling</td></tr>
 <tr><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Flashing red</b></td><td style="padding:6px;border-bottom:1px solid var(--line)">Taxi clear of the runway in use</td><td style="padding:6px;border-bottom:1px solid var(--line)">Airport unsafe — do not land</td></tr>
 <tr><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Flashing white</b></td><td style="padding:6px;border-bottom:1px solid var(--line)">Return to starting point on airport</td><td style="padding:6px;border-bottom:1px solid var(--line)">—</td></tr>
 <tr><td style="padding:6px"><b>Alternating red/green</b></td><td style="padding:6px">Exercise extreme caution</td><td style="padding:6px">Exercise extreme caution</td></tr>
 </table>
 <p><b>Acknowledge</b>: in flight, rock your wings (day) or blink the landing light (night). On the ground, move the ailerons/rudder (day) or blink the landing light (night).</p>
 <p><b>Lost comm procedure</b> <span class="reg">14 CFR 91.129(c)(2) / AIM 4-3-13</span>: squawk <b>7600</b>, remain outside or above the Class D until you determine the direction and flow of traffic, then join the pattern and watch for light signals. Attempt contact on other frequencies or with a cell phone if on the ground.</p>`},

{id:"III2", area:"III", acs:"PA.III.A.K2", src:"AIM 2-1-2 Visual Glideslope Indicators &middot; AIM 2-1-8 Pilot Control of Airport Lighting &middot; AIM 2-1-9 Airport/Heliport Beacons &middot; PHAK ch. 14", tags:"runway lighting VASI PAPI REIL pilot controlled lighting",
 q:"Describe airport lighting, including VASI and PAPI.",
 a:`<ul>
  <li><b>Runway edge lights</b> — white; <b>yellow</b> on the last 2,000 ft (or half the runway, whichever is less) of an instrument runway to warn of the remaining distance. Intensity: HIRL, MIRL, LIRL.</li>
  <li><b>Threshold</b> — <b>green</b> when viewed on approach; <b>red</b> at the departure end.</li>
  <li><b>Taxiway</b> — <b>blue</b> edge lights, <b>green</b> centerline lights.</li>
  <li><b>REIL</b> — Runway End Identifier Lights; synchronized flashing white lights at the threshold.</li>
  <li><b>Rotating beacon</b> — white/green for a lighted <b>civilian land airport</b>; white/yellow for water; two quick whites and a green for a military field. Operation of the beacon <b>during daylight hours</b> at a controlled field often means the <b>ground visibility is less than 3 SM and/or the ceiling is less than 1,000 ft</b> — i.e., you need a clearance (special VFR) to operate in that surface area.</li>
 </ul>
 <p><b>VASI</b> — typically two bars, usable to 4 NM day / 20 NM night, giving a 3° glidepath with obstruction clearance within ±10° of the extended centerline and 4 NM out.</p>
 <div class="memo"><b>VASI:</b> "<b>Red over white, you're all right.</b> Red over red, you're dead (low). White over white, you'll fly all night (high)."</div>
 <p><b>PAPI</b> — a single row of four lights: 4 white = too high; 3 white/1 red = slightly high; 2 white/2 red = <b>on glidepath</b>; 1 white/3 red = slightly low; 4 red = too low.</p>
 <p><b>Pilot-controlled lighting:</b> key the mic on the CTAF — <b>7 clicks</b> = highest intensity, <b>5 clicks</b> = medium, <b>3 clicks</b> = lowest. Always key 7 times first to be sure the system is on, then adjust down. Lights stay on for <b>15 minutes</b>.</p>`},

{id:"III3", area:"III", acs:"PA.III.B.K1", src:"<span class='reg'>14 CFR 91.126(b)</span> <span class='reg'>91.127</span> &middot; AIM 4-3-3 Traffic Patterns &middot; AFH ch. 8 - Airport Traffic Patterns", tags:"traffic pattern entry 45 downwind non-towered CTAF altitude",
 q:"Describe a standard traffic pattern and how you enter it at a non-towered airport.",
 a:`<p><b>Standard pattern is LEFT turns</b> <span class="reg">91.126</span> unless the airport specifies right traffic (shown by "RP" in the Chart Supplement and by the segmented circle). Pattern altitude is typically <b>1,000 ft AGL</b> for singles (1,500 AGL for large/turbine aircraft).</p>
 <p><b>The five legs:</b> departure, crosswind, downwind, base, final.</p>
 <p><b>Entry (AIM 4-3-3):</b> enter the downwind at pattern altitude on a <b>45° angle to the midpoint of the downwind leg</b>. If you're arriving from the opposite side, <b>overfly the field at least 500 ft above pattern altitude</b> (typically 1,500 AGL), proceed well clear (2 NM), then descend to pattern altitude and turn to enter on the 45.</p>
 <p><b>Self-announce on CTAF</b>: 10 miles out, entering downwind, turning base, turning final, and clear of the runway. State the <b>airport name first and last</b>: "Beech Factory traffic, Skyhawk 12345, 10 miles south, inbound for landing, Beech Factory."</p>
 <p><b>Check the wind indicators</b> — wind sock, tetrahedron, wind tee — and the <b>segmented circle</b> for the traffic pattern direction.</p>
 <div class="warn"><b>Right of way on final</b> <span class="reg">91.113(g)</span>: aircraft on final approach or landing have the right of way, and when two are approaching to land, the one at the <b>lower altitude</b> has the right of way — but you may <b>not</b> use that rule to cut in front of or overtake another aircraft.</div>`},

{id:"III4", area:"III", acs:"PA.III.B.K2", src:"<span class='reg'>14 CFR 91.113</span> <span class='reg'>91.115</span> &middot; AIM 7-4-4 Vortex Behavior &middot; AIM 7-4-6 Vortex Avoidance Procedures &middot; AIM 7-4-8 Pilot Responsibility", tags:"right of way 91.113 collision avoidance see and avoid wake turbulence",
 q:"What are the right-of-way rules, and how do you avoid wake turbulence?",
 a:`<p><span class="reg">91.113</span> — <b>regardless of whether an operation is conducted under IFR or VFR, vigilance shall be maintained to see and avoid.</b></p>
 <ul>
  <li><b>In distress</b> — has the right of way over all other traffic</li>
  <li><b>Converging</b> (same category): the aircraft to the <b>right</b> has the right of way</li>
  <li><b>Different categories</b>, least maneuverable wins: <b>balloon → glider → airship → airplane/rotorcraft</b>. (An aircraft <b>towing or refueling</b> has right of way over all other engine-driven aircraft.)</li>
  <li><b>Head-on</b> — <b>both</b> alter course to the <b>right</b></li>
  <li><b>Overtaking</b> — the aircraft being overtaken has the right of way; the overtaking aircraft passes <b>to the right</b></li>
  <li><b>Landing</b> — aircraft on final/landing have the right of way; lower aircraft has right of way, no cutting in</li>
 </ul>
 <div class="memo"><b>"Balloons Gradually Ascend Rapidly"</b> — <b>B</b>alloon, <b>G</b>lider, <b>A</b>irship, <b>R</b>otorcraft/airplane, in order of right of way.</div>
 <p><b>Wake turbulence:</b> wingtip vortices are generated by a wing <b>producing lift</b>, and are greatest when the generating aircraft is <b>HEAVY, CLEAN, and SLOW</b>. Vortices sink about <b>300–500 fpm</b>, level off roughly <b>900 ft below</b> the flight path, and move outward about 5 kt in still air. A <b>light quartering tailwind</b> is the worst case — it holds the upwind vortex on the runway and blows the downwind vortex toward a parallel runway.</p>
 <p><b>Avoidance:</b></p>
 <ul><li><b>Landing behind a larger aircraft:</b> stay <b>at or above</b> its flight path and land <b>beyond</b> its touchdown point</li>
 <li><b>Departing behind a larger aircraft:</b> rotate <b>before</b> its rotation point and climb <b>above and upwind</b> of its flight path</li>
 <li><b>Landing behind a departing aircraft:</b> land <b>well before</b> its rotation point</li>
 <li>Wait <b>3 minutes</b> (or more) when in doubt — and remember you may <b>decline</b> or request a delay if ATC offers an intersection departure or a close-in clearance behind a heavy</li></ul>`}
);

/* ★ PRIORITY — PA.IV.C.K4 */
{id:"IVCK4", area:"IV", acs:"PA.IV.C.K4", src:"<b>ACS PA.IV.C.K4</b> &middot; PHAK ch. 5 - Aerodynamics of Flight &middot; AFH ch. 6 - Takeoffs and Departure Climbs", prio:true, tags:"ground effect soft field induced drag downwash wingtip vortices",
 q:"★ MISSED CODE — What is ground effect, and how does it affect a soft-field takeoff?",
 a:`<div class="warn"><b>Missed knowledge-test code.</b> ACS text: <i>"PA.IV.C.K4 Ground effect"</i> under Task C, Soft-Field Takeoff and Climb. Expect both the aerodynamic explanation <b>and</b> the practical application to the soft-field takeoff you'll fly.</div>
 <p><b>Definition:</b> ground effect is the change in aerodynamic performance that occurs when the airplane operates within approximately <b>one wingspan</b> of the surface.</p>
 <p><b>The mechanism:</b> the ground <b>restricts the formation of wingtip vortices</b> and interferes with the downwash behind the wing. Less downwash means the relative wind is <b>less deflected downward</b>, which:</p>
 <ul>
  <li><b>Decreases the induced angle of attack</b></li>
  <li><b>Dramatically decreases induced drag</b> — roughly <b>50% reduction at about 1/4 wingspan</b> above the surface, and about <b>1.4% at one full wingspan</b></li>
  <li>Effectively <b>increases the lift produced at a given angle of attack</b></li>
 </ul>
 <div class="memo"><b>One-line answer:</b> "Ground effect reduces induced drag by interfering with wingtip vortex formation, so the airplane can fly at a lower airspeed than it can out of ground effect."</div>
 <p><b>Effects on TAKEOFF — the dangerous side:</b></p>
 <ul>
  <li>The airplane can <b>become airborne below the speed required to sustain flight out of ground effect</b></li>
  <li>If you climb out of ground effect prematurely, induced drag <b>returns</b>, and you may experience <b>settling back onto the runway, a sudden sink, or an inability to climb</b> — especially at high density altitude, high weight, or with an obstacle ahead</li>
  <li>You may also see a <b>pitch-up tendency</b> and a reduction in <b>static source pressure</b>, causing the airspeed indicator to read slightly low</li>
 </ul>
 <p><b>Effects on LANDING:</b> entering ground effect on short final gives you <b>reduced drag and a floating tendency</b> — the airplane doesn't want to quit flying. Carrying excess airspeed into the flare produces a long float and an overshoot. The airplane will also show a <b>nose-down pitching tendency</b> and may require slightly more back pressure in the flare, and the reduced power requirement can make you overshoot your touchdown point.</p>
 <p><b>SOFT-FIELD TAKEOFF — how ground effect is used deliberately:</b></p>
 <ol>
  <li><b>Flaps 10°</b> (per AFM), taxi onto the surface <b>without stopping</b> to avoid getting stuck, keeping the nosewheel light</li>
  <li><b>Full back elevator</b> during the takeoff roll to transfer weight off the nosewheel onto the wings, reducing drag from the soft surface</li>
  <li>Apply <b>full power smoothly</b>; as the nosewheel comes up, <b>relax back pressure slightly</b> to hold a constant pitch attitude and keep the nosewheel just off the surface</li>
  <li>The airplane <b>lifts off at a very low airspeed</b> — below V<sub>X</sub> and below the speed it could sustain out of ground effect</li>
  <li><b>Level off immediately and accelerate IN ground effect</b> — this is the critical step. Lower the nose to stay within a few feet of the surface while the airplane accelerates to <b>V<sub>X</sub> (62) if an obstacle exists, or V<sub>Y</sub> (74)</b> if it doesn't</li>
  <li>Once at the target speed, <b>climb out of ground effect</b> and retract flaps per the AFM</li>
 </ol>
 <div class="warn"><b>The classic soft-field accident:</b> the pilot lifts off at 40 knots, holds the nose up, and tries to climb directly out of ground effect. Induced drag returns, the airplane settles, and it hits the trees at the end of the field. <b>Accelerate in ground effect first — always.</b></div>
 <div class="dpe"><b>DPE follow-ups:</b> "Why flaps 10 on a soft field?" The first flap increment adds a lot of lift for comparatively little drag, getting you airborne sooner off the soft surface.<br><br>
 "What's the goal of a soft-field takeoff?" To transfer the airplane's weight from the wheels to the wings <b>as early as possible</b>, so soft sand, mud, snow, or tall grass can't bog the wheels down or flip the airplane.<br><br>
 "How is this different from a short-field takeoff?" Short field is about <b>maximum performance over an obstacle</b> — you hold the brakes, apply full power, rotate at the specified speed, and climb at V<sub>X</sub>. Soft field is about <b>minimum time on the surface</b> — you never stop, you lift off as early as possible, and you accelerate in ground effect.</div>`},

/* ★ PRIORITY — PA.IV.D.K1 */
{id:"IVDK1", area:"IV", acs:"PA.IV.D.K1", src:"<b>ACS PA.IV.D.K1</b> &middot; AFH ch. 9 - Approaches and Landings &middot; PHAK ch. 11", prio:true, tags:"stabilized approach energy management soft field landing go around criteria",
 q:"★ MISSED CODE — What is a stabilized approach, and explain energy management.",
 a:`<div class="warn"><b>Missed knowledge-test code.</b> ACS text: <i>"PA.IV.D.K1 A stabilized approach, including energy management concepts"</i> under Task D, Soft-Field Approach and Landing. Note this exact same element appears under <b>every</b> landing task in Area IV — so it's worth knowing cold, and the DPE may ask it in the context of any landing.</div>
 <p><b>A stabilized approach</b> is one in which the airplane is established on a constant-angle glidepath to a predetermined touchdown point, with <b>everything set and stable</b> before reaching a defined gate.</p>
 <p><b>Criteria — all of these constant and in place:</b></p>
 <ul>
  <li><b>On the proper flight path</b> (correct glidepath to the aiming point)</li>
  <li><b>Constant airspeed</b>, at the target approach speed — typically within <b>+10/−5 knots</b></li>
  <li><b>Correct configuration</b> — flaps and gear set for landing</li>
  <li><b>Constant, appropriate rate of descent</b> — normally not more than about <b>500–1,000 fpm</b></li>
  <li><b>Appropriate power setting</b> for the configuration</li>
  <li><b>Wings level / aligned with the runway centerline</b>, with proper drift correction</li>
  <li><b>Only small corrections</b> required to maintain the path and speed</li>
  <li><b>Checklists complete</b> and the landing briefing done</li>
 </ul>
 <div class="memo"><b>The gate:</b> stabilized by <b>500 ft AGL in VMC</b> (1,000 ft in IMC). If you're not stabilized by the gate — or you become unstable at any point below it — <b>go around</b>. No exceptions, no "I can save it."</div>
 <p><b>ENERGY MANAGEMENT:</b></p>
 <p>The airplane holds energy in two forms, and you can trade between them but you cannot create either one for free:</p>
 <ul>
  <li><b>Potential energy = altitude</b> (height above the runway)</li>
  <li><b>Kinetic energy = airspeed</b></li>
  <li><b>Total energy</b> is added by the <b>throttle</b> and removed by <b>drag</b> (flaps, slips, reduced power)</li>
 </ul>
 <p>The practical formulation: <b>pitch controls airspeed, power controls the rate of descent / glidepath</b> on a stabilized approach. Pitch trades altitude for airspeed and vice versa; the throttle changes the total amount of energy in the system.</p>
 <table style="width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px">
 <tr><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Situation</b></td><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Energy state</b></td><td style="padding:6px;border-bottom:1px solid var(--line)"><b>Fix</b></td></tr>
 <tr><td style="padding:6px;border-bottom:1px solid var(--line)">High and fast</td><td style="padding:6px;border-bottom:1px solid var(--line)">Too much total energy</td><td style="padding:6px;border-bottom:1px solid var(--line)">Reduce power, add drag (flaps, forward slip) — or <b>go around</b></td></tr>
 <tr><td style="padding:6px;border-bottom:1px solid var(--line)">High and slow</td><td style="padding:6px;border-bottom:1px solid var(--line)">Energy in the wrong form</td><td style="padding:6px;border-bottom:1px solid var(--line)">Lower the nose to trade altitude for airspeed</td></tr>
 <tr><td style="padding:6px;border-bottom:1px solid var(--line)">Low and fast</td><td style="padding:6px;border-bottom:1px solid var(--line)">Energy in the wrong form</td><td style="padding:6px;border-bottom:1px solid var(--line)">Raise the nose to trade airspeed for altitude</td></tr>
 <tr><td style="padding:6px"><b>Low and slow</b></td><td style="padding:6px"><b>Not enough total energy — the dangerous one</b></td><td style="padding:6px"><b>Add power immediately.</b> Pitch alone cannot fix it</td></tr>
 </table>
 <div class="warn"><b>Low and slow is the killer.</b> If you're low <i>and</i> slow, you have no energy to trade — pulling back only trades the last of your airspeed for a few feet and puts you closer to a stall. The only answer is <b>power</b>, and the better answer is a <b>go-around</b>.</div>
 <p><b>Why this matters on a SOFT-FIELD landing specifically:</b> the soft-field landing requires you to touch down at the <b>minimum possible speed with the nosewheel held off</b>, and to keep the weight on the wings as long as possible. That demands a precisely stabilized approach — you carry a <b>small amount of power into the flare</b> to control the rate of descent and achieve a very soft touchdown on the mains, then <b>hold full back elevator</b> to keep the nosewheel off the surface as long as possible while rolling out. <b>Do not stop</b> on the soft surface, and do not use brakes.</p>
 <div class="dpe"><b>DPE follow-up:</b> "Why carry power into the flare on a soft field?" Without it, you arrive with a higher sink rate and a firmer touchdown — which is exactly what a soft surface punishes. Power lets you arrest the descent and plant the mains gently at minimum speed.</div>`},

/* ★ PRIORITY — PA.IV.F.K3 */
{id:"IVFK3", area:"IV", acs:"PA.IV.F.K3", src:"<b>ACS PA.IV.F.K3</b> &middot; AFH ch. 9 - Approaches and Landings &middot; C172S POH sec. 4", prio:true, tags:"wind correction crab sideslip crosswind landing demonstrated component short field",
 q:"★ MISSED CODE — Explain wind correction techniques on approach and landing.",
 a:`<div class="warn"><b>Missed knowledge-test code.</b> ACS text: <i>"PA.IV.F.K3 Wind correction techniques on approach and landing"</i> under Task F, Short-Field Approach and Landing. Be ready to explain <b>both</b> methods and to say which one you use and why.</div>
 <p><b>The problem:</b> a crosswind pushes the airplane off the extended centerline (drift), and the airplane must touch down <b>aligned with the runway</b> and <b>without side loading the landing gear</b>.</p>
 <p><b>METHOD 1 — THE CRAB</b></p>
 <ul>
  <li>Turn the airplane's <b>nose into the wind</b> by the wind correction angle so the <b>ground track</b> follows the extended centerline, with wings level and the airplane in coordinated flight.</li>
  <li><b>Advantage:</b> comfortable, coordinated, easy to hold for a long approach.</li>
  <li><b>Disadvantage:</b> the airplane is <b>not aligned with the runway</b>, so you must transition out of the crab <b>before touchdown</b> — a last-second de-crab with rudder. If you're late, you touch down in a crab and <b>side load the gear</b>.</li>
 </ul>
 <p><b>METHOD 2 — THE SIDESLIP (wing-low)</b></p>
 <ul>
  <li><b>Lower the upwind wing</b> with aileron to stop the drift, and simultaneously apply <b>opposite rudder</b> to keep the nose aligned with the runway centerline.</li>
  <li>The airplane is in a <b>slip</b> — cross-controlled and uncoordinated, with the ball out toward the low wing. That is correct and intentional.</li>
  <li><b>Advantage:</b> the airplane is <b>aligned with the runway throughout</b>, so touchdown requires no last-second change — you land on the <b>upwind main wheel first</b>, then the downwind main, then the nosewheel.</li>
  <li><b>Disadvantage:</b> slightly higher drag and less comfortable to hold for a long time.</li>
 </ul>
 <p><b>METHOD 3 — THE COMBINATION (what most pilots actually fly)</b></p>
 <ul><li><b>Crab</b> down final for comfort and tracking, then <b>transition to a sideslip</b> in the last few hundred feet and hold the wing-low through the flare, touchdown, and rollout.</li></ul>
 <div class="memo"><b>The rule through the flare and rollout:</b> as the airplane slows, the controls become less effective — so you must <b>progressively increase aileron into the wind</b>, ending the rollout with <b>full aileron deflection into the wind</b>, while holding the centerline with rudder and the nose off with elevator. Many pilots neutralize the ailerons after touchdown — that's how airplanes get blown off the runway.</div>
 <p><b>Determining the crosswind component:</b> use the crosswind component chart in the POH, or estimate with the clock method — the crosswind component is roughly:</p>
 <ul><li><b>30° off the runway</b> → <b>50%</b> of the wind speed</li>
 <li><b>45° off</b> → <b>70%</b></li>
 <li><b>60° off</b> → <b>87%</b> (call it 90%)</li>
 <li><b>90° off</b> → <b>100%</b></li></ul>
 <div class="warn"><b>Demonstrated crosswind component</b> for the C172S is <b>15 knots</b> (verify your AFM). This is <b>not a limitation</b> — it's the maximum crosswind demonstrated during certification by a test pilot. But it's an excellent <b>personal limit</b>, and exceeding it means you've left the territory anyone has shown the airplane can do.</div>
 <p><b>How this applies to a SHORT-FIELD landing:</b> short field demands you touch down <b>at or within 200 feet beyond a specified point</b> at the <b>minimum controllable airspeed</b> with <b>full flaps</b>, then apply <b>maximum braking</b>. Full flaps makes the airplane more susceptible to the crosswind and reduces rudder authority, so wind correction has to be precise and continuous. If the crosswind is strong, the AFM and good judgment may call for a <b>reduced flap setting</b> and a higher approach speed — which costs you runway. Factor that into the go/no-go.</p>
 <div class="dpe"><b>DPE follow-up:</b> "Which technique do you use and why?" Have an answer: most pilots say "crab on final for comfort, transition to a wing-low sideslip by short final so I'm aligned and drift-free at touchdown." Then explain your <b>abort criteria</b>: "If I can't hold the centerline with the rudder I have available, I'm out of rudder authority — I go around and use a different runway or airport."</div>`},

/* ★ PRIORITY — PA.IV.N.K2 */
{id:"IVNK2", area:"IV", acs:"PA.IV.N.K2", src:"<b>ACS PA.IV.N.K2</b> &middot; AFH ch. 9 - Approaches and Landings &middot; PHAK ch. 11 - Aircraft Performance", prio:true, tags:"go around rejected landing wind density altitude atmospheric conditions balked",
 q:"★ MISSED CODE — How do atmospheric conditions, including wind and density altitude, affect a go-around?",
 a:`<div class="warn"><b>Missed knowledge-test code.</b> ACS text: <i>"PA.IV.N.K2 Effects of atmospheric conditions, including wind and density altitude, on a go-around or rejected landing."</i></div>
 <p><b>The core concept:</b> a go-around is a <b>maximum-performance climb initiated from a low-energy state</b> — low, slow, full flaps, and often close to obstacles. Anything that degrades climb performance makes it more dangerous, and the two biggest degraders are <b>density altitude</b> and <b>wind</b>.</p>
 <p><b>DENSITY ALTITUDE EFFECTS:</b></p>
 <ul>
  <li><b>Less engine power</b> — fewer oxygen molecules for combustion, so "full throttle" produces less than rated horsepower</li>
  <li><b>Less propeller thrust</b> — the prop has less air mass to accelerate</li>
  <li><b>Less lift</b> from the wing at the same indicated airspeed</li>
  <li>Net effect: a <b>significantly reduced rate and angle of climb</b>. Your 700 fpm sea-level climb may become 300 fpm or less</li>
  <li><b>True airspeed is higher</b> for the same indicated airspeed, so your <b>groundspeed is higher</b> and you cover more ground before clearing an obstacle</li>
 </ul>
 <div class="warn"><b>The high-density-altitude trap:</b> you go around at a hot, high field with full flaps and a passenger load, the airplane barely climbs, and the obstacles at the departure end are coming up fast. The mitigation is to <b>decide to go around EARLY</b> — the earlier you commit, the more runway and altitude you have to work with — and to have computed the climb performance <b>before</b> you flew the approach.</div>
 <p><b>WIND EFFECTS:</b></p>
 <ul>
  <li><b>Headwind</b> — <i>helps</i>. Lower groundspeed means a <b>steeper climb angle over the ground</b> and better obstacle clearance, even though the rate of climb in fpm is unchanged.</li>
  <li><b>Tailwind</b> — <i>hurts badly</i>. Higher groundspeed means a <b>shallower climb angle over the ground</b>, so you cover much more distance before clearing the same obstacle. A go-around from a tailwind landing is a genuinely marginal maneuver.</li>
  <li><b>Crosswind</b> — you must hold wind correction <b>throughout</b> the go-around, including the climb-out and the re-entry to the pattern. The airplane will drift if you fixate on pitch and power.</li>
  <li><b>Gusts and wind shear</b> — a sudden loss of headwind during the go-around is a loss of airspeed at the worst possible moment. Don't chase the airspeed; fly the attitude and let it stabilize.</li>
  <li><b>Turbulence and low-level wind shear</b> — may require a higher climb speed and make precise airspeed control harder.</li>
  <li><b>Wake turbulence</b> — if you're going around because of an aircraft on the runway, climb <b>above and upwind</b> of its flight path.</li>
 </ul>
 <p><b>THE GO-AROUND PROCEDURE — in order, and the order matters:</b></p>
 <ol>
  <li><b>POWER</b> — full throttle, mixture rich, carb heat off (N/A in this airplane)</li>
  <li><b>PITCH</b> — arrest the descent, establish a positive climb attitude (V<sub>Y</sub> = 74 KIAS, or V<sub>X</sub> if obstacles)</li>
  <li><b>FLAPS</b> — retract to <b>20°</b> immediately, then <b>incrementally</b> to 10° and up as airspeed and altitude permit. <b>Never dump all the flaps at once</b> — you lose the lift they're providing and the airplane sinks.</li>
  <li><b>Right rudder</b> — you just applied full power at low airspeed and high angle of attack, so all four left-turning tendencies are at maximum. Expect a strong yaw and a pitch-up from the power application, plus a pitch-up as flaps retract. <b>Be ready to push.</b></li>
  <li><b>Climb, clear the obstacle/traffic, sidestep</b> to the side of the runway so you can see the traffic you're overflying, and <b>re-enter the pattern</b></li>
  <li><b>Communicate</b> — tell the tower or announce on CTAF</li>
 </ol>
 <div class="memo"><b>"Power, Pitch, Flaps — then Configure, Climb, Communicate."</b> Power and pitch first stop the descent; flaps come out gradually; everything else follows.</div>
 <div class="dpe"><b>DPE follow-ups:</b> "When do you decide to go around?" Any time the approach isn't stabilized, the runway isn't clear, you're not going to touch down in the touchdown zone, the landing doesn't feel right, or ATC tells you to. <b>A go-around is never a failure</b> — a late go-around is.<br><br>
 "Is there a point where you're committed to land?" Not really in this airplane — but the later you initiate, the less runway and energy you have. The real answer is that the decision should be made <b>early and decisively</b>, and reversing a go-around once initiated (going back to land) is far more dangerous than continuing it.</div>`},

{id:"IV1", area:"IV", acs:"PA.IV.A.K1", src:"AFH ch. 6 - Takeoffs and Departure Climbs &middot; C172S POH sec. 4", tags:"normal takeoff crosswind rotation Vr climb",
 q:"Describe a normal takeoff and climb.",
 a:`<ul>
  <li>Complete the <b>before-takeoff checklist</b> and a <b>departure briefing</b>; verify the final approach is clear and the runway is clear</li>
  <li>Align on the centerline, apply <b>full power smoothly</b>, right rudder to track the centerline</li>
  <li><b>Verify engine instruments</b> — "airspeed alive, engine gauges green, RPM 2,300+"</li>
  <li><b>Rotate at ~55 KIAS</b> to the takeoff attitude; let the airplane fly off</li>
  <li>Accelerate to and climb at <b>V<sub>Y</sub> 74 KIAS</b> (or V<sub>X</sub> 62 if an obstacle exists)</li>
  <li>Maintain the centerline extended, correcting for wind drift</li>
  <li>Complete the <b>climb checklist</b> at a safe altitude</li>
 </ul>
 <p><b>Crosswind takeoff:</b> begin with <b>full aileron into the wind</b>, decreasing it as speed increases and the ailerons become more effective. Hold the centerline with rudder. After liftoff, establish a <b>crab</b> to track the extended centerline.</p>
 <div class="memo"><b>ACS tolerances:</b> maintain V<sub>Y</sub> <b>+10/−5 knots</b>, heading ±10°. Know these — the DPE will quote them.</div>`},

{id:"IV2", area:"IV", acs:"PA.IV.E.K1", src:"AFH ch. 6 &middot; C172S POH sec. 4 &amp; 5", tags:"short field takeoff maximum performance obstacle Vx 50 foot",
 q:"Describe a short-field takeoff and maximum performance climb.",
 a:`<ul>
  <li><b>Flaps 10°</b> (per AFM), use <b>all available runway</b> — taxi to the very beginning and align</li>
  <li><b>Hold the brakes</b>, apply <b>full power</b>, verify engine instruments are green and developing full power, <b>then release the brakes</b></li>
  <li>Rotate at the AFM short-field speed (~<b>51 KIAS</b> for the C172S), and climb at <b>V<sub>X</sub> 62 KIAS</b> until clear of the obstacle</li>
  <li>After clearing the obstacle (50 ft), lower the nose to <b>V<sub>Y</sub> 74</b> and retract flaps</li>
 </ul>
 <p><b>The point</b> is to achieve the <b>steepest climb angle</b> to clear an obstacle in the minimum horizontal distance.</p>
 <div class="dpe"><b>DPE follow-up:</b> "What's your abort point?" Have one: a specific runway marker or intersection by which you must have a specific airspeed (a common rule: <b>70% of liftoff speed by 50% of the runway</b>). If you don't have it, abort. Be ready to state this before you roll.</div>`},

{id:"IV3", area:"IV", acs:"PA.IV.M.K1", src:"AFH ch. 9 - Approaches and Landings &middot; PHAK ch. 5 &middot; C172S POH sec. 4 (slip with flaps)", tags:"forward slip side slip slipping turn flaps",
 q:"What is a forward slip, and how does it differ from a sideslip?",
 a:`<p>Both are <b>uncoordinated, cross-controlled</b> maneuvers (aileron one way, opposite rudder), but they serve different purposes:</p>
 <ul>
  <li><b>FORWARD SLIP</b> — used to <b>lose altitude rapidly without gaining airspeed</b>, typically because you're high on final. The <b>ground track stays the same</b> but the <b>longitudinal axis is at an angle to it</b>. The fuselage is presented broadside to the relative wind, creating a large amount of parasite drag and a steep descent.</li>
  <li><b>SIDESLIP</b> — used for <b>crosswind correction</b>. The <b>longitudinal axis stays aligned with the runway</b> and the <b>ground track changes</b> (or rather, drift is cancelled). Used on final and through touchdown.</li>
 </ul>
 <div class="memo"><b>Simple distinction:</b> forward slip = <b>nose points off, track stays the same</b> (lose altitude). Sideslip = <b>nose stays aligned, drift is cancelled</b> (crosswind).</div>
 <p><b>Entry:</b> lower a wing with aileron, apply <b>opposite rudder</b> to yaw the nose, and <b>lower the nose</b> as needed to maintain airspeed — the airspeed indicator may be <b>unreliable</b> in a slip because of the disturbed airflow over the static port.</p>
 <div class="warn"><b>C172 note:</b> the AFM contains a placard/note that <b>slips with full flaps are to be avoided</b> (or limited to 30 seconds) due to a possible <b>elevator oscillation/tail buffet</b> from disturbed airflow over the horizontal stabilizer. <b>Check your specific AFM</b> and be able to state what it says. It's a known DPE question.</div>`},

/* ---------- AREA V ---------- */
{id:"V1", area:"V", acs:"PA.V.A.K1", src:"AFH FAA-H-8083-3C - Performance Maneuvers &middot; PHAK ch. 5 - Aerodynamics of Flight", tags:"steep turns load factor overbanking tendency 45 degrees",
 q:"Explain the aerodynamics of a steep turn, including overbanking tendency.",
 a:`<p><b>Private pilot steep turn:</b> <b>45° bank</b>, maintain altitude ±100 ft, airspeed ±10 kt, bank ±5°, roll out on the entry heading ±10°.</p>
 <p><b>What happens in the turn:</b> banking tilts the lift vector, so the <b>vertical component of lift decreases</b> while the <b>horizontal component</b> produces the turn. To hold altitude you must <b>increase total lift</b> — back pressure (higher angle of attack) and usually <b>added power</b> to overcome the increased induced drag.</p>
 <ul>
  <li><b>Load factor at 45° bank = 1.41 G</b>; at 60° = <b>2.0 G</b></li>
  <li><b>Stall speed increases</b> by the square root of the load factor — at 45°, about <b>19%</b> higher</li>
  <li>Enter at or below <b>V<sub>A</sub></b></li>
 </ul>
 <p><b>OVERBANKING TENDENCY:</b> in a steep turn, the <b>outside wing travels faster</b> than the inside wing, so it produces <b>more lift</b> — and the bank wants to keep <b>increasing on its own</b>. You must hold <b>opposite (outside) aileron</b> to maintain a constant bank angle. At shallow bank angles the airplane has a natural tendency to roll level instead; at medium banks it's roughly neutral.</p>
 <div class="dpe"><b>DPE follow-up:</b> "What's your recovery if you lose altitude in the turn?" <b>Reduce the bank first</b>, then pitch to recover the altitude. Pulling harder at a steep bank just increases load factor and brings you closer to an accelerated stall.</div>`},

{id:"V2", area:"V", acs:"PA.V.B.K1", src:"AFH ch. 7 - Ground Reference Maneuvers &middot; PHAK ch. 5", tags:"ground reference maneuvers turns around a point S-turns rectangular course wind drift",
 q:"Why do we fly ground reference maneuvers, and how does wind affect them?",
 a:`<p><b>Purpose:</b> to develop the ability to <b>divide attention</b> between the flight path and ground references while maintaining control, and to understand the effect of wind on <b>ground track</b> — the exact skills you use in the traffic pattern and on a forced landing.</p>
 <p><b>Altitude:</b> 600–1,000 ft AGL (ACS says the maneuver is flown between 600 and 1,000 ft AGL). Maintain altitude ±100 ft, airspeed ±10 kt.</p>
 <p><b>The key principle — the airplane must fly a constant radius over the ground, but the wind constantly changes the groundspeed:</b></p>
 <ul>
  <li><b>Downwind = highest groundspeed = steepest bank</b> required</li>
  <li><b>Upwind = lowest groundspeed = shallowest bank</b> required</li>
  <li>Crosswind legs require a <b>crab</b> into the wind</li>
 </ul>
 <div class="memo"><b>"Steepest when fastest."</b> You always enter turns around a point and S-turns <b>downwind</b>, which is where your groundspeed is highest and your bank is steepest.</div>
 <div class="warn"><b>The safety lesson:</b> a low, slow, <b>downwind-to-base turn</b> with a tailwind feels like the airplane is skidding across the ground, tempting the pilot to add bottom rudder to tighten the turn. That's the <b>classic cross-controlled stall-spin</b> accident in the pattern. Fix the overshoot with a <b>go-around</b>, never with rudder.</div>`},

/* ---------- AREA VI ---------- */
{id:"VI1", area:"VI", acs:"PA.VI.A.K1", src:"PHAK ch. 16 - Navigation &middot; <span class='reg'>14 CFR 91.103</span>", tags:"pilotage dead reckoning navigation log checkpoints",
 q:"What's the difference between pilotage and dead reckoning?",
 a:`<ul>
  <li><b>Pilotage</b> — navigation by <b>visual reference to landmarks</b> and charts.</li>
  <li><b>Dead reckoning</b> — navigation by <b>computation</b>: known groundspeed, heading, time, and distance from a known position.</li>
 </ul>
 <p>In practice you combine them: dead reckoning gives you a heading and an ETA to the next checkpoint, and pilotage confirms you're actually there.</p>
 <p><b>Good checkpoints</b> are unique, easily identifiable, and preferably a combination of features: towns with a distinctive shape, highway/railroad intersections, lakes, antenna farms, and airports. Space them <b>5–15 NM</b> apart. In western Kansas, where section lines and small towns look alike, pick <b>combinations</b> of features and back them up with GPS.</p>
 <div class="dpe"><b>DPE follow-up:</b> "What if your groundspeed is different from planned?" Recompute your ETA and fuel at the next checkpoint. Be ready to demonstrate the <b>time/distance/groundspeed</b> calculation on an E6B: <code>GS = distance ÷ time</code>, and <code>fuel required = GPH × time</code>.</div>`},

{id:"VI2", area:"VI", acs:"PA.VI.C.K1", src:"PHAK ch. 16 &middot; <span class='reg'>14 CFR 91.103</span> &middot; <b>ACS PA.VI.C</b>", tags:"diversion nearest airport procedure fuel",
 q:"Walk me through a diversion.",
 a:`<ol>
  <li><b>Decide early</b> — the best diversion is the one made before you're low on fuel or options</li>
  <li><b>Turn toward the new destination immediately</b>, then do the planning. Flying away from where you want to go while you work is wasted fuel and time.</li>
  <li><b>Pick the airport</b> — consider runway length and surface, available fuel and services, weather, terrain, airspace, and distance. Use the G1000 <b>NRST (nearest)</b> page.</li>
  <li><b>Estimate heading, distance, time, and fuel</b> — a rough estimate using the chart and known groundspeed is fine; don't bury your head in the cockpit</li>
  <li><b>Climb if practical</b> — better radio and radar coverage, better glide options, better visibility</li>
  <li><b>Notify ATC</b> if you're on flight following or a flight plan, and amend or close it</li>
  <li><b>Get the weather</b> for the new destination (ATIS/AWOS) and brief the arrival</li>
 </ol>
 <div class="memo"><b>Rule of thumb for time:</b> at 100 kt groundspeed you cover about <b>1.7 NM per minute</b>, so distance in NM × 0.6 ≈ minutes. Know your airplane's number.</div>
 <div class="dpe"><b>Expect this in flight too.</b> The DPE will likely pull a diversion on you during the flight portion. ACS tolerance: arrive within ±5 minutes of your ETE estimate and within the stated navigation tolerances.</div>`},

{id:"VI3", area:"VI", acs:"PA.VI.D.K1", src:"PHAK ch. 16 &middot; <span class='reg'>14 CFR 91.3(b)</span> &middot; AIM ch. 6 - Emergency Procedures", tags:"lost procedures five Cs climb communicate confess comply conserve",
 q:"You're lost. What do you do?",
 a:`<div class="memo"><b>The Five C's</b><br>
 <b>C</b>limb — better visibility, better radio and radar coverage, more glide options<br>
 <b>C</b>ommunicate — ATC, Flight Service (121.5 if needed); ask for help early<br>
 <b>C</b>onfess — tell them you're lost and how much fuel you have. Nobody is going to violate you for asking for help.<br>
 <b>C</b>omply — follow the instructions you're given<br>
 <b>C</b>onserve — reduce power to a conservative setting and lean the mixture to extend endurance</div>
 <p>Before all that: <b>hold your heading and look</b>. Note the time, estimate how far you've gone since your last known position, and try to match major features (highways, rivers, railroads, towns) to the chart. Use the <b>G1000 nearest page</b>, a VOR cross-radial, or ATC's <b>radar vectors</b> ("request vectors to the nearest airport").</p>
 <p>ATC can also give you a <b>DF steer</b> or vector you based on your transponder. Squawk <b>7700</b> if it becomes an emergency — especially if fuel is a factor.</p>
 <div class="warn"><b>The fatal combination:</b> lost + low fuel + deteriorating weather + reluctance to admit it. The ask is free. Make it early.</div>`},

{id:"VI4", area:"VI", acs:"PA.VI.B.K1", src:"<span class='reg'>14 CFR 91.171 (VOR check)</span> &middot; AIM ch. 1 sec. 1 - Navigation Aids &middot; PHAK ch. 16", tags:"VOR GPS navigation systems radar services flight following",
 q:"How does a VOR work, and what are its limitations? What about GPS?",
 a:`<p><b>VOR</b> — VHF Omnidirectional Range, 108.0–117.95 MHz. Transmits a reference phase and a variable phase signal; the receiver compares them to determine the <b>magnetic radial</b> you're on. <b>Independent of aircraft heading</b> — the indication is the same whichever way you point.</p>
 <ul>
  <li><b>Line of sight</b> — range is limited by altitude and terrain</li>
  <li>Service volumes: <b>Terminal</b> (1,000–12,000 ft, 25 NM), <b>Low</b> (1,000–18,000 ft, 40 NM), <b>High</b> (varies up to 130 NM)</li>
  <li><b>Accuracy</b> ±1°; <b>full-scale CDI deflection</b> is 10° (each dot is 2°)</li>
  <li><b>Cone of confusion</b> directly overhead; <b>reverse sensing</b> if you set the wrong course</li>
  <li><b>Checks:</b> VOT ±4°, ground checkpoint ±4°, airborne checkpoint ±6°, dual VOR cross-check ±4° of each other. Required every <b>30 days for IFR</b> only.</li>
 </ul>
 <p><b>GPS</b> — a constellation of satellites; the receiver needs <b>at least 4</b> for a 3D position fix (3 for 2D). <b>RAIM</b> (Receiver Autonomous Integrity Monitoring) requires a 5th satellite to detect a fault and a 6th to exclude it. Check the <b>database currency</b> (28-day cycle) and NOTAMs for GPS interference/testing — common near military ranges.</p>
 <div class="warn"><b>GPS is not a substitute for knowing where you are.</b> Be ready to show the DPE you can navigate with a sectional, a watch, and a compass if the G1000 goes dark — because that's exactly what they'll ask you to do.</div>
 <p><b>Radar services for VFR:</b> <b>Flight following</b> (VFR traffic advisories) is provided on a <b>workload-permitting</b> basis, does <b>not</b> relieve you of see-and-avoid responsibility, and can be terminated by ATC at any time. <b>Safety alerts</b> (terrain/obstruction and aircraft conflict) are mandatory for controllers to issue when they become aware of a hazard.</p>`}
);
