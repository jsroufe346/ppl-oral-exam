{id:"VII1", area:"VII", acs:"PA.VII.A.K1", src:"PHAK ch. 5 - Aerodynamics of Flight &middot; AFH ch. 5 - Maintaining Aircraft Control (UPRT) &middot; AC 61-67C &middot; C172S POH sec. 1", tags:"stall angle of attack critical aoa definition why airplane stalls",
 q:"What is a stall, and at what airspeed does it occur?",
 a:`<p>A <b>stall</b> occurs when the wing exceeds its <b>critical angle of attack</b> — the airflow separates from the upper surface, lift decreases sharply, and drag increases.</p>
 <div class="warn"><b>The answer the DPE wants:</b> a wing always stalls at the <b>same critical angle of attack</b>, but it can stall at <b>ANY airspeed, ANY attitude, and ANY power setting</b>. Airspeed is just the number the wing happens to stall at in one specific condition — 1 G, unaccelerated, at a given weight and configuration.</div>
 <p>Factors that <b>raise</b> the indicated stall speed: increased <b>weight</b>, increased <b>load factor</b> (bank or abrupt pull), <b>forward CG</b>, <b>frost/ice/contamination</b>, and a <b>clean (no flap)</b> configuration.</p>
 <p><b>Angle of attack</b> = the angle between the <b>chord line</b> and the <b>relative wind</b>. (Not the angle to the horizon — that's pitch attitude.)</p>
 <p><b>Recognition:</b> stall warning horn, buffet, mushy/ineffective controls, high pitch attitude or unusual attitude, decreasing airspeed, high sink rate.</p>
 <p><b>Recovery — the FAA standard sequence:</b></p>
 <ol><li><b>Reduce the angle of attack</b> — pitch down. This is the only thing that actually ends a stall.</li>
 <li><b>Level the wings</b> / roll to wings level with coordinated controls</li>
 <li><b>Add power</b> as needed</li>
 <li><b>Return to the desired flight path</b>, retract flaps incrementally</li></ol>
 <div class="memo"><b>The ACS emphasis is on recovering at the FIRST indication</b> of an impending stall in some tasks and a <b>full stall</b> in others — know which task calls for which, and know that <b>minimum loss of altitude</b> is a judgment, not an excuse to pull.</div>`},

/* ★ PRIORITY — PA.VII.C.K3 */
{id:"VIICK3", area:"VII", acs:"PA.VII.C.K3", src:"<b>ACS PA.VII.C.K3</b> &middot; AFH ch. 5 - Maintaining Aircraft Control (UPRT) &middot; AC 61-67C Stall and Spin Awareness Training", prio:true, tags:"power on stall departure stall factors situations prevention go around takeoff climb",
 q:"★ MISSED CODE — What factors and situations lead to a power-on stall, and how do you prevent it?",
 a:`<div class="warn"><b>Missed knowledge-test code.</b> ACS text: <i>"PA.VII.C.K3 Factors and situations that can lead to a power-on stall and actions that can be taken to prevent it."</i> Note the question is about <b>real-world scenarios and prevention</b>, not just the maneuver.</div>
 <p>A power-on stall is also called a <b>departure stall</b>, because the real-world situation it simulates is a stall during <b>takeoff, initial climb, or go-around</b> — high power, low airspeed, nose high, close to the ground.</p>
 <p><b>FACTORS AND SITUATIONS THAT LEAD TO ONE:</b></p>
 <ul>
  <li><b>Excessive pitch attitude after takeoff</b> — over-rotating, or pitching up to "stretch" a climb over an obstacle instead of flying V<sub>X</sub></li>
  <li><b>Failure to maintain V<sub>Y</sub>/V<sub>X</sub></b> — distraction during climb-out lets the airspeed decay while the nose stays up</li>
  <li><b>Go-around with full flaps</b> — full power produces a strong <b>nose-up pitching moment</b>, and retracting flaps too quickly or all at once causes a sudden lift loss and a sink the pilot answers with back pressure</li>
  <li><b>Heavy weight, aft CG, or high density altitude</b> — degraded climb performance means the airplane won't climb at the attitude the pilot expects, so the pilot pulls harder</li>
  <li><b>Takeoff from a soft or short field</b>, climbing out of ground effect prematurely — induced drag returns and the airplane settles</li>
  <li><b>Wind shear or loss of headwind</b> during climb-out — a sudden airspeed loss at high power and high AOA</li>
  <li><b>Distraction</b> — traffic, a radio call, a passenger, or a door popping open during the climb</li>
  <li><b>Uncoordinated flight</b> — failure to apply right rudder at high power and low airspeed lets the airplane yaw and slip, which can turn a stall into an <b>incipient spin</b></li>
  <li><b>Engine failure during initial climb</b> followed by an attempt to <b>turn back to the field</b> ("the impossible turn") — the stall/spin killer</li>
 </ul>
 <div class="memo"><b>Why power-on stalls are so dangerous in real life:</b> they happen <b>low to the ground</b>, at <b>high power with maximum left-turning tendency</b>, and often <b>in a turn</b> — so they are much more likely to break into a <b>spin</b>, and there is little or no altitude in which to recover.</div>
 <p><b>ACTIONS TO PREVENT IT:</b></p>
 <ul>
  <li><b>Fly a known pitch attitude and a known airspeed.</b> Set V<sub>Y</sub> (74) or V<sub>X</sub> (62) and hold it — don't chase altitude with pitch</li>
  <li><b>Maintain coordinated flight with right rudder</b> throughout the climb — keep the ball centered</li>
  <li><b>Retract flaps incrementally</b> during a go-around, never all at once</li>
  <li><b>Compute takeoff and climb performance</b> for the actual weight and density altitude <i>before</i> you go — so you know what climb rate to expect and won't try to pull more out of the airplane than it has</li>
  <li><b>Respect the stall warning horn</b> — it is an impending-stall warning, not a target. React immediately by reducing the angle of attack</li>
  <li><b>Brief engine failure on takeoff before every departure</b> — and commit to landing <b>straight ahead</b> below your decision altitude rather than attempting a turn back</li>
  <li><b>Manage distractions</b> — sterile cockpit during takeoff and climb, and never troubleshoot below a safe altitude</li>
  <li><b>Avoid steep turns at low altitude</b>, especially in the pattern. If you overshoot the base-to-final turn, <b>go around</b> — don't tighten the turn with rudder</li>
 </ul>
 <p><b>The maneuver itself</b> (what you'll fly): from a takeoff or departure configuration, reduce to lift-off speed, then apply <b>takeoff or specified power</b> while pitching up to an attitude that will induce a stall. Maintain <b>coordinated flight with right rudder</b>, recognize the stall, and recover at the first indication or at the full stall as directed — <b>reduce angle of attack first</b>, level the wings, add full power, and return to a climb. ACS: perform in a <b>wings-level or 20° bank</b> (±10°) configuration as directed, with a <b>planned entry altitude allowing recovery no lower than 1,500 ft AGL</b>.</p>
 <div class="dpe"><b>DPE follow-up:</b> "Why do you need so much right rudder in this maneuver?" All four left-turning tendencies are at their maximum — high power, low airspeed, high angle of attack. If you don't hold the ball centered, the stall will break asymmetrically and drop a wing, which is how a stall becomes a spin.</div>`},

/* ★ PRIORITY — PA.VII.D.K1 */
{id:"VIIDK1", area:"VII", acs:"PA.VII.D.K1", src:"<b>ACS PA.VII.D.K1</b> &middot; AFH ch. 5 - Maintaining Aircraft Control (UPRT) &middot; AC 61-67C &middot; PHAK ch. 5 &middot; C172S POH sec. 3 (spin recovery)", prio:true, tags:"spin aerodynamics autorotation angle of attack load factor CG yaw PARE recovery incipient",
 q:"★ MISSED CODE — Explain the aerodynamics of a spin, including the effect of AOA, airspeed, load factor, power, weight, CG, attitude, and yaw.",
 a:`<div class="warn"><b>Missed knowledge-test code.</b> ACS text: <i>"PA.VII.D.K1 Aerodynamics associated with spins in various airplane configurations, including the relationship between angle of attack, airspeed, load factor, power setting, airplane weight and center of gravity, airplane attitude, and yaw effects."</i> That's a long list — the DPE will likely walk you through each one.</div>
 <p><b>A spin is an aggravated stall that results in autorotation</b> — the airplane descends in a corkscrew path while rotating about its vertical axis.</p>
 <p><b>TWO REQUIREMENTS, BOTH NECESSARY:</b></p>
 <ol><li><b>The wing must be STALLED</b> (exceeding the critical angle of attack)</li>
 <li><b>YAW must be present</b> (uncoordinated flight)</li></ol>
 <div class="memo"><b>The one-sentence answer: STALL + YAW = SPIN.</b> Remove either one and you cannot spin. That's also why coordinated flight is the primary spin prevention.</div>
 <p><b>AUTOROTATION — why it keeps spinning:</b> when the airplane yaws at the stall, the <b>down-going (inside) wing</b> has a <b>higher angle of attack</b> — it is <b>more deeply stalled</b>, producing <b>less lift and more drag</b>. The <b>up-going (outside) wing</b> has a <b>lower angle of attack</b> — it is <b>less stalled</b>, producing <b>more lift and less drag</b>. The lift differential rolls the airplane and the drag differential yaws it, and both forces <b>sustain the rotation</b>. Both wings are stalled; they're just stalled by different amounts.</p>
 <p><b>Now the specific relationships the ACS lists:</b></p>
 <ul>
  <li><b>Angle of attack</b> — both wings are beyond the critical AOA, with the inside wing at a <b>higher</b> AOA. Reducing AOA is what ultimately ends the spin.</li>
  <li><b>Airspeed</b> — in a developed spin the airspeed is <b>low and roughly constant</b>, near or below stall speed. The airspeed indicator is <b>not</b> a useful recovery cue; the altimeter and VSI will show a very high rate of descent. <b>Do not</b> be fooled into thinking low airspeed means you should pull.</li>
  <li><b>Load factor</b> — in a stabilized <b>upright</b> spin, load factor is <b>low</b> (around 1 G or less), which surprises people. The danger is not the G load — it's the <b>altitude loss and the ground</b>. (A <b>spiral dive</b>, by contrast, has <b>increasing airspeed and increasing load factor</b> — that's the key distinction below.)</li>
  <li><b>Power setting</b> — power <b>aggravates</b> the spin. It flattens the spin attitude, increases the rotation rate, and can delay or prevent recovery (the slipstream over the tail plus gyroscopic effects). <b>Power to idle</b> is the first recovery step.</li>
  <li><b>Weight and CG</b> — an <b>aft CG</b> is the critical one. It makes the airplane <b>less longitudinally stable</b>, makes it easier to exceed the critical AOA, produces a <b>flatter spin</b> with a higher rotation rate, and reduces elevator authority to lower the nose. A sufficiently <b>aft CG can make a spin unrecoverable.</b> Higher weight generally increases the rotation rate and the altitude lost per turn.</li>
  <li><b>Airplane attitude</b> — nose-down, often steeply, in an upright spin, with the rotation about the vertical axis. A <b>flat spin</b> (more horizontal attitude) is far more dangerous and often unrecoverable.</li>
  <li><b>Yaw effects</b> — yaw is the ingredient that converts a stall into a spin, and continued yaw is what sustains autorotation. That's why <b>opposite rudder is the primary recovery control</b>.</li>
 </ul>
 <p><b>THE FOUR PHASES:</b></p>
 <ol><li><b>Entry</b> — the pilot (deliberately or not) stalls the airplane with yaw present</li>
 <li><b>Incipient</b> — from the stall until the spin is fully developed; roughly the <b>first 2 turns / 4–6 seconds</b>. <b>Most recoverable phase</b> — and the one you'll actually encounter in a real loss of control</li>
 <li><b>Developed</b> — angular rotation, airspeed, and vertical speed stabilize</li>
 <li><b>Recovery</b> — the wing is unstalled and rotation stops</li></ol>
 <p><b>RECOVERY — "PARE":</b></p>
 <div class="memo"><b>P</b>ower — <b>IDLE</b><br>
 <b>A</b>ilerons — <b>NEUTRAL</b> (aileron into the spin or out of it can aggravate it)<br>
 <b>R</b>udder — <b>FULL OPPOSITE</b> the direction of rotation (this stops the yaw)<br>
 <b>E</b>levator — <b>BRISKLY FORWARD</b> through neutral to break the stall<br>
 Once rotation stops, <b>neutralize the rudder</b> and recover from the resulting <b>dive</b> with smooth back pressure — don't overstress the airplane pulling out.</div>
 <div class="warn"><b>Always use the AFM recovery procedure for your specific airplane</b> — PARE is the generic FAA technique, and the C172 AFM procedure is substantially this, but you should be able to quote <i>your</i> AFM.</div>
 <p><b>Determining the direction of rotation:</b> use the <b>turn coordinator / turn rate indicator</b> — it shows rotation direction reliably. The <b>ball is unreliable</b> in a spin.</p>
 <div class="dpe"><b>Near-certain DPE follow-up: "What's the difference between a spin and a spiral dive?"</b><br>
 <b>Spin:</b> the wing is <b>stalled</b>, airspeed is <b>low and constant</b>, load factor is <b>low</b>, rotation rate is constant. Recovery = PARE.<br>
 <b>Spiral dive:</b> the wing is <b>NOT stalled</b>, airspeed is <b>rapidly increasing</b>, load factor is <b>rapidly increasing</b>, and you risk <b>exceeding V<sub>NE</sub> and overstressing the airframe</b>. Recovery = <b>reduce power, roll wings level, then gently pull out</b>. <b>Pulling in a spiral dive will break the airplane; pulling in a spin will flatten it.</b> Diagnosing which one you're in is the whole point of the question.</div>
 <div class="tail"><b>Also know:</b> private pilot applicants are <b>not required to demonstrate spins</b> — this is a <b>knowledge-only</b> task (spin <i>awareness</i>). The C172 is approved for intentional spins only in the <b>Utility category</b> (2,200 lb, restricted aft CG) with <b>flaps up</b> — <b>verify your AFM</b>. Spins are prohibited in the Normal category.</div>`},

{id:"VII2", area:"VII", acs:"PA.VII.B.K1", src:"AFH ch. 5 &middot; AC 61-67C &middot; AFH ch. 9", tags:"power off stall approach to landing stall base to final",
 q:"What real-world situation does a power-off stall simulate?",
 a:`<p>A power-off stall (an <b>approach-to-landing stall</b>) simulates stalling in the <b>landing configuration</b> — on final or on the base-to-final turn, with flaps extended and power at or near idle.</p>
 <p><b>Real-world causes:</b> allowing the airspeed to decay on final; trying to <b>stretch a glide</b> to the runway when low; an <b>overshooting base-to-final turn</b> corrected with excessive bank and bottom rudder; a distraction on short final; or a tailwind on base creating the illusion of excessive speed.</p>
 <div class="warn"><b>The cross-controlled (skidding) stall</b> is the deadliest version. Overshooting final, the pilot doesn't want to steepen the bank, so they add <b>bottom (inside) rudder</b> to pull the nose around. The airplane skids, the inside wing slows and stalls first, and the airplane <b>snaps into a spin from 600 feet</b> — with no altitude to recover. <b>Fix an overshoot with a go-around.</b></div>
 <p><b>Prevention:</b> fly a stabilized approach at a known airspeed, keep the ball centered, don't stretch a glide (lower the nose and accept landing short of your intended point, or go around), and plan the pattern so the base-to-final turn isn't rushed.</p>`},

/* ★ PRIORITY — PA.VIII.D.K1d */
{id:"VIIIDK1d", area:"VIII", acs:"PA.VIII.D.K1d", src:"<b>ACS PA.VIII.D.K1d</b> &middot; IFH FAA-H-8083-15B - Airplane Attitude Instrument Flying &middot; PHAK ch. 8 - Flight Instruments", prio:true, tags:"instrument cross check scan fixation omission emphasis radial hub G1000",
 q:"★ MISSED CODE — Explain proper instrument cross-check techniques.",
 a:`<div class="warn"><b>Missed knowledge-test code.</b> ACS text: <i>"PA.VIII.D.K1 Flight instruments as they relate to: d. Proper instrument cross-check techniques"</i> under Task D, Turns to Headings.</div>
 <p><b>Attitude instrument flying has three skills:</b></p>
 <ol><li><b>Instrument cross-check (scan)</b> — continuously and logically sampling the instruments</li>
 <li><b>Instrument interpretation</b> — understanding what each indication means for the airplane's attitude and performance</li>
 <li><b>Aircraft control</b> — making smooth, small, <b>pitch-bank-power-trim</b> adjustments</li></ol>
 <p><b>The instruments group into three categories:</b></p>
 <ul>
  <li><b>CONTROL instruments</b> — show immediate attitude and power changes: the <b>attitude indicator</b> and the <b>power indication</b> (tachometer/manifold pressure)</li>
  <li><b>PERFORMANCE instruments</b> — show the <i>result</i> of the control inputs: <b>altimeter, airspeed indicator, vertical speed indicator, heading indicator, turn rate indicator</b></li>
  <li><b>NAVIGATION instruments</b> — show position relative to a facility or course: <b>CDI/HSI, GPS, bearing pointers</b></li>
 </ul>
 <p><b>THE PRIMARY SCAN METHODS:</b></p>
 <ul>
  <li><b>Selected radial cross-check ("hub-and-spoke")</b> — the most commonly taught. The <b>attitude indicator is the hub</b>. You spend about <b>80–90% of the time on the attitude indicator</b>, moving out to one performance instrument and <b>back to the attitude indicator</b> each time: AI → altimeter → AI → heading → AI → airspeed → AI. You never go directly from one performance instrument to another.</li>
  <li><b>Inverted-V cross-check</b> — scan from the attitude indicator down to the turn coordinator, back up, then down to the VSI and back up. Useful for coordination.</li>
  <li><b>Rectangular cross-check</b> — scan the instruments in a rectangular pattern around the panel, giving equal weight to each.</li>
  <li><b>Learning the "primary and supporting" concept</b> — in straight-and-level, the <b>altimeter is primary for pitch</b>, the <b>heading indicator is primary for bank</b>, and the <b>airspeed indicator is primary for power</b>. In a constant-airspeed climb, the <b>airspeed indicator becomes primary for pitch</b>. Knowing which instrument is primary tells you where to look.</li>
 </ul>
 <p><b>THE THREE COMMON SCAN ERRORS — know these by name:</b></p>
 <ul>
  <li><b>FIXATION</b> — staring at one instrument, usually while trying to make a precise correction. You nail the altitude and roll into a 30° bank without noticing. <i>Cure: keep the scan moving; make the correction and move on.</i></li>
  <li><b>OMISSION</b> — leaving an instrument out of the scan entirely. Common during a turn when the pilot drops the altimeter, or after a configuration change. <i>Cure: a deliberate, disciplined scan pattern that includes every instrument.</i></li>
  <li><b>EMPHASIS</b> — placing too much reliance on one instrument instead of cross-checking it against the others. A pilot who flies the attitude indicator alone won't notice it has failed. <i>Cure: always confirm one instrument's story against the others — if the AI says level but the altimeter is unwinding and the heading is changing, believe the group, not the one.</i></li>
 </ul>
 <div class="memo"><b>Memory aid for the errors:</b> "<b>F-O-E</b>" — <b>F</b>ixation, <b>O</b>mission, <b>E</b>mphasis. They're the enemy of a good scan.</div>
 <p><b>Applied to TURNS TO HEADINGS specifically:</b></p>
 <ul>
  <li>Use a <b>standard rate turn</b> (3° per second) — the turn rate indicator/turn coordinator shows it. A standard rate turn takes <b>2 minutes for 360°</b>, or 1 minute for 180°.</li>
  <li><b>Bank angle for a standard rate turn ≈ (TAS ÷ 10) + 7</b>. At 100 knots, that's about <b>17°</b>. Never exceed about 30° of bank on instruments.</li>
  <li><b>Lead the rollout</b> by approximately <b>half the bank angle</b> in degrees (e.g., roll out about 8–9° before the target heading from a 17° bank).</li>
  <li>Expect to <b>add slight back pressure</b> to hold altitude as the vertical lift component decreases, and remove it on rollout.</li>
  <li>ACS tolerances: altitude <b>±200 ft</b>, heading <b>±10°</b>, airspeed <b>±10 kt</b>.</li>
 </ul>
 <div class="dpe"><b>G1000-specific follow-up to expect:</b> "How does your scan change with a glass panel?" The PFD puts airspeed, altitude, VSI, and heading on <b>tapes immediately around the attitude display</b>, so the scan is <b>physically tighter</b> and you can take in more with peripheral vision. The risks change too: <b>more information means more opportunity for fixation</b> (especially on the moving map or the flight director), and <b>a failed AHRS puts a big red X where your attitude used to be</b>. Know that you must <b>transition to the standby instruments</b> and that the standby attitude indicator, standby airspeed, standby altimeter, and magnetic compass are scattered around the panel — practice that scan, because it's nothing like the PFD.</div>`},

{id:"VIII1", area:"VIII", acs:"PA.VIII.E.K1", src:"IFH FAA-H-8083-15B &middot; AFH ch. 5 - Maintaining Aircraft Control (UPRT) &middot; PHAK ch. 8", tags:"unusual attitude recovery nose high nose low",
 q:"How do you recover from an unusual attitude on instruments?",
 a:`<p><b>First, determine whether it's nose-high or nose-low</b> using the attitude indicator and confirming with the airspeed indicator, altimeter, and VSI.</p>
 <p><b>NOSE-HIGH</b> (airspeed <b>decreasing</b>, altitude increasing, VSI up) — the risk is a <b>stall</b>:</p>
 <ol><li><b>Power — FULL</b></li>
 <li><b>Pitch — lower the nose</b> toward level</li>
 <li><b>Bank — level the wings</b></li></ol>
 <div class="memo"><b>Nose-high: "Power, Push, Roll."</b></div>
 <p><b>NOSE-LOW</b> (airspeed <b>increasing</b>, altitude decreasing, VSI down) — the risk is <b>overspeed and overstress</b>:</p>
 <ol><li><b>Power — REDUCE</b> (idle)</li>
 <li><b>Bank — LEVEL THE WINGS FIRST</b></li>
 <li><b>Pitch — smoothly raise the nose</b> to level</li></ol>
 <div class="memo"><b>Nose-low: "Pull power, Roll, then Pull."</b> <b>Roll before you pull</b> — pulling while banked just tightens a spiral and multiplies the load factor.</div>
 <p>Recover <b>smoothly and promptly</b> without exceeding limits, then return to the assigned altitude and heading. ACS: apply the correct recovery and avoid exceeding the airplane's limitations.</p>`},

/* ---------- AREA IX ---------- */
{id:"IX1", area:"IX", acs:"PA.IX.B.K1", src:"AFH ch. 18 - Emergency Procedures &middot; C172S POH sec. 3 &middot; <span class='reg'>14 CFR 91.3(b)</span>", tags:"engine failure emergency landing ABCDE best glide checklist forced landing",
 q:"The engine quits at 4,000 feet. Walk me through it.",
 a:`<div class="memo"><b>A-B-C-D-E</b><br>
 <b>A</b>irspeed — pitch for <b>best glide, 68 KIAS</b> immediately<br>
 <b>B</b>est field — pick one, and keep it in sight<br>
 <b>C</b>hecklist — flow then checklist (fuel selector BOTH, mixture rich, aux fuel pump ON, magnetos BOTH/try each, alternate air)<br>
 <b>D</b>eclare — <b>7700</b>, <b>121.5</b>, "Mayday, Mayday, Mayday"<br>
 <b>E</b>xecute / <b>E</b>gress — secure the engine (mixture idle cutoff, fuel OFF, mags OFF, master OFF just before touchdown), unlatch the doors, brief and secure passengers, land</div>
 <p><b>Field selection — WWW SOS:</b> <b>W</b>ind, <b>W</b>ires, <b>W</b>idth/length, <b>S</b>lope, <b>O</b>bstructions, <b>S</b>urface. Prefer an airport, then a road (watch for wires and traffic), then a field. Land <b>into the wind</b> if you have the choice, and plan a <b>key position</b> abeam your touchdown point so you can fly a modified pattern and adjust with flaps and a slip.</p>
 <p><b>Best glide — 68 KIAS at max gross</b> gives roughly a <b>9:1 glide ratio</b> (about 1.5 NM per 1,000 ft). <i>Verify your AFM.</i> Glide <b>distance</b> decreases with a headwind and increases with a tailwind; best glide <b>speed decreases</b> as weight decreases.</p>
 <div class="warn"><b>Fly the airplane first.</b> The single biggest error is spending too long troubleshooting and not enough time flying to a survivable landing site. Altitude is time — use it to set up a good approach, not to fiddle with switches. And <b>never stretch the glide</b>: a stall at 200 feet is unsurvivable; a controlled arrival into trees at the slowest possible speed usually is.</div>`},

{id:"IX2", area:"IX", acs:"PA.IX.A.K1", src:"AFH ch. 18 &middot; C172S POH sec. 3", tags:"emergency descent rapid descent fire smoke",
 q:"When would you perform an emergency descent, and how?",
 a:`<p><b>Situations:</b> an <b>in-flight fire</b>, smoke in the cockpit, a loss of pressurization (N/A here), or a medical emergency requiring you to get down and land immediately.</p>
 <p><b>The goal:</b> descend as rapidly as possible <b>within the airplane's limitations</b> — maximum rate of descent without exceeding V<sub>NO</sub>/V<sub>NE</sub> or structural limits.</p>
 <p><b>Procedure (per AFM):</b> power to idle, establish a bank (typically 30–45°) to keep the nose from pitching up and to aid in clearing, extend flaps if within V<sub>FE</sub>, and descend at the specified airspeed. Maintain <b>positive load factors</b> and <b>clear the area</b> continuously. Level off at a safe altitude.</p>
 <div class="dpe"><b>DPE follow-up:</b> "Why the bank?" It keeps the descent from building excessive airspeed as quickly, it helps you <b>see below and ahead</b> for traffic and terrain, and it increases the descent rate for a given airspeed. ACS tolerance: maintain the airspeed <b>+0/−10 kt</b>.</div>`},

{id:"IX3", area:"IX", acs:"PA.IX.C.K1", src:"AFH ch. 18 &middot; C172S POH sec. 3 &middot; PHAK ch. 7", tags:"systems malfunctions electrical fire engine fire door open flaps",
 q:"Name some system malfunctions and how you'd handle them.",
 a:`<ul>
  <li><b>Engine fire in flight</b> — <b>mixture IDLE CUTOFF, fuel selector OFF, master OFF, cabin heat/air OFF (to avoid drawing smoke in)</b>, and establish a <b>forced landing</b>. Increasing airspeed may help extinguish it. <i>Verify your AFM.</i></li>
  <li><b>Electrical fire / smoke in the cabin</b> — <b>master OFF</b>, all electrical switches OFF, fire extinguisher, <b>ventilate</b>, then bring essential items back on one at a time only if needed, and <b>land as soon as possible</b>.</li>
  <li><b>Alternator failure</b> — reduce load, attempt reset, land as soon as practical on battery power.</li>
  <li><b>Rough running engine</b> — check mixture, fuel selector, aux fuel pump, mags individually (a rough mag suggests fouled plugs — try leaning to burn them clean), alternate air. Land at the nearest suitable airport.</li>
  <li><b>Door opens in flight</b> — it is <b>noisy and startling but not an emergency</b>. <b>Fly the airplane</b>, climb away from terrain, and either land and secure it or follow the AFM procedure (slow down, slip, and close). The accident is caused by the <b>distraction</b>, not the door.</li>
  <li><b>Flap asymmetry / failure</b> — be ready for a <b>no-flap landing</b>: higher approach speed, flatter approach, longer landing roll, less forward visibility over the nose. Plan for a longer runway.</li>
  <li><b>Static/pitot blockage</b> — alternate static source; fly known <b>pitch and power</b> settings.</li>
  <li><b>Brake failure</b> — differential braking if one side works; use the longest runway, land into the wind, minimum speed, shut down the engine and use terrain to slow if necessary.</li>
 </ul>
 <div class="memo"><b>Universal order:</b> <b>AVIATE → NAVIGATE → COMMUNICATE.</b> Fly the airplane, go somewhere survivable, then tell someone. In that order, every time.</div>`},

{id:"IX4", area:"IX", acs:"PA.IX.D.K1", src:"<span class='reg'>14 CFR 91.207</span> &middot; AIM 6-2-4 Emergency Locator Transmitter (ELT) &middot; AFH ch. 18", tags:"emergency equipment survival gear ELT fire extinguisher",
 q:"What emergency and survival equipment should be on board, and how does an ELT work?",
 a:`<p><b>Equipment to know and locate before you fly:</b> fire extinguisher (type and how to use it), first aid kit, flashlight, survival kit appropriate to the terrain and season, water, signaling devices, and a charged phone/handheld radio.</p>
 <p><b>ELT</b> <span class="reg">91.207</span> — required for most U.S. aircraft. Activates automatically on a longitudinal impact of roughly <b>5 G</b>, or can be activated manually.</p>
 <ul>
  <li><b>406 MHz</b> ELTs transmit a <b>digital signal with a unique identifier</b> to the <b>COSPAS-SARSAT satellite</b> system, giving fast, accurate position (often with GPS encoding). <b>121.5 MHz is no longer monitored by satellite</b> — but 121.5 is still transmitted for local homing.</li>
  <li><b>Register your 406 ELT</b> with NOAA — the registration is what connects the signal to you and your emergency contacts.</li>
  <li><b>Battery</b> replaced after <b>1 cumulative hour</b> of use or when <b>50% of useful life</b> expires</li>
  <li><b>Testing</b> is permitted during the <b>first 5 minutes of each hour</b>, for no more than <b>three audio sweeps</b>, and should be coordinated with the tower</li>
  <li><b>After a hard landing</b>, monitor 121.5 to make sure it hasn't activated inadvertently</li>
 </ul>
 <p><b>Survival priorities</b> if you go down: <b>protection (shelter/fire), location (signaling), water, food</b> — in that order. Stay with the aircraft; it's far easier to spot than a person.</p>`},

/* ---------- AREA XI ---------- */
{id:"XI1", area:"XI", acs:"PA.XI.A.K1", src:"<span class='reg'>14 CFR 61.57(b)</span> <span class='reg'>91.209</span> <span class='reg'>1.1 (night)</span> <span class='reg'>91.205(c)</span> &middot; AFH FAA-H-8083-3C - Night Operations &middot; AIM 8-1-6 Vision in Flight &middot; PHAK ch. 17", tags:"night operations preparation equipment lighting physiology currency",
 q:"What's different about night flying?",
 a:`<p><b>Regulations:</b></p>
 <ul>
  <li><b>Position lights</b> required from <b>sunset to sunrise</b> <span class="reg">91.209</span>; also required for any aircraft parked or moved in a night-operating area</li>
  <li><b>Night currency</b> (3 full-stop takeoffs and landings in 90 days) applies from <b>1 hour after sunset to 1 hour before sunrise</b> <span class="reg">61.57(b)</span></li>
  <li><b>Logging night flight</b> is from the <b>end of evening civil twilight to the beginning of morning civil twilight</b> <span class="reg">1.1</span></li>
  <li><b>Fuel reserve</b> increases to <b>45 minutes</b> <span class="reg">91.151</span></li>
  <li><b>Anticollision lights</b> required day and night; may be turned off if the PIC determines it's in the interest of safety</li>
 </ul>
 <p><b>Physiology:</b> use <b>off-center viewing</b> (rods are concentrated off-center and are what see at night); allow <b>30 minutes</b> for dark adaptation; avoid bright white light; <b>night vision degrades above about 5,000 ft</b> from mild hypoxia — consider supplemental oxygen.</p>
 <p><b>Illusions to expect:</b> the <b>black hole approach</b> (featureless terrain making you fly too low), <b>autokinesis</b>, <b>false horizons</b>, and the <b>somatogravic illusion</b> on takeoff (acceleration feeling like a pitch-up).</p>
 <p><b>Equipment and preparation:</b> two flashlights (one with a red lens) plus spare batteries, current charts, a thorough preflight <i>before</i> dark if possible, verified <b>interior and exterior lighting</b>, and a <b>higher cruising altitude</b> for better glide options and radio coverage.</p>
 <div class="warn"><b>Collision avoidance at night:</b> position lights tell you the other aircraft's direction — <b>red is the left wing, green is the right wing, white is the tail</b>. If you see <b>red on your left and green on your right</b>, the aircraft is coming <b>head-on</b> — both turn right. If you see only a <b>white light</b>, you're overtaking it.</div>
 <div class="dpe"><b>DPE follow-up:</b> "What's your plan for an engine failure at night?" Pitch for best glide, turn toward any lit area or known airport, use the landing light <b>on short final</b> — and know the standard, honest advice: if you don't like what the landing light shows you, <b>turn it off</b>. Plan higher cruise altitudes and routes near airports to give yourself options.</div>`},

/* ---------- AREA XII ---------- */
/* ★ PRIORITY — PA.XII.A.K1 */
{id:"XIIAK1", area:"XII", acs:"PA.XII.A.K1", src:"<b>ACS PA.XII.A.K1</b> &middot; C172S POH sec. 4 - Securing Airplane &middot; AFH ch. 2 - Ground Operations", prio:true, tags:"shutdown securing postflight inspection parking tie down chocks control lock",
 q:"★ MISSED CODE — Describe airplane shutdown, securing, and postflight inspection.",
 a:`<div class="warn"><b>Missed knowledge-test code.</b> ACS text: <i>"PA.XII.A.K1 Airplane shutdown, securing, and postflight inspection."</i> People underestimate this one because it seems trivial — don't. It's an easy code to be thorough on, and the DPE has to cover it.</div>
 <p><b>AFTER LANDING:</b></p>
 <ul>
  <li><b>Clear the runway completely</b> — past the hold short line — before stopping or doing anything else</li>
  <li>Complete the <b>after-landing flow/checklist</b> only after you're clear: flaps up, landing/strobe lights as appropriate, transponder to standby/ground as required</li>
  <li><b>Do not</b> run checklists while the airplane is moving on an unfamiliar surface — stop first</li>
  <li>Taxi at a safe speed with proper <b>wind control inputs</b> and a parking spot in mind</li>
 </ul>
 <p><b>SHUTDOWN SEQUENCE</b> (follow your AFM — typical C172S):</p>
 <ol>
  <li><b>Parking brake</b> set (or chocks in place)</li>
  <li><b>Electrical equipment and avionics OFF</b> — <i>before</i> the mixture, to protect the avionics from the voltage spike</li>
  <li><b>Mixture — IDLE CUTOFF.</b> The engine is shut down with the <b>mixture</b>, not the magnetos, so that no unburned fuel is left in the cylinders and the engine cannot be started by a hand-turned prop</li>
  <li><b>Magnetos/Ignition — OFF</b>, and <b>remove the key</b> once the prop stops</li>
  <li><b>Master switch (BAT and ALT) — OFF</b></li>
  <li><b>Fuel selector</b> as specified</li>
  <li><b>Control lock</b> installed</li>
 </ol>
 <div class="dpe"><b>Near-certain DPE question: "Why do you shut down with the mixture instead of the mags?"</b> Two reasons: it <b>burns off the remaining fuel in the cylinders</b>, preventing raw fuel from washing the cylinder walls and diluting the oil; and it leaves the engine in a state where it <b>will not fire</b> if someone moves the propeller. Shutting down with the mags leaves a combustible charge in the cylinder — and if a <b>P-lead is broken</b>, the mag is still hot and the engine can kick.</div>
 <p><b>SECURING THE AIRPLANE:</b></p>
 <ul>
  <li><b>Chocks</b> fore and aft of the wheels, or <b>parking brake</b> (note: parking brakes can bleed off or seize in cold weather — chocks are more reliable for long-term parking)</li>
  <li><b>Tie-downs</b> on <b>both wings and the tail</b>, with the ropes/chains snug — critical for wind and thunderstorms</li>
  <li><b>Control lock</b> installed, or the <b>seatbelt looped through the yoke</b> to prevent control surface damage from wind</li>
  <li><b>Pitot cover</b>, static port covers if used, <b>cowl plugs</b>, and <b>window/canopy cover</b> as appropriate</li>
  <li><b>Doors and windows closed and locked</b>; remove valuables; <b>aircraft security</b> — key removed, prop lock or throttle lock if used</li>
  <li>Park <b>into the wind</b> where possible, clear of jet/prop blast paths and away from taxiway edges</li>
  <li>In freezing conditions: consider an <b>engine preheat plan</b>, drain or protect against water, and cover against frost</li>
 </ul>
 <p><b>POSTFLIGHT INSPECTION — and this is the part most pilots skip:</b></p>
 <ul>
  <li>Walk around the airplane just as you did on preflight, looking for <b>anything that changed during the flight</b></li>
  <li><b>Fluid leaks</b> — oil, fuel, hydraulic/brake fluid under the airplane or on the cowl and gear legs</li>
  <li><b>Oil level</b> and any oil streaking on the cowl or belly</li>
  <li><b>Tires</b> — flat spots from hard braking, cuts, proper inflation; <b>brakes</b> — pad wear, leaking, overheating smell</li>
  <li><b>Propeller</b> — new nicks, gouges, or leading-edge damage (especially after operating from an unimproved surface)</li>
  <li><b>Airframe</b> — new dents, wrinkled skin, popped rivets, damaged antennas, bird or insect strikes</li>
  <li><b>Control surfaces</b> — security, hinges, and no damage</li>
  <li><b>Landing gear and fairings</b> — security, no new damage from a firm landing</li>
  <li><b>Exhaust</b> — security and any new staining or cracks (CO risk)</li>
  <li>Confirm the <b>ELT has not been activated</b> — monitor 121.5 before you shut the radios down, especially after a firm landing</li>
 </ul>
 <p><b>Close out the flight:</b> <b>close your flight plan</b> with Flight Service (not the tower), record <b>Hobbs/tach time</b> and fuel, <b>log the flight</b>, and — most importantly — <b>write up any squawks</b> so the next pilot and the maintenance department know about them. A discrepancy you noticed and didn't report is a discrepancy the next pilot discovers in flight.</p>
 <div class="memo"><b>The point of a postflight:</b> the preflight tells you whether the airplane is ready to fly; the <b>postflight tells you what the flight did to the airplane</b> — and it's the only time damage can be connected to a specific flight. It also means the <i>next</i> pilot's preflight starts from a known state.</div>`},

{id:"XII1", area:"XII", acs:"PA.XII.A.R1", src:"<b>ACS PA.XII.A.R1</b> &middot; AFH ch. 2 &middot; RMH FAA-H-8083-2A", tags:"postflight risk propeller passengers ramp safety",
 q:"What are the risks during after-landing, parking, and securing?",
 a:`<ul>
  <li><b>Runway incursion</b> while taxiing in — just as likely as on the way out, and now you're tired and relaxed</li>
  <li><b>Propeller strike hazards</b> — people, equipment, and animals near the ramp. <b>Never let passengers approach or depart the airplane while the prop is turning</b>, and brief them to exit only when you tell them to and to walk aft/away from the prop arc</li>
  <li><b>Prop/jet blast</b> — your own and others'; don't blast loose equipment, other aircraft, or people</li>
  <li><b>Hot brakes and exhaust</b> — burn hazard to passengers</li>
  <li><b>Fatigue and complacency</b> — the flight isn't over until the airplane is secured; most pilots mentally check out on rollout</li>
  <li><b>Weather exposure</b> — an airplane left untied in forecast thunderstorms or high wind can be destroyed</li>
  <li><b>Fuel contamination/water</b> — refuel after the last flight of the day to reduce condensation in the tanks</li>
 </ul>
 <div class="dpe"><b>DPE follow-up:</b> "Your passenger wants to get out while the engine is running." The answer is no — shut down first. It's one of the simplest and highest-consequence risk decisions a private pilot makes.</div>`}
);

/* ============================================================
   ENGINE
   ============================================================ */
const LS = "pplACS.v1";
let marks = {};
try { marks = JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e){ marks = {}; }
const save = () => { try{ localStorage.setItem(LS, JSON.stringify(marks)); }catch(e){} };

let filterArea = "ALL";   // "ALL" | "PRIO" | area key
let weakOnly = false;
let query = "";
let expanded = false;
let deck = [], di = 0;

const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function visible(){
  const q = query.trim().toLowerCase();
  return DATA.filter(c => {
    if (filterArea === "PRIO" && !c.prio) return false;
    if (filterArea !== "ALL" && filterArea !== "PRIO" && c.area !== filterArea) return false;
    if (weakOnly && (marks[c.id]||0) === 3) return false;
    if (q){
      const hay = (c.acs + " " + c.q + " " + c.a + " " + (c.src||"") + " " + (c.tags||"") + " " + (AREAS[c.area]||"")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderChips(){
  const used = [...new Set(DATA.map(c => c.area))];
  const nPrio = DATA.filter(c => c.prio).length;
  let h = `<button class="chip ${filterArea==="ALL"?"on":""}" data-f="ALL">All (${DATA.length})</button>`;
  h += `<button class="chip prio ${filterArea==="PRIO"?"on":""}" data-f="PRIO">★ Missed codes (${nPrio})</button>`;
  for (const k of Object.keys(AREAS)){
    if (!used.includes(k)) continue;
    const n = DATA.filter(c => c.area === k).length;
    const short = AREAS[k].replace(/^[IVX]+\.\s*/, "");
    h += `<button class="chip ${filterArea===k?"on":""}" data-f="${k}">${k}. ${esc(short)} (${n})</button>`;
  }
  $("#chips").innerHTML = h;
  $("#chips").querySelectorAll(".chip").forEach(b =>
    b.onclick = () => { filterArea = b.dataset.f; renderChips(); render(); window.scrollTo(0,0); });
}

function refsHTML(c){
  return c.src ? `<div class="refs"><b>REFERENCES</b><br>${c.src}</div>` : "";
}

function cardHTML(c){
  const m = marks[c.id] || 0;
  return `<article class="card k-${m} ${c.prio?"prio":""} ${expanded?"open":""}" data-id="${c.id}">
    <div class="q">
      <span class="acs ${c.prio?"prio":""}">${esc(c.acs)}</span>
      <span class="qt">${esc(c.q)}</span>
    </div>
    <div class="a">
      ${c.a}
      ${refsHTML(c)}
      <div class="rate">
        <button class="r1 ${m===1?"on":""}" data-r="1">Review</button>
        <button class="r2 ${m===2?"on":""}" data-r="2">Shaky</button>
        <button class="r3 ${m===3?"on":""}" data-r="3">Solid</button>
      </div>
    </div>
  </article>`;
}

function render(){
  const list = visible();
  $("#nShown").textContent = list.length;
  if (!list.length){
    $("#browse").innerHTML = `<div class="empty">No cards match.<br>Try clearing search or the “Weak only” filter.</div>`;
  } else {
    let h = "", last = null;
    for (const c of list){
      if (c.area !== last){ h += `<div class="areahead">${esc(AREAS[c.area]||c.area)}</div>`; last = c.area; }
      h += cardHTML(c);
    }
    h += `<div class="note"><b>Before you fly:</b> this guide is a study aid, not a regulatory source.
      Verify every number against the current FAR/AIM, the C172S POH/AFM for <i>your</i> tail number,
      the G1000 Cockpit Reference Guide, and current charts for KBEC. Aircraft limitations, weights,
      and airspace change — the POH and the chart always win.</div>`;
    $("#browse").innerHTML = h;
  }
  $("#browse").querySelectorAll(".card").forEach(card => {
    card.querySelector(".q").onclick = () => card.classList.toggle("open");
    card.querySelectorAll(".rate button").forEach(b => b.onclick = ev => {
      ev.stopPropagation();
      const id = card.dataset.id, r = +b.dataset.r;
      marks[id] = (marks[id] === r) ? 0 : r;
      save(); stats();
      card.className = `card k-${marks[id]||0} ${DATA.find(x=>x.id===id).prio?"prio":""} open`;
      card.querySelectorAll(".rate button").forEach(x =>
        x.classList.toggle("on", +x.dataset.r === marks[id]));
    });
  });
  stats();
}

function stats(){
  const t = DATA.length || 1;
  let c3=0,c2=0,c1=0;
  for (const c of DATA){ const m = marks[c.id]||0; if(m===3)c3++; else if(m===2)c2++; else if(m===1)c1++; }
  $("#n3").textContent=c3; $("#n2").textContent=c2; $("#n1").textContent=c1;
  $("#n0").textContent = DATA.length-c3-c2-c1;
  $("#bg").style.width=(c3/t*100)+"%";
  $("#ba").style.width=(c2/t*100)+"%";
  $("#br").style.width=(c1/t*100)+"%";
}

/* ---- flashcard mode ---- */
function buildDeck(){ deck = visible(); di = 0; showCard(); }
function showCard(){
  if (!deck.length){
    $("#fq").textContent = "No cards match the current filters.";
    $("#fa").innerHTML=""; $("#facs").textContent=""; $("#farea").textContent="";
    $("#fcount").textContent=""; return;
  }
  if (di < 0) di = deck.length-1;
  if (di >= deck.length) di = 0;
  const c = deck[di];
  $("#fcard").classList.remove("rev");
  $("#facs").textContent = c.acs;
  $("#facs").className = "acs" + (c.prio ? " prio" : "");
  $("#farea").textContent = AREAS[c.area] || "";
  $("#fq").textContent = c.q;
  $("#fa").innerHTML = c.a + refsHTML(c);
  $("#fcount").textContent = `${di+1} / ${deck.length}`;
  const m = marks[c.id]||0;
  $("#frate").querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.r === m));
}
$("#fcard").onclick = e => { if (!e.target.closest(".rate")) $("#fcard").classList.add("rev"); };
$("#frate").querySelectorAll("button").forEach(b => b.onclick = e => {
  e.stopPropagation();
  const c = deck[di]; if(!c) return;
  marks[c.id] = (marks[c.id] === +b.dataset.r) ? 0 : +b.dataset.r;
  save(); stats();
  $("#frate").querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.r === marks[c.id]));
  setTimeout(() => { di++; showCard(); }, 180);
});
$("#nextBtn").onclick = () => { di++; showCard(); };
$("#prevBtn").onclick = () => { di--; showCard(); };

/* ---- touch: swipe left/right to change cards (iPhone/iPad) ---- */
(function(){
  const el = $("#fcard");
  let x0 = null, y0 = null, lastSwipe = 0;
  el.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  el.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null; y0 = null;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      lastSwipe = Date.now();
      if (dx < 0) di++; else di--;
      showCard();
    }
  }, {passive:true});
  // swallow only the click the browser may synthesize immediately after a swipe
  el.addEventListener("click", e => {
    if (Date.now() - lastSwipe < 400){ e.stopPropagation(); e.preventDefault(); }
  }, true);
})();
$("#shufBtn").onclick = () => { deck.sort(() => Math.random()-0.5); di=0; showCard(); };

/* ---- controls ---- */
$("#modeBtn").onclick = () => {
  document.body.classList.toggle("flashmode");
  const on = document.body.classList.contains("flashmode");
  $("#modeBtn").textContent = on ? "Browse" : "Flashcards";
  $("#modeBtn").classList.toggle("on", on);
  if (on) buildDeck();
};
$("#weakBtn").onclick = () => {
  weakOnly = !weakOnly;
  $("#weakBtn").classList.toggle("on", weakOnly);
  render(); if (document.body.classList.contains("flashmode")) buildDeck();
};
$("#expandBtn").onclick = () => {
  expanded = !expanded;
  $("#expandBtn").textContent = expanded ? "Collapse all" : "Expand all";
  render();
};
$("#q").oninput = e => {
  query = e.target.value; render();
  if (document.body.classList.contains("flashmode")) buildDeck();
};
$("#resetBtn").onclick = () => {
  if (confirm("Clear all your confidence ratings?")){ marks = {}; save(); render(); showCard(); }
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (!document.body.classList.contains("flashmode")) return;
  if (e.key === "ArrowRight"){ di++; showCard(); }
  if (e.key === "ArrowLeft"){ di--; showCard(); }
  if (e.key === " "){ e.preventDefault(); $("#fcard").classList.add("rev"); }
  if (["1","2","3"].includes(e.key)) $("#frate").querySelector(`[data-r="${e.key}"]`).click();
});

/* ---- sort: priority cards first within each area, then by ACS code ---- */
DATA.sort((a,b) => {
  const ai = Object.keys(AREAS).indexOf(a.area), bi = Object.keys(AREAS).indexOf(b.area);
  if (ai !== bi) return ai - bi;
  if (!!b.prio !== !!a.prio) return b.prio ? 1 : -1;
  return a.acs.localeCompare(b.acs, undefined, {numeric:true});
});

renderChips();
render();
</script>
</body>
</html>
